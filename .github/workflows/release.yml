name: Release

# One-shot, manually triggered release. From the Actions tab pick a bump level
# (or type an exact version), and this workflow will: run the full CI gate, cut
# the release commit (version + dated changelog), tag it, reopen the next dev
# cycle, push both commits and the tag to main, and publish a GitHub Release.
# Pushing to main then triggers deploy-pages.yml to ship the new version.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        type: choice
        default: auto
        options:
          - auto # ship the current X.Y.Z-dev as X.Y.Z
          - patch
          - minor
          - major
          - explicit # use the exact value from "version" below
      version:
        description: 'Exact version when bump = explicit (e.g. 1.2.0, no leading v)'
        type: string
        required: false
      reopen_dev:
        description: 'Reopen the next -dev cycle after tagging'
        type: boolean
        default: true

# Least privilege: the job needs to push the release commits, tag, and Release.
permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Cut release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so tags and pushes work as expected.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gate the release on the exact same checks as deploy-pages.yml.
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build site
        run: npm run build

      - name: Resolve version
        id: version
        run: |
          spec='${{ inputs.bump }}'
          if [ "$spec" = "explicit" ]; then
            spec='${{ inputs.version }}'
            if [ -z "$spec" ]; then
              echo "::error::bump=explicit requires the 'version' input"
              exit 1
            fi
          fi
          node scripts/release.mjs resolve "$spec" --github-output

      - name: Fail if tag already exists
        run: |
          tag='${{ steps.version.outputs.tag }}'
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::tag $tag already exists"
            exit 1
          fi

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Prepare release commit
        run: |
          node scripts/release.mjs prepare '${{ steps.version.outputs.release }}'
          git add package.json package-lock.json CHANGELOG.md src/changelog.js
          git commit -m 'Release ${{ steps.version.outputs.tag }}'
          git tag -a '${{ steps.version.outputs.tag }}' \
            -m 'Release ${{ steps.version.outputs.tag }}'

      - name: Reopen development
        if: ${{ inputs.reopen_dev }}
        run: |
          node scripts/release.mjs bump-dev --next '${{ steps.version.outputs.dev }}'
          git add package.json package-lock.json CHANGELOG.md src/changelog.js
          git commit -m 'Begin ${{ steps.version.outputs.dev }} development'

      - name: Push commits and tag
        run: |
          git push origin HEAD:main
          git push origin '${{ steps.version.outputs.tag }}'

      - name: Extract release notes
        run: |
          node scripts/release.mjs notes '${{ steps.version.outputs.release }}' > release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ steps.version.outputs.tag }}' \
            --title '${{ steps.version.outputs.tag }}' \
            --notes-file release-notes.md \
            --target "$(git rev-parse '${{ steps.version.outputs.tag }}^{commit}')"
