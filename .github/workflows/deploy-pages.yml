name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      ref: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
