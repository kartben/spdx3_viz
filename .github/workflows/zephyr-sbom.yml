# Rebuilds the bundled "Zephyr RTOS" sample (public/samples/zephyr/) from
# Zephyr main: the LVGL demos sample built for the M5Stack CoreS3, documented
# with `west spdx --spdx-version 3.0`. The west workspace is zephyr-sbom/west.yml.
#
# Scheduled and manual runs open (or refresh) a pull request from the
# bot/zephyr-sbom branch. Pull requests touching this pipeline only build the
# SBOM and upload it as an artifact, so changes here are tested before merge.
#
# Pull requests opened with GITHUB_TOKEN do not trigger other workflows: close
# and reopen the bot PR (or push to it) to run the PR checks. The repository
# must also allow GitHub Actions to create pull requests (Settings > Actions).
name: Zephyr sample SBOM

on:
  schedule:
    - cron: '41 5 * * 1' # 05:41 UTC every Monday
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/zephyr-sbom.yml
      - zephyr-sbom/**
      - scripts/update-zephyr-sample.mjs

permissions:
  contents: read

concurrency:
  group: zephyr-sbom-${{ github.ref }}
  cancel-in-progress: true

env:
  BOARD: m5stack_cores3/esp32s3/procpu
  APP: zephyr/samples/modules/lvgl/demos

jobs:
  build:
    name: Build sample & generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # The repository root becomes the west workspace: zephyr/ and modules/
      # are checked out next to the app's own files and never committed.
      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@cc223fe61661d8573c1cd3f95f72f90cce729ae9 # v1.0.16
        with:
          app-path: zephyr-sbom
          toolchains: xtensa-espressif_esp32s3_zephyr-elf
          enable-ccache: false

      - name: Build
        run: |
          west build -p always -b "$BOARD" -d build --no-sysbuild "$APP" \
            -- -DCONFIG_BUILD_OUTPUT_META=y

      # A namespace derived from the Zephyr commit, rather than west's random
      # UUID, keeps element IDs stable between runs on the same revision.
      - name: Generate SPDX 3.0 SBOM
        id: spdx
        run: |
          sha="$(git -C zephyr rev-parse HEAD)"
          echo "zephyr-sha=$sha" >> "$GITHUB_OUTPUT"
          west spdx -d build --spdx-version 3.0 \
            -n "http://spdx.org/spdxdocs/zephyr-$sha"
          ls -la build/spdx

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install sample
        run: |
          npm ci
          node scripts/update-zephyr-sample.mjs \
            --spdx-dir build/spdx \
            --zephyr-sha "${{ steps.spdx.outputs.zephyr-sha }}"
          git diff --stat -- public/samples

      - name: Upload sample
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zephyr-sample
          path: |
            public/samples/zephyr/*.jsonld
            public/samples/samples.json
          if-no-files-found: error

    outputs:
      zephyr-sha: ${{ steps.spdx.outputs.zephyr-sha }}

  pull-request:
    name: Open pull request
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Remove previous sample
        run: rm -f public/samples/zephyr/*.jsonld

      - name: Download sample
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: zephyr-sample
          path: public/samples

      - name: Commit and open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ZEPHYR_SHA: ${{ needs.build.outputs.zephyr-sha }}
          BASE: ${{ github.event.repository.default_branch }}
          BRANCH: bot/zephyr-sbom
        run: |
          git add -A public/samples/zephyr public/samples/samples.json
          if git diff --cached --quiet; then
            echo "Sample unchanged; nothing to propose."
            exit 0
          fi
          short="${ZEPHYR_SHA:0:12}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git commit -m "Refresh Zephyr sample SBOM from Zephyr main ($short)"
          git push --force origin "$BRANCH"

          body="$(cat <<EOF
          Regenerates the bundled **Zephyr RTOS** sample (\`public/samples/zephyr/\`) with
          \`west spdx --spdx-version 3.0\`, from the LVGL demos sample built for
          \`$BOARD\` on Zephyr main at
          [\`$short\`](https://github.com/zephyrproject-rtos/zephyr/commit/$ZEPHYR_SHA).

          Generated by the [Zephyr sample SBOM workflow]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID).
          PR checks do not start on their own for bot PRs: close and reopen this PR to run them.
          EOF
          )"
          if [ "$(gh pr view "$BRANCH" --json state -q .state 2>/dev/null)" = "OPEN" ]; then
            gh pr edit "$BRANCH" --body "$body"
          else
            gh pr create --base "$BASE" --head "$BRANCH" \
              --title "Refresh Zephyr sample SBOM from Zephyr main" --body "$body"
          fi
