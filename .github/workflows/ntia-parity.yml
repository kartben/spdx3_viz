name: NTIA parity

# Runs the reference tool (spdx/ntia-conformance-checker) against the bundled
# sample SBOMs and asserts this app's native NTIA scoring agrees with it on the
# elements that share a definition. See scripts/check-ntia-parity.mjs.

# Reusable so pr.yml can fold it into the PR gate; also self-triggers on
# push-to-main and manual dispatch.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  ntia-parity:
    name: NTIA parity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install ntia-conformance-checker
        run: pip install ntia-conformance-checker

      - name: Run the reference tool on the bundled samples
        run: |
          mkdir -p ntia-ref
          node scripts/check-ntia-parity.mjs --list | while IFS=$'\t' read -r id file; do
            echo "::group::sbomcheck $id"
            # sbomcheck exits non-zero for a non-conformant SBOM, which is
            # expected here; the JSON report is still written either way.
            sbomcheck "public/samples/$file" --output json --output-file "ntia-ref/$id.ref.json" || true
            if [ ! -s "ntia-ref/$id.ref.json" ]; then
              echo "::warning::no reference output produced for $id"
            fi
            echo "::endgroup::"
          done

      - name: Compare against this app's NTIA scoring
        run: node scripts/check-ntia-parity.mjs ntia-ref
