# Reusable GitHub Pages build and deploy.
name: Deploy Pages

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build and deploy (tag, branch, or SHA). Defaults to the caller ref.'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.ref }}
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build site
        run: npm run build

      # Serve the bundled NVD CPE index same-origin (so the app's default
      # ./nvd-cpe/ base URL works without CORS). Pulled from the rolling
      # 'nvd-index' release the "Build NVD bundled index" workflow publishes.
      # Optional: if that release doesn't exist yet the deploy still succeeds and
      # the Bundled index source is simply unavailable until it does.
      - name: Include bundled NVD index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/nvd-cpe
          if gh release download nvd-index --repo "$GITHUB_REPOSITORY" --dir dist/nvd-cpe --clobber; then
            echo "Included bundled NVD index:"
            ls -la dist/nvd-cpe
          else
            echo "No 'nvd-index' release yet — skipping; run the 'Build NVD bundled index' workflow to publish it."
            rmdir dist/nvd-cpe 2>/dev/null || true
          fi

      # Same as above for the bundled CVE affected-files index (the app's default
      # ./cve-affected/ base URL). Pulled from the rolling 'cve-affected-index'
      # release; optional, so the deploy still succeeds before it exists.
      - name: Include bundled CVE affected-files index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/cve-affected
          if gh release download cve-affected-index --repo "$GITHUB_REPOSITORY" --dir dist/cve-affected --clobber; then
            echo "Included bundled CVE affected-files index:"
            ls -la dist/cve-affected
          else
            echo "No 'cve-affected-index' release yet — skipping; run the 'Build CVE affected-files index' workflow to publish it."
            rmdir dist/cve-affected 2>/dev/null || true
          fi

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
