<div x-show="currentView === 'configs'" class="fade-in space-y-4 max-w-5xl">
  <div class="flex items-center gap-3 mb-4">
    <span
      class="text-sm text-slate-400"
      x-text="`${filteredConfigs.length} build configurations`"
    ></span>
    <div class="ml-auto flex items-center gap-2">
      <input
        type="text"
        x-model="configSearch"
        placeholder="Search configs..."
        class="w-48 px-3 py-1.5 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-teal-500 transition-colors"
      />
    </div>
  </div>

  <template
    x-for="cfg in (mountedViews.configs ? renderSlice('configs', filteredConfigs) : [])"
    :key="cfg.spdxId"
  >
    <div
      class="card group cursor-pointer"
      data-nav-kind="config"
      :data-nav-id="cfg.spdxId"
      :class="isNavTarget('config', cfg.spdxId) && 'target-focus'"
      @click="toggleConfig(cfg.spdxId)"
    >
      <div class="flex items-start gap-3">
        <!-- Icon -->
        <div
          class="w-10 h-10 rounded-xl bg-teal-500/15 flex items-center justify-center flex-shrink-0 mt-0.5"
        >
          <span
            class="flex items-center justify-center text-teal-400"
            x-html="elementIcon(cfg, 'w-5 h-5')"
          ></span>
        </div>

        <!-- Info -->
        <div class="flex-1 min-w-0">
          <div
            class="font-medium text-white text-sm"
            x-text="cfg.name || cleanName(cfg.spdxId)"
          ></div>

          <!-- Quick info row -->
          <div class="flex flex-wrap items-center gap-2 mt-2">
            <template x-for="lang in parseCompileFlags(cfg).languages.slice(0, 3)" :key="lang">
              <span class="badge bg-blue-500/15 text-blue-400 text-xs" x-text="lang"></span>
            </template>
            <span
              class="badge bg-teal-500/15 text-teal-400 text-xs"
              x-text="parseCompileFlags(cfg).flags.length + ' flags'"
            ></span>
            <span
              class="badge bg-amber-500/15 text-amber-400 text-xs"
              x-text="parseCompileFlags(cfg).defines.length + ' defines'"
            ></span>
          </div>

          <!-- Configured targets preview -->
          <div
            class="flex flex-wrap items-center gap-1.5 mt-2"
            x-show="configuresTargets(cfg.spdxId).length > 0"
          >
            <span class="text-xs text-slate-500">Configures:</span>
            <template x-for="t in configuresTargets(cfg.spdxId).slice(0, 3)" :key="t">
              <span
                class="text-xs text-emerald-400 hover:text-emerald-300"
                x-text="cleanFileName(t)"
                @click.stop="navigateToFile(t)"
              ></span>
            </template>
            <span
              x-show="configuresTargets(cfg.spdxId).length > 3"
              class="text-xs text-slate-500"
              x-text="'+' + (configuresTargets(cfg.spdxId).length - 3) + ' more'"
            ></span>
          </div>
        </div>

        <!-- Expand icon -->
        <svg
          class="w-4 h-4 text-slate-500 transition-transform flex-shrink-0 mt-1"
          :class="expandedConfig === cfg.spdxId && 'rotate-180'"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 9l-7 7-7-7"
          />
        </svg>
      </div>

      <!-- Expanded detail -->
      <div
        x-show="expandedConfig === cfg.spdxId"
        x-collapse
        class="mt-4 pt-4 border-t border-slate-700"
        @click.stop
      >
        <!-- Compiler Flags Section -->
        <div class="mb-4" x-show="parseCompileFlags(cfg).flags.length > 0">
          <div
            class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-2"
          >
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"
              />
            </svg>
            Compiler Flags
          </div>
          <div class="flex flex-wrap gap-1.5">
            <template x-for="flag in parseCompileFlags(cfg).flags.slice(0, 30)" :key="flag">
              <span
                class="inline-flex items-center px-2 py-0.5 rounded text-xs font-mono transition-colors"
                :class="flag.startsWith('-O') ? 'bg-green-500/15 text-green-400' :
                                  flag.startsWith('-W') ? 'bg-yellow-500/15 text-yellow-400' :
                                  flag.startsWith('-f') ? 'bg-blue-500/15 text-blue-400' :
                                  flag.startsWith('-m') ? 'bg-purple-500/15 text-purple-400' :
                                  flag.startsWith('-std') ? 'bg-pink-500/15 text-pink-400' :
                                  flag.startsWith('-g') ? 'bg-orange-500/15 text-orange-400' :
                                  'bg-slate-700/50 text-slate-300'"
                x-text="flag"
              ></span>
            </template>
            <span
              x-show="parseCompileFlags(cfg).flags.length > 30"
              class="text-xs text-slate-500 self-center ml-1"
              x-text="'+' + (parseCompileFlags(cfg).flags.length - 30) + ' more'"
            ></span>
          </div>

          <!-- Flag Legend -->
          <div class="flex flex-wrap gap-3 mt-3 text-[10px] text-slate-500">
            <span class="flex items-center gap-1"
              ><span class="w-2 h-2 rounded bg-green-500/40"></span> Optimization</span
            >
            <span class="flex items-center gap-1"
              ><span class="w-2 h-2 rounded bg-yellow-500/40"></span> Warnings</span
            >
            <span class="flex items-center gap-1"
              ><span class="w-2 h-2 rounded bg-blue-500/40"></span> Features</span
            >
            <span class="flex items-center gap-1"
              ><span class="w-2 h-2 rounded bg-purple-500/40"></span> Machine</span
            >
            <span class="flex items-center gap-1"
              ><span class="w-2 h-2 rounded bg-pink-500/40"></span> Standard</span
            >
            <span class="flex items-center gap-1"
              ><span class="w-2 h-2 rounded bg-orange-500/40"></span> Debug</span
            >
          </div>
        </div>

        <!-- Preprocessor Defines Section -->
        <div class="mb-4" x-show="parseCompileFlags(cfg).defines.length > 0">
          <div
            class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-2"
          >
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14"
              />
            </svg>
            Preprocessor Defines
          </div>
          <div class="flex flex-wrap gap-1.5">
            <template x-for="def in parseCompileFlags(cfg).defines" :key="def">
              <span
                class="inline-flex items-center px-2 py-0.5 rounded text-xs font-mono bg-amber-500/15 text-amber-400"
                x-text="def"
              ></span>
            </template>
          </div>
        </div>

        <!-- Configured Targets Section -->
        <div x-show="configuresTargets(cfg.spdxId).length > 0">
          <div
            class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-2"
          >
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
              />
            </svg>
            Configured Targets
            <span
              class="text-slate-500 font-normal"
              x-text="'(' + configuresTargets(cfg.spdxId).length + ')'"
            ></span>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <template x-for="t in configuresTargets(cfg.spdxId)" :key="t">
              <div
                class="flex items-center gap-2 px-2 py-1.5 rounded-lg bg-slate-800/50 hover:bg-slate-700/50 cursor-pointer transition-colors"
                @click="navigateToFile(t)"
              >
                <span class="w-2 h-2 rounded-full bg-emerald-500/50"></span>
                <span class="text-xs text-emerald-400 truncate" x-text="cleanFileName(t)"></span>
              </div>
            </template>
          </div>
        </div>

        <!-- Full command (collapsible) -->
        <div class="mt-4" x-show="cfg.comment">
          <details class="group/details">
            <summary
              class="text-xs font-semibold text-slate-400 uppercase tracking-wider cursor-pointer hover:text-slate-300 flex items-center gap-2"
            >
              <svg
                class="w-3 h-3 transition-transform group-open/details:rotate-90"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M9 5l7 7-7 7"
                />
              </svg>
              Full Compile Command
            </summary>
            <div
              class="mt-2 p-3 rounded-lg bg-slate-900/70 border border-slate-700/50 overflow-x-auto"
            >
              <code
                class="text-xs text-slate-300 font-mono whitespace-pre-wrap break-all"
                x-text="cfg.comment"
              ></code>
            </div>
          </details>
        </div>
      </div>
    </div>
  </template>

  <!-- Empty state -->
  <div x-show="filteredConfigs.length === 0" class="text-center py-12">
    <div class="w-16 h-16 mx-auto mb-4 rounded-xl bg-slate-800 flex items-center justify-center">
      <svg class="w-8 h-8 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"
        />
      </svg>
    </div>
    <h3 class="text-sm font-medium text-slate-300 mb-1">No build configurations found</h3>
    <p class="text-xs text-slate-500">
      Try a different search or load an SPDX file with build info
    </p>
  </div>
</div>
