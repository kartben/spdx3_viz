<div x-show="currentView === 'dashboard'" class="fade-in space-y-6 max-w-6xl">
  <!-- Document metadata -->
  <div class="card">
    <div class="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">
      <div class="min-w-0">
        <h3 class="text-lg font-semibold text-white mb-1" x-text="docName"></h3>
        <p class="text-sm text-slate-400 mb-1 break-words" x-text="docNamespace"></p>
        <p x-show="loadedFiles.length > 1" class="text-xs text-slate-500 mb-3">
          Merged from
          <span class="text-slate-300 font-medium" x-text="loadedFiles.length"></span>
          files:
          <span x-text="loadedFiles.map(f => f.name).join(', ')"></span>
        </p>
        <p x-show="loadedFiles.length <= 1" class="mb-3"></p>
        <div class="flex flex-wrap gap-2">
          <template x-for="t in sbomTypes" :key="t">
            <span class="badge bg-indigo-500/15 text-indigo-400">
              <span x-text="t + ' SBOM'"></span>
            </span>
          </template>
          <template x-for="p in profileConformance" :key="p">
            <span class="badge bg-emerald-500/15 text-emerald-400">
              <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M5 13l4 4L19 7"
                />
              </svg>
              <span x-text="p"></span>
            </span>
          </template>
        </div>
      </div>
      <div class="text-left sm:text-right text-sm flex-shrink-0">
        <div class="text-slate-400">
          Spec <span class="text-white font-medium" x-text="specVersion"></span>
        </div>
        <div class="text-slate-400 mt-1">
          Created
          <span class="text-white font-medium" x-text="formatDate(createdDate)"></span>
        </div>
        <div
          class="text-slate-400 mt-1 flex flex-wrap items-center gap-x-1 gap-y-0.5 sm:justify-end"
          x-show="creators.length"
        >
          <span>By</span>
          <template x-for="(c, i) in creators" :key="c.id">
            <span class="inline-flex items-center">
              <button
                @click="navigateTo(c.id)"
                class="text-white font-medium hover:text-red-300 hover:underline decoration-slate-600 underline-offset-2 transition-colors"
                :title="'View agent: ' + c.name"
                x-text="c.name"
              ></button>
              <span x-show="i < creators.length - 1" class="text-slate-500">,</span>
            </span>
          </template>
        </div>
        <div class="text-slate-400 mt-1" x-show="creatorTools.length">
          Using
          <span
            class="text-white font-medium"
            x-text="creatorTools.map(t => t.name).join(', ')"
          ></span>
        </div>
        <div
          class="text-slate-400 mt-1"
          x-show="externalRefStats.total"
          title="Elements referenced via SPDX 3 ExternalMap imports (defined outside this document)"
        >
          Imports
          <span class="text-white font-medium" x-text="formatCount(externalRefStats.total)"></span>
          <span
            x-show="externalRefStats.unresolved"
            class="text-amber-400/80"
            x-text="'(' + formatCount(externalRefStats.unresolved) + ' unresolved)'"
          ></span>
        </div>
        <div class="mt-2" x-show="dataLicenseLabel">
          <span class="badge bg-pink-500/15 text-pink-400" x-text="dataLicenseLabel"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Stats grid (order matches sidebar nav) -->
  <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 sm:gap-4">
    <button
      type="button"
      @click="switchView('packages')"
      class="card stat-card stat-card-link blue hover:border-blue-500/50"
    >
      <div class="text-2xl font-bold text-white" x-text="packages.length"></div>
      <div class="text-sm text-slate-400 mt-1">Packages</div>
      <div class="w-8 h-8 mt-2 rounded-lg bg-blue-500/15 flex items-center justify-center">
        <span
          class="flex items-center justify-center text-blue-400"
          x-html="nodeTypeIconSvg('package', 'w-4 h-4')"
        ></span>
      </div>
    </button>
    <button
      type="button"
      @click="switchView('files')"
      class="card stat-card stat-card-link green hover:border-emerald-500/50"
    >
      <div class="text-2xl font-bold text-white" x-text="files.length"></div>
      <div class="text-sm text-slate-400 mt-1">Files</div>
      <div class="w-8 h-8 mt-2 rounded-lg bg-emerald-500/15 flex items-center justify-center">
        <span
          class="flex items-center justify-center text-emerald-400"
          x-html="nodeTypeIconSvg('file', 'w-4 h-4')"
        ></span>
      </div>
    </button>
    <button
      type="button"
      x-show="hardware.length > 0"
      @click="switchView('hardware')"
      class="card stat-card stat-card-link lime hover:border-lime-500/50"
    >
      <div class="text-2xl font-bold text-white" x-text="hardware.length"></div>
      <div class="text-sm text-slate-400 mt-1">Hardware</div>
      <div class="w-8 h-8 mt-2 rounded-lg bg-lime-500/15 flex items-center justify-center">
        <span
          class="flex items-center justify-center text-lime-400"
          x-html="nodeTypeIconSvg('hardware', 'w-4 h-4')"
        ></span>
      </div>
    </button>
    <button
      type="button"
      x-show="requirements.length > 0"
      @click="switchView('requirements')"
      class="card stat-card stat-card-link gold hover:border-yellow-500/50"
    >
      <div class="text-2xl font-bold text-white" x-text="requirements.length"></div>
      <div class="text-sm text-slate-400 mt-1">Functional Safety</div>
      <div class="w-8 h-8 mt-2 rounded-lg bg-yellow-500/15 flex items-center justify-center">
        <span
          class="flex items-center justify-center text-yellow-400"
          x-html="nodeTypeIconSvg('requirement', 'w-4 h-4')"
        ></span>
      </div>
    </button>
    <button
      type="button"
      @click="switchView('licenses')"
      class="card stat-card stat-card-link pink hover:border-pink-500/50"
    >
      <div class="text-2xl font-bold text-white" x-text="licenses.length"></div>
      <div class="text-sm text-slate-400 mt-1">Licenses</div>
      <div class="w-8 h-8 mt-2 rounded-lg bg-pink-500/15 flex items-center justify-center">
        <span
          class="flex items-center justify-center text-pink-400"
          x-html="nodeTypeIconSvg('license', 'w-4 h-4')"
        ></span>
      </div>
    </button>
    <button
      type="button"
      x-show="buildConfigs.length > 0"
      @click="switchView('configs')"
      class="card stat-card stat-card-link teal hover:border-teal-500/50"
    >
      <div class="text-2xl font-bold text-white" x-text="buildConfigs.length"></div>
      <div class="text-sm text-slate-400 mt-1">Build Configs</div>
      <div class="w-8 h-8 mt-2 rounded-lg bg-teal-500/15 flex items-center justify-center">
        <span
          class="flex items-center justify-center text-teal-400"
          x-html="nodeTypeIconSvg('config', 'w-4 h-4')"
        ></span>
      </div>
    </button>
    <button
      type="button"
      @click="switchView('build')"
      class="card stat-card stat-card-link purple hover:border-purple-500/50"
    >
      <div class="text-2xl font-bold text-white" x-text="builds.length"></div>
      <div class="text-sm text-slate-400 mt-1">Build</div>
      <div class="w-8 h-8 mt-2 rounded-lg bg-purple-500/15 flex items-center justify-center">
        <span
          class="flex items-center justify-center text-purple-400"
          x-html="nodeTypeIconSvg('build', 'w-4 h-4')"
        ></span>
      </div>
    </button>
  </div>

  <!-- Security / VEX summary -->
  <div x-show="vulnerabilities.length > 0" class="card">
    <div class="flex items-center gap-2 mb-4">
      <div class="w-8 h-8 rounded-lg bg-rose-500/15 flex items-center justify-center flex-shrink-0">
        <span
          class="flex items-center justify-center text-rose-400"
          x-html="nodeTypeIconSvg('vulnerability', 'w-4 h-4')"
        ></span>
      </div>
      <h3 class="text-sm font-semibold text-white">Security &amp; VEX</h3>
      <span
        class="text-xs text-slate-400"
        x-text="`${formatCount(securitySummary.total)} vulnerabilities`"
      ></span>
      <button
        @click="switchView('security')"
        class="ml-auto text-xs text-rose-300 hover:text-rose-200 inline-flex items-center gap-1"
      >
        View all
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>
      </button>
    </div>
    <!-- Stacked status bar -->
    <div class="flex h-2.5 w-full rounded-full overflow-hidden bg-slate-700 mb-3">
      <template x-for="s in securityStatusOrder" :key="s">
        <div
          class="h-full first:rounded-l-full last:rounded-r-full"
          :style="`width:${(securitySummary.counts[s] / securitySummary.total) * 100}%; background:${vexStatusMeta(s).color}`"
          :title="`${vexStatusMeta(s).label}: ${securitySummary.counts[s]}`"
        ></div>
      </template>
    </div>
    <!-- Status chips (click to open the security view filtered by status) -->
    <div class="flex flex-wrap gap-2">
      <template x-for="s in securityStatusOrder" :key="s">
        <button
          @click="securityStatusFilter = s; securitySearch = ''; restreamView('security'); switchView('security')"
          class="badge hover:brightness-125 transition"
          :class="vexStatusMeta(s).badgeClass"
          :title="`Show ${vexStatusMeta(s).label} vulnerabilities`"
        >
          <span class="w-1.5 h-1.5 rounded-full mr-1.5" :class="vexStatusMeta(s).dotClass"></span>
          <span x-text="vexStatusMeta(s).label"></span>
          <span class="ml-1.5 font-semibold" x-text="formatCount(securitySummary.counts[s])"></span>
        </button>
      </template>
    </div>
  </div>

  <!-- Relationship breakdown -->
  <div class="card">
    <h3 class="text-sm font-semibold text-white mb-4">Relationship Types</h3>
    <div class="space-y-3">
      <template x-for="rt in relTypeCounts" :key="rt.type">
        <div>
          <div class="flex items-center justify-between text-sm mb-1">
            <span class="text-slate-300" x-text="rt.type"></span>
            <span class="text-slate-400" x-text="rt.count"></span>
          </div>
          <div class="h-2 bg-slate-700 rounded-full overflow-hidden">
            <div
              class="h-full rounded-full transition-all duration-500"
              :style="`width: ${rt.pct}%; background-color: ${rt.color}`"
            ></div>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- Quick jump -->
  <div class="grid grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-4">
    <button @click="switchView('graph')" class="card hover:border-blue-500/50 text-left group">
      <div class="text-blue-400 mb-2">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2-1-2 1M4 7l2-1M4 7l2 1M4 7v2.5M12 21l-2-1m2 1l2-1m-2 1v-2.5M6 18l-2-1v-2.5M18 18l2-1v-2.5"
          />
        </svg>
      </div>
      <div class="font-medium text-white text-sm">Explore Graph</div>
      <div class="text-xs text-slate-400 mt-1">Interactive force-directed visualization</div>
    </button>
    <button @click="switchView('packages')" class="card hover:border-blue-500/50 text-left group">
      <div class="text-emerald-400 mb-2">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"
          />
        </svg>
      </div>
      <div class="font-medium text-white text-sm">Browse Packages</div>
      <div class="text-xs text-slate-400 mt-1">
        Search and explore <span x-text="packages.length"></span> packages
      </div>
    </button>
    <button
      x-show="buildConfigs.length > 0"
      @click="switchView('configs')"
      class="card hover:border-teal-500/50 text-left group"
    >
      <div class="text-teal-400 mb-2">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"
          />
        </svg>
      </div>
      <div class="font-medium text-white text-sm">Build Configs</div>
      <div class="text-xs text-slate-400 mt-1">Compiler flags, defines, targets</div>
    </button>
  </div>
</div>
