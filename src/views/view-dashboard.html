<div x-show="currentView === 'dashboard'" class="fade-in space-y-5 max-w-6xl">
  <!-- Document identity and the two most useful next actions. -->
  <section class="card overflow-hidden relative">
    <div
      class="absolute inset-x-0 top-0 h-px bg-gradient-to-r from-blue-500/0 via-blue-400/70 to-purple-500/0"
    ></div>
    <div class="flex flex-col gap-5 lg:flex-row lg:items-start lg:justify-between">
      <div class="min-w-0">
        <div class="flex flex-wrap items-center gap-2 mb-2">
          <template x-for="t in sbomTypes" :key="t">
            <span class="badge bg-indigo-500/15 text-indigo-300" x-text="t + ' SBOM'"></span>
          </template>
          <template x-for="p in profileConformance" :key="p">
            <span class="badge bg-emerald-500/15 text-emerald-400">
              <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M5 13l4 4L19 7"
                />
              </svg>
              <span x-text="p"></span>
            </span>
          </template>
        </div>
        <h2
          class="text-xl sm:text-2xl font-semibold text-white tracking-tight break-words"
          x-text="docName"
        ></h2>
        <p class="text-xs sm:text-sm text-slate-500 mt-1 break-all" x-text="docNamespace"></p>

        <div class="flex flex-wrap items-center gap-x-4 gap-y-1.5 mt-4 text-xs text-slate-400">
          <span
            >SPDX <strong class="text-slate-200 font-medium" x-text="specVersion"></strong
          ></span>
          <span
            >Created
            <strong class="text-slate-200 font-medium" x-text="formatDate(createdDate)"></strong
          ></span>
          <span x-show="creators.length">
            By
            <button
              @click="navigateTo(creators[0].id)"
              class="text-slate-200 font-medium hover:text-blue-300 transition-colors"
              x-text="creators[0]?.name"
            ></button>
            <span x-show="creators.length > 1" x-text="` +${creators.length - 1}`"></span>
          </span>
          <span
            x-show="loadedFiles.length > 1"
            x-text="`${loadedFiles.length} merged files`"
          ></span>
          <span
            x-show="dataLicenseLabel"
            class="badge bg-pink-500/15 text-pink-400"
            x-text="dataLicenseLabel"
          ></span>
        </div>
      </div>

      <div class="flex flex-wrap gap-2 flex-shrink-0">
        <button
          type="button"
          @click="switchView('graph')"
          class="inline-flex items-center gap-2 rounded-lg bg-blue-500 px-4 py-2.5 text-sm font-semibold text-white hover:bg-blue-400 transition-colors shadow-lg shadow-blue-950/30"
        >
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <circle cx="5" cy="6" r="2" stroke-width="2"></circle>
            <circle cx="19" cy="6" r="2" stroke-width="2"></circle>
            <circle cx="12" cy="18" r="2" stroke-width="2"></circle>
            <path d="M7 7l4 9m6-9l-4 9M7 6h10" stroke-width="2"></path>
          </svg>
          Explore graph
        </button>
        <button
          type="button"
          @click="switchView('raw')"
          class="inline-flex items-center gap-2 rounded-lg border border-slate-600 bg-slate-800/60 px-3.5 py-2.5 text-sm font-medium text-slate-300 hover:border-slate-500 hover:text-white transition-colors"
        >
          View source
        </button>
      </div>
    </div>
  </section>

  <!-- High-signal summaries. Each card links to the view where the user can act. -->
  <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
    <button
      type="button"
      @click="switchView('statistics')"
      class="card text-left group hover:border-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50"
    >
      <div class="flex items-start justify-between gap-4">
        <div>
          <div class="text-xs font-semibold uppercase tracking-wider text-slate-500">
            Completeness
          </div>
          <div class="flex items-baseline gap-2 mt-2">
            <span
              class="text-3xl font-bold text-white tabular-nums"
              x-text="qualityReport.overall.score"
            ></span>
            <span class="text-sm text-slate-500">/ 100</span>
            <span
              class="badge ml-1"
              :class="qualityGradeMeta(qualityReport.overall.grade).badgeClass"
              x-text="'Grade ' + qualityReport.overall.grade"
            ></span>
          </div>
        </div>
        <div
          class="relative w-12 h-12 rounded-full flex items-center justify-center flex-shrink-0"
          :style="qualityRingStyle(qualityReport.overall.score, qualityGradeMeta(qualityReport.overall.grade).color)"
        >
          <div class="absolute inset-1.5 rounded-full bg-slate-800"></div>
        </div>
      </div>
      <p class="text-xs text-slate-400 mt-4 leading-relaxed">
        Metadata, licensing, provenance, integrity and structural coverage.
      </p>
      <span
        class="inline-flex items-center gap-1 text-xs text-blue-300 mt-3 group-hover:text-blue-200"
      >
        See quality details <span aria-hidden="true">→</span>
      </span>
    </button>

    <button
      type="button"
      @click="switchView('remediation')"
      class="card text-left group hover:border-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500/50"
    >
      <div class="text-xs font-semibold uppercase tracking-wider text-slate-500">Remediation</div>
      <div class="flex items-baseline gap-2 mt-2">
        <span
          class="text-3xl font-bold tabular-nums"
          :class="remediationSummary.counts.critical + remediationSummary.counts.high ? 'text-rose-300' : remediationSummary.counts.medium ? 'text-amber-300' : 'text-white'"
          x-text="formatCount(remediationSummary.total)"
        ></span>
        <span class="text-sm text-slate-400">findings</span>
      </div>
      <div class="flex flex-wrap gap-x-3 gap-y-1 mt-4 text-xs">
        <span
          x-show="remediationSummary.counts.critical + remediationSummary.counts.high"
          class="text-rose-300"
        >
          <strong
            x-text="formatCount(remediationSummary.counts.critical + remediationSummary.counts.high)"
          ></strong>
          high+
        </span>
        <span x-show="remediationSummary.counts.medium" class="text-amber-300">
          <strong x-text="formatCount(remediationSummary.counts.medium)"></strong> medium
        </span>
        <span x-show="remediationSummary.counts.low" class="text-blue-300">
          <strong x-text="formatCount(remediationSummary.counts.low)"></strong> low
        </span>
      </div>
      <p class="text-xs text-slate-400 mt-3 leading-relaxed">
        Actionable quality, security, license, import, and safety fixes.
      </p>
      <span
        class="inline-flex items-center gap-1 text-xs text-amber-300 mt-3 group-hover:text-amber-200"
      >
        Open remediation list <span aria-hidden="true">→</span>
      </span>
    </button>

    <button
      type="button"
      @click="allVulnerabilities.length && switchView('security')"
      class="card text-left group focus:outline-none focus:ring-2 focus:ring-rose-500/50"
      :class="allVulnerabilities.length ? 'cursor-pointer hover:border-slate-500' : 'cursor-default'"
    >
      <div class="text-xs font-semibold uppercase tracking-wider text-slate-500">
        Security &amp; VEX
      </div>
      <template x-if="allVulnerabilities.length">
        <div>
          <div class="flex items-baseline gap-2 mt-2">
            <span
              class="text-3xl font-bold text-white tabular-nums"
              x-text="formatCount(securitySummary.total)"
            ></span>
            <span class="text-sm text-slate-400">vulnerabilities</span>
          </div>
          <div class="flex h-1.5 w-full rounded-full overflow-hidden bg-slate-700 mt-4">
            <template x-for="s in securityStatusOrder" :key="s">
              <span
                :style="`width:${(securitySummary.counts[s] / securitySummary.total) * 100}%; background:${vexStatusMeta(s).color}`"
                :title="`${vexStatusMeta(s).label}: ${securitySummary.counts[s]}`"
              ></span>
            </template>
          </div>
          <div class="flex flex-wrap gap-x-3 gap-y-1 mt-3 text-xs">
            <span x-show="securitySummary.counts.affected" class="text-rose-300">
              <strong x-text="formatCount(securitySummary.counts.affected)"></strong> affected
            </span>
            <span x-show="securitySummary.counts.under_investigation" class="text-amber-300">
              <strong x-text="formatCount(securitySummary.counts.under_investigation)"></strong>
              investigating
            </span>
            <span
              x-show="securitySummary.counts.fixed + securitySummary.counts.not_affected"
              class="text-emerald-300"
            >
              <strong
                x-text="formatCount(securitySummary.counts.fixed + securitySummary.counts.not_affected)"
              ></strong>
              resolved
            </span>
          </div>
          <div class="mt-3 flex flex-wrap items-center gap-x-4 gap-y-1">
            <span
              class="inline-flex items-center gap-1 text-xs text-rose-300 group-hover:text-rose-200"
            >
              Review findings <span aria-hidden="true">→</span>
            </span>
            <span
              x-show="canSyncOnline"
              @click.stop="switchView('security'); if (onlineSync.status === 'idle' || onlineSync.status === 'error') startOnlineSync()"
              class="inline-flex items-center gap-1 text-xs text-sky-300 hover:text-sky-200 cursor-pointer"
              title="Look up CVEs from public databases (OSV.dev) by PackageURL"
            >
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M3 12a9 9 0 0018 0 9 9 0 00-18 0zm9-9v18m-9-9h18"
                />
              </svg>
              <span x-text="hasOnlineData ? 'Synced online' : 'Check public databases'"></span>
            </span>
          </div>
        </div>
      </template>
      <template x-if="!allVulnerabilities.length">
        <div>
          <div class="text-xl font-semibold text-slate-200 mt-2">No vulnerability data</div>
          <p class="text-xs text-slate-400 mt-3 leading-relaxed">
            This document does not include vulnerability or VEX records. This is not a clean bill of
            health.
          </p>
          <span
            x-show="canSyncOnline"
            @click.stop="switchView('security'); if (onlineSync.status === 'idle' || onlineSync.status === 'error') startOnlineSync()"
            class="inline-flex items-center gap-1 text-xs text-sky-300 hover:text-sky-200 cursor-pointer mt-3"
            title="Look up CVEs from public databases (OSV.dev) by PackageURL"
          >
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 12a9 9 0 0018 0 9 9 0 00-18 0zm9-9v18m-9-9h18"
              />
            </svg>
            Check public databases (OSV)
          </span>
        </div>
      </template>
    </button>

    <button
      type="button"
      @click="switchView('graph')"
      class="card text-left group hover:border-slate-500 focus:outline-none focus:ring-2 focus:ring-purple-500/50"
    >
      <div class="text-xs font-semibold uppercase tracking-wider text-slate-500">Structure</div>
      <div class="flex items-baseline gap-2 mt-2">
        <span
          class="text-3xl font-bold text-white tabular-nums"
          x-text="formatCount(elementMap.size)"
        ></span>
        <span class="text-sm text-slate-400">elements</span>
      </div>
      <div class="grid grid-cols-2 gap-3 mt-4">
        <div>
          <div
            class="text-lg font-semibold text-slate-200 tabular-nums"
            x-text="formatCount(relationships.length)"
          ></div>
          <div class="text-[11px] text-slate-500">relationships</div>
        </div>
        <div>
          <div
            class="text-lg font-semibold tabular-nums"
            :class="externalRefStats.unresolved ? 'text-amber-300' : 'text-slate-200'"
            x-text="formatCount(externalRefStats.unresolved)"
          ></div>
          <div class="text-[11px] text-slate-500">unresolved imports</div>
        </div>
      </div>
      <span
        class="inline-flex items-center gap-1 text-xs text-purple-300 mt-3 group-hover:text-purple-200"
      >
        Map connections <span aria-hidden="true">→</span>
      </span>
    </button>
  </div>

  <!-- A compact inventory adapts to software, hardware, AI, build and safety SBOMs. -->
  <section class="card">
    <div class="flex items-center justify-between gap-3 mb-4">
      <div>
        <h3 class="text-sm font-semibold text-white">Browse this SBOM</h3>
        <p class="text-xs text-slate-500 mt-0.5">Only data present in this document is shown.</p>
      </div>
    </div>
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2.5">
      <template x-for="item in dashboardInventory" :key="item.view">
        <button
          type="button"
          @click="switchView(item.view)"
          class="flex items-center gap-3 rounded-lg border border-slate-700/70 bg-slate-900/30 px-3 py-3 text-left hover:bg-slate-700/30 hover:border-slate-600 transition-colors min-w-0"
        >
          <span
            class="w-8 h-8 rounded-lg bg-slate-700/50 flex items-center justify-center flex-shrink-0"
            :style="`color:${nodeTypeColor(item.type)}`"
            x-html="nodeTypeIconSvg(item.type, 'w-4 h-4')"
          ></span>
          <span class="min-w-0">
            <strong
              class="block text-base text-white tabular-nums leading-none"
              x-text="formatCount(item.count)"
            ></strong>
            <span class="block text-xs text-slate-400 mt-1 truncate" x-text="item.label"></span>
          </span>
        </button>
      </template>
    </div>
  </section>
</div>
