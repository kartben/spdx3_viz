<div
  x-show="snippetModalOpen"
  x-transition.opacity
  @keydown.escape.window="closeSnippetModal()"
  class="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm"
  @click.self="closeSnippetModal()"
  style="display: none"
>
  <div
    class="flex max-h-[85vh] w-full max-w-3xl flex-col overflow-hidden rounded-xl border border-slate-700 bg-slate-800 shadow-2xl"
    @click.stop
  >
    <!-- Header -->
    <div class="flex items-center gap-3 border-b border-slate-700 px-5 py-3.5">
      <span
        class="flex h-8 w-8 flex-shrink-0 items-center justify-center rounded-lg bg-emerald-500/15 text-emerald-400"
      >
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"
          />
        </svg>
      </span>
      <div class="min-w-0 flex-1">
        <div
          class="truncate text-sm font-semibold text-white"
          x-text="snippetModal?.name || snippetModal?.baseName || 'Snippet'"
        ></div>
        <div
          class="truncate font-mono text-xs text-slate-500"
          x-text="snippetModal?.fileName"
        ></div>
      </div>
      <span
        x-show="snippetModal?.start != null"
        class="badge flex-shrink-0 bg-amber-400/10 text-xs text-amber-300"
        x-text="snippetModal?.rangeCount > 1
          ? snippetModal.rangeCount + ' ranges'
          : 'L' + snippetModal?.start + (snippetModal?.end && snippetModal?.end !== snippetModal?.start ? '-' + snippetModal?.end : '')"
      ></span>
      <button
        type="button"
        class="flex flex-shrink-0 items-center gap-1 rounded-lg bg-slate-700 px-2.5 py-1.5 text-xs font-medium text-slate-200 transition-colors hover:bg-slate-600"
        @click="openSnippetFile()"
      >
        Open file
        <svg class="h-3 w-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>
      </button>
      <a
        x-show="snippetModal?.sourceUrl"
        :href="snippetModal?.sourceUrl"
        target="_blank"
        rel="noopener"
        class="flex-shrink-0 text-xs text-slate-500 hover:text-slate-300"
        >Raw ↗</a
      >
      <button
        type="button"
        class="flex-shrink-0 rounded-lg p-1.5 text-slate-400 transition-colors hover:bg-slate-700 hover:text-white"
        @click="closeSnippetModal()"
        title="Close"
      >
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>

    <!-- Body: full file source, snippet lines highlighted -->
    <div id="snippet-modal-body" class="min-h-0 flex-1 overflow-auto">
      <template x-if="snippetModal">
        <div>
          <div
            x-show="fileSourceCache[snippetModal.fileId]?.loading"
            class="flex items-center gap-2 p-4 text-xs text-slate-500"
          >
            <svg class="h-3.5 w-3.5 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
              ></path>
            </svg>
            Loading source…
          </div>
          <div
            x-show="fileSourceCache[snippetModal.fileId]?.error"
            class="p-4 text-xs text-red-400/80"
          >
            Could not load source:
            <span x-text="fileSourceCache[snippetModal.fileId]?.error"></span>
          </div>
          <div
            x-show="!snippetModal.sourceUrl && !fileSourceCache[snippetModal.fileId]"
            class="p-4 text-xs italic text-slate-500"
          >
            Source not available for this file.
          </div>
          <template x-if="snippetModalSegments">
            <div class="source-viewer sv-modal">
              <template
                x-for="seg in snippetModalSegments"
                :key="seg.kind === 'gap' ? 'g' + seg.key : 'l' + seg.lineNum"
              >
                <div>
                  <!-- Collapsed stretch between ranges: click to reveal more -->
                  <template x-if="seg.kind === 'gap'">
                    <button
                      type="button"
                      class="sv-gap sv-gap-btn w-full"
                      @click="expandSnippetGap(seg.key)"
                      :title="'Show more lines'"
                    >
                      <span class="sv-gap-line"></span>
                      <svg
                        class="h-3 w-3 flex-shrink-0"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                      >
                        <path
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M19 9l-7 7-7-7M5 5h14"
                        />
                      </svg>
                      <span x-text="formatCount(seg.hidden) + ' lines hidden'"></span>
                      <span class="sv-gap-line"></span>
                    </button>
                  </template>
                  <template x-if="seg.kind === 'code'">
                    <div
                      class="sv-line"
                      :data-line="seg.lineNum"
                      :class="{ highlighted: seg.covered }"
                    >
                      <span class="sv-lnum" x-text="seg.lineNum"></span>
                      <span class="sv-code" x-html="seg.html || '​'"></span>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </template>
        </div>
      </template>
    </div>
  </div>
</div>
