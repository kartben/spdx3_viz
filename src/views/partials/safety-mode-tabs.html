<div
  class="flex items-center gap-0.5 bg-slate-900/70 border border-slate-700 rounded-lg p-0.5 shrink-0"
>
  <template
    x-for="mode in [
      { key: 'requirements', label: 'Requirements' },
      { key: 'coverage', label: 'Coverage' }
    ]"
    :key="mode.key"
  >
    <button
      type="button"
      @click="setSafetyViewMode(mode.key)"
      class="px-2.5 py-1.5 sm:py-1 rounded-md text-xs font-medium transition-colors"
      :class="safetyViewMode === mode.key
        ? 'bg-yellow-500/20 text-yellow-300'
        : 'text-slate-400 hover:text-slate-200 hover:bg-slate-700'"
      x-text="mode.label"
    ></button>
  </template>
</div>
