<div x-show="currentView === 'agents'" class="fade-in space-y-3 max-w-4xl">
  <div class="list-sticky flex flex-wrap items-center gap-3">
    <span
      class="text-sm text-slate-400 flex-shrink-0"
      x-text="`${filteredAgents.length} ${filteredAgents.length === 1 ? 'agent' : 'agents'}`"
    ></span>
    <input
      x-model="agentSearch"
      @input.debounce.150ms="restreamView('agents')"
      type="text"
      placeholder="Filter agents…"
      class="ml-auto bg-slate-800 border border-slate-700 rounded-lg text-xs px-2.5 py-1.5 text-slate-300 placeholder-slate-500 focus:outline-none focus:border-red-500 w-44 sm:w-56"
    />
    <select
      x-model="agentSort"
      @change="restreamView('agents')"
      class="bg-slate-800 border border-slate-700 rounded-lg text-xs px-2 py-1.5 text-slate-300 focus:outline-none focus:border-red-500"
    >
      <option value="links">Sort by links</option>
      <option value="name">Sort by name</option>
    </select>
  </div>

  <p class="text-xs text-slate-500 -mt-1 mb-2">
    People, organizations, and software agents referenced across the document — and everything they
    created, supplied, originated, or manufactured.
  </p>

  <template
    x-for="agent in (mountedViews.agents ? renderSlice('agents', filteredAgents) : [])"
    :key="agent.spdxId"
  >
    <div
      class="card"
      data-nav-kind="agent"
      :data-nav-id="agent.spdxId"
      :class="isNavTarget('agent', agent.spdxId) && 'target-focus'"
    >
      <div class="flex items-center gap-3 cursor-pointer" @click="toggleAgent(agent.spdxId)">
        <div
          class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0"
          :style="`background:${nodeTypeColor('agent')}26`"
        >
          <span
            class="flex items-center justify-center"
            :style="`color:${nodeTypeColor('agent')}`"
            x-html="elementIcon(agent, 'w-4 h-4')"
          ></span>
        </div>
        <div class="flex-1 min-w-0">
          <div
            class="font-medium text-white text-sm break-words"
            x-text="agent.name || cleanName(agent.spdxId)"
          ></div>
          <div class="text-xs text-slate-500" x-text="agentTypeLabel(agent)"></div>
        </div>
        <div class="flex items-center gap-2 flex-shrink-0">
          <template x-for="group in agentLinkGroups(agent)" :key="group.key">
            <span
              class="badge"
              :style="`background:${group.color}26;color:${group.color}`"
              :title="group.label"
              x-text="formatCount(group.total) + ' ' + group.label.toLowerCase()"
            ></span>
          </template>
          <svg
            class="w-4 h-4 text-slate-500 transition-transform"
            :class="expandedAgent === agent.spdxId && 'rotate-180'"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            />
          </svg>
        </div>
      </div>

      <!-- Expanded detail -->
      <div
        x-show="expandedAgent === agent.spdxId"
        x-collapse
        class="mt-4 pt-4 border-t border-slate-700"
      >
        <div class="sm:pl-11 space-y-4">
          <!-- Identity: spdxId + email -->
          <div class="space-y-3">
            <div>
              <div class="text-xs text-slate-500 mb-1">SPDX ID</div>
              <code
                class="hash-text text-slate-300 break-all leading-relaxed"
                x-text="agent.spdxId"
              ></code>
            </div>
            <div x-show="agentEmail(agent)" class="flex items-center gap-2">
              <span class="text-xs text-slate-500 flex-shrink-0">Email</span>
              <a
                :href="'mailto:' + agentEmail(agent)"
                @click.stop
                class="text-xs text-sky-400 hover:text-sky-300 break-all"
                x-text="agentEmail(agent)"
              ></a>
            </div>
            <!-- Free-form comment / note -->
            <div x-show="isMeaningful(agent.comment)">
              <div class="text-xs text-slate-500 mb-1">Note</div>
              <div
                class="text-xs text-slate-300 whitespace-pre-wrap break-words bg-slate-900/50 rounded px-2 py-1.5"
                x-text="agent.comment"
              ></div>
            </div>
          </div>

          <!-- External identifiers (email and any others) -->
          <div x-show="externalIdentifiers(agent).length > 0">
            <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">
              Identifiers
            </div>
            <div class="space-y-1.5">
              <template x-for="eid in externalIdentifiers(agent)" :key="eid.type + eid.identifier">
                <div class="flex items-start gap-2 group">
                  <span
                    class="text-[10px] text-slate-500 uppercase tracking-wider w-20 pt-0.5 flex-shrink-0 text-right"
                    x-text="eid.label"
                  ></span>
                  <code
                    class="hash-text text-slate-300 break-all flex-1 leading-relaxed"
                    x-text="eid.identifier"
                  ></code>
                  <button
                    @click.stop="copyHash(eid.identifier)"
                    class="opacity-0 group-hover:opacity-100 text-slate-500 hover:text-white transition-opacity flex-shrink-0 pt-0.5"
                    title="Copy"
                  >
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"
                      />
                    </svg>
                  </button>
                </div>
              </template>
            </div>
          </div>

          <!-- Provenance links: created / supplied / originated / manufactured -->
          <template x-for="group in agentLinkGroups(agent)" :key="group.key">
            <div class="detail-rel-section">
              <div class="flex items-center gap-2 mb-2">
                <span class="detail-rel-line" :style="`background: ${group.color}`"></span>
                <span
                  class="text-xs font-semibold uppercase tracking-wider"
                  :style="`color: ${group.color}`"
                  x-text="group.label"
                ></span>
                <span
                  class="text-[10px] text-slate-500"
                  x-text="'(' + formatCount(group.total) + ')'"
                ></span>
              </div>
              <div class="space-y-1 ml-3">
                <template x-for="item in group.items" :key="item.id">
                  <div class="detail-rel-item group" @click.stop="navigateTo(item.id)">
                    <span class="detail-rel-arrow" :style="`color: ${group.color}`">→</span>
                    <span
                      class="flex items-center flex-shrink-0"
                      :style="`color: ${nodeTypeColor(getNodeType(elementMap.get(item.id) || {}))}`"
                      x-html="elementIcon(elementMap.get(item.id) || { spdxId: item.id }, 'w-3.5 h-3.5')"
                    ></span>
                    <span class="flex-1 truncate" x-text="item.displayName"></span>
                    <svg
                      class="w-3 h-3 text-slate-600 group-hover:text-slate-400 transition-colors flex-shrink-0"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M9 5l7 7-7 7"
                      />
                    </svg>
                  </div>
                </template>
                <div
                  x-show="group.hiddenCount > 0"
                  class="text-[10px] text-slate-500 italic pl-1"
                  x-text="'+' + formatCount(group.hiddenCount) + ' more'"
                ></div>
              </div>
            </div>
          </template>

          <!-- Empty state -->
          <div
            x-show="agentLinkGroups(agent).length === 0"
            class="text-xs text-slate-500 italic text-center py-4"
          >
            Not linked to any elements in the loaded document(s).
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- Empty view -->
  <div x-show="filteredAgents.length === 0" class="text-sm text-slate-500 italic text-center py-12">
    No agents match your filter.
  </div>
</div>
