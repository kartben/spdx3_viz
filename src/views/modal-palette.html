<!-- ⌘K COMMAND PALETTE: fuzzy jump-to-anything + app actions, reachable from
     anywhere via the keyboard (see app/palette.js). -->
<div
  x-show="paletteOpen"
  x-transition.opacity.duration.150ms
  x-cloak
  class="fixed inset-0 z-80 flex items-start justify-center px-4 pt-[12vh] bg-slate-900/70 backdrop-blur-xs"
  @click.self="closePalette()"
  @keydown.escape.window="paletteOpen && closePalette()"
>
  <div
    x-show="paletteOpen"
    x-transition:enter="transition ease-out duration-150"
    x-transition:enter-start="opacity-0 -translate-y-2 scale-[0.98]"
    x-transition:enter-end="opacity-100 translate-y-0 scale-100"
    class="w-full max-w-2xl bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl shadow-black/60 overflow-hidden"
    @click.stop
  >
    <!-- Search input -->
    <div class="flex items-center gap-3 px-4 border-b border-slate-700/70">
      <svg
        class="w-5 h-5 text-slate-500 shrink-0"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
        />
      </svg>
      <input
        x-ref="paletteInput"
        x-model="paletteQuery"
        @input="onPaletteInput()"
        @keydown="paletteKeydown($event)"
        type="text"
        role="combobox"
        aria-autocomplete="list"
        aria-label="Search elements and commands"
        :aria-expanded="paletteOpen"
        placeholder="Search elements or jump to a view…"
        class="flex-1 bg-transparent py-4 text-base text-slate-100 placeholder-slate-500 focus:outline-hidden"
      />
      <kbd
        class="hidden sm:inline-flex items-center px-1.5 py-0.5 text-[10px] font-mono font-medium text-slate-400 bg-slate-700/60 border border-slate-600/60 rounded-sm"
        >Esc</kbd
      >
    </div>

    <!-- Results -->
    <div x-ref="paletteList" class="max-h-[52vh] overflow-y-auto py-2">
      <!-- No matches -->
      <div x-show="paletteItems.length === 0" class="px-4 py-10 text-center text-sm text-slate-500">
        No matches for “<span class="text-slate-300" x-text="paletteQuery.trim()"></span>”
      </div>

      <template x-for="(item, i) in paletteItems" :key="item.kind + ':' + item.id">
        <div>
          <!-- Section header -->
          <div
            x-show="paletteIsGroupStart(i)"
            class="px-4 pt-2 pb-1 text-[10px] font-semibold uppercase tracking-widest text-slate-500"
            x-text="item.group"
          ></div>

          <button
            type="button"
            :data-palette-active="i === paletteActiveIndex"
            @click="selectPaletteItem(item)"
            @mousemove="paletteActiveIndex = i"
            :class="i === paletteActiveIndex ? 'bg-slate-700/70' : 'hover:bg-slate-700/40'"
            class="w-full flex items-center gap-3 px-3 mx-1 rounded-lg py-2 text-left transition-colors"
            style="width: calc(100% - 0.5rem)"
          >
            <!-- Icon tile -->
            <template x-if="item.kind === 'element'">
              <span
                class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0"
                :style="`background:${nodeTypeColor(item.nodeType)}26`"
              >
                <span
                  class="flex items-center justify-center"
                  :style="`color:${nodeTypeColor(item.nodeType)}`"
                  x-html="nodeTypeIconSvg(item.nodeType, 'w-4 h-4')"
                ></span>
              </span>
            </template>
            <template x-if="item.kind === 'command'">
              <span
                class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0 transition-colors"
                :class="i === paletteActiveIndex ? 'bg-blue-500/20 text-blue-300' : 'bg-slate-700/60 text-slate-400'"
                x-html="item.icon"
              ></span>
            </template>

            <span class="min-w-0 flex-1">
              <span
                class="block text-sm text-slate-200 truncate"
                x-html="searchHighlight(item.name, paletteQuery)"
              ></span>
              <span
                x-show="item.kind === 'element' && item.sub"
                class="block text-xs text-slate-500 truncate"
                x-text="item.sub"
              ></span>
            </span>

            <!-- Right-side chip: element type, or an Enter hint on the active command -->
            <!-- Virtual (online-scan) findings get a leading "scan" chip so it's
                 clear they aren't carried by the SBOM. -->
            <template x-if="item.kind === 'element' && item.virtual">
              <span
                class="text-[10px] font-medium px-1.5 py-0.5 rounded-full shrink-0 bg-sky-500/15 text-sky-300 ring-1 ring-sky-500/30"
                title="Found by an online scan, not present in the SBOM"
                >scan</span
              >
            </template>
            <template x-if="item.kind === 'element'">
              <span
                class="text-[10px] font-medium px-1.5 py-0.5 rounded-full shrink-0"
                :style="`background:${nodeTypeColor(item.nodeType)}1f;color:${nodeTypeColor(item.nodeType)}`"
                x-text="item.typeLabel"
              ></span>
            </template>
            <template x-if="item.kind === 'command'">
              <span
                x-show="i === paletteActiveIndex"
                class="hidden sm:inline text-[10px] font-medium text-slate-500 shrink-0"
                >↵</span
              >
            </template>
          </button>
        </div>
      </template>
    </div>

    <!-- Footer hints -->
    <div
      class="flex items-center gap-4 px-4 py-2.5 border-t border-slate-700/70 text-[11px] text-slate-500"
    >
      <span class="flex items-center gap-1.5">
        <kbd
          class="px-1 py-0.5 font-mono bg-slate-700/60 border border-slate-600/60 rounded-sm text-slate-400"
          >↑</kbd
        ><kbd
          class="px-1 py-0.5 font-mono bg-slate-700/60 border border-slate-600/60 rounded-sm text-slate-400"
          >↓</kbd
        >
        navigate
      </span>
      <span class="flex items-center gap-1.5">
        <kbd
          class="px-1 py-0.5 font-mono bg-slate-700/60 border border-slate-600/60 rounded-sm text-slate-400"
          >↵</kbd
        >
        open
      </span>
      <span class="ml-auto flex items-center gap-1.5">
        <span x-text="paletteItems.length"></span>
        <span x-text="paletteItems.length === 1 ? 'result' : 'results'"></span>
      </span>
    </div>
  </div>
</div>
