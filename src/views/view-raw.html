<div x-show="currentView === 'raw'" class="fade-in absolute inset-0 flex flex-col gap-3 p-4 sm:p-6">
  <!-- Toolbar: file selector (when merged), format toggle, copy, download -->
  <div class="flex flex-wrap items-center gap-2 flex-shrink-0">
    <div x-show="loadedFiles.length > 1" class="flex flex-wrap items-center gap-1.5">
      <template x-for="(f, i) in loadedFiles" :key="i">
        <button
          type="button"
          @click="selectRawFile(i)"
          class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs border transition-colors"
          :class="rawIndex === i
                      ? 'bg-blue-500/15 border-blue-500/40 text-blue-200'
                      : 'bg-slate-800 border-slate-700 text-slate-400 hover:text-slate-200 hover:border-slate-600'"
        >
          <svg class="w-3 h-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
            />
          </svg>
          <span class="truncate max-w-[160px]" x-text="f.name"></span>
        </button>
      </template>
    </div>

    <div class="flex items-center gap-2 ml-auto">
      <button
        type="button"
        @click="toggleRawPretty()"
        class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs bg-slate-800 border border-slate-700 text-slate-300 hover:text-white hover:border-slate-600 transition-colors"
        :title="rawPretty ? 'Show the file exactly as loaded' : 'Pretty-print the JSON'"
      >
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h10M4 18h7"
          />
        </svg>
        <span x-text="rawPretty ? 'Formatted' : 'Raw'"></span>
      </button>
      <button
        type="button"
        @click="copyRaw(rawIndex)"
        class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs bg-slate-800 border border-slate-700 text-slate-300 hover:text-white hover:border-slate-600 transition-colors"
        title="Copy to clipboard"
      >
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"
          />
        </svg>
        <span>Copy</span>
      </button>
      <button
        type="button"
        @click="downloadRaw(rawIndex)"
        class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs bg-slate-800 border border-slate-700 text-slate-300 hover:text-white hover:border-slate-600 transition-colors"
        title="Download file"
      >
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"
          />
        </svg>
        <span>Download</span>
      </button>
    </div>
  </div>

  <!-- Meta line: active file name + size (+ note when highlighting is skipped) -->
  <div class="flex flex-wrap items-center gap-x-2 gap-y-1 text-xs text-slate-500 flex-shrink-0">
    <span class="font-mono text-slate-400 break-all" x-text="rawFile?.name"></span>
    <template x-if="rawSizeLabel(rawIndex)">
      <span class="flex items-center gap-2">
        <span>·</span>
        <span x-text="rawSizeLabel(rawIndex)"></span>
      </span>
    </template>
    <template x-if="rawHighlightDisabled(rawIndex)">
      <span class="text-amber-500/80">· syntax highlighting off for large file</span>
    </template>
  </div>

  <!-- Code block. x-if so highlight HTML is built only when opened; clicks on linkified spdxIds are delegated to navigateTo -->
  <div class="card p-0 overflow-hidden flex-1 min-h-0 flex flex-col">
    <template x-if="mountedViews.raw && rawFile && !rawTooLarge(rawIndex)">
      <div
        id="rawScrollBox"
        class="overflow-auto p-4 flex-1 min-h-0"
        @click="rawNavigate($event)"
        @keydown.enter="rawNavigate($event)"
      >
        <pre class="jsonld-code" x-html="rawHighlighted(rawIndex)"></pre>
      </div>
    </template>
    <template x-if="rawFile && rawTooLarge(rawIndex)">
      <div class="p-8 text-center space-y-3">
        <p class="text-sm text-slate-400">
          This file is too large to display inline (<span x-text="rawSizeLabel(rawIndex)"></span>).
        </p>
        <button
          type="button"
          @click="downloadRaw(rawIndex)"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs bg-blue-500/15 border border-blue-500/40 text-blue-200 hover:bg-blue-500/25 transition-colors"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"
            />
          </svg>
          <span>Download file</span>
        </button>
      </div>
    </template>
  </div>
</div>
