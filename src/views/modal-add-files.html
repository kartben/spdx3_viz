<!-- FILES: the one place to change what the current document is made of. A
     ticked box means "in the document once you apply", so ticking an unloaded
     sample file queues an add and unticking a loaded one queues a removal. Local
     files stage the same way, and carry their age so they stand out from the
     bundled samples. -->
<div
  x-show="addFilesOpen"
  x-transition.opacity.duration.150ms
  x-cloak
  @keydown.escape.window="addFilesOpen && closeAddFilesModal()"
  class="fixed inset-0 z-75 flex items-start justify-center px-4 pt-[8vh] bg-slate-900/75 backdrop-blur-xs"
  @click.self="closeAddFilesModal()"
>
  <div
    x-show="addFilesOpen"
    x-transition:enter="transition ease-out duration-150"
    x-transition:enter-start="opacity-0 -translate-y-2 scale-[0.98]"
    x-transition:enter-end="opacity-100 translate-y-0 scale-100"
    role="dialog"
    aria-modal="true"
    aria-label="Files in this document"
    class="w-full max-w-2xl max-h-[84vh] flex flex-col bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl shadow-black/60 overflow-hidden"
    @click.stop
  >
    <!-- Title -->
    <div class="flex items-start gap-3 px-5 pt-4 pb-3">
      <div class="flex-1 min-w-0">
        <h2 class="font-semibold text-white text-sm">Files</h2>
        <p class="text-xs text-slate-500 mt-0.5">
          Ticked files make up this document. They are merged together, with cross-references
          resolved automatically.
        </p>
      </div>
      <button
        type="button"
        class="p-1.5 -mr-1 -mt-1 rounded-lg text-slate-400 hover:text-white hover:bg-slate-700 transition-colors"
        @click="closeAddFilesModal()"
        aria-label="Close"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>

    <!-- Filter -->
    <div
      x-show="samples.length"
      class="flex items-center gap-2.5 mx-5 mb-1 px-3 bg-slate-900/50 border border-slate-700 rounded-lg focus-within:border-slate-600"
    >
      <svg
        class="w-4 h-4 text-slate-500 shrink-0"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
        />
      </svg>
      <input
        x-ref="addFilesSearch"
        x-model="addFilesQuery"
        type="text"
        aria-label="Filter samples and files"
        placeholder="Filter samples and files…"
        class="flex-1 bg-transparent py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-hidden"
      />
      <button
        x-show="addFilesQuery"
        type="button"
        @click="addFilesQuery = ''"
        class="text-slate-500 hover:text-slate-300 transition-colors"
        aria-label="Clear filter"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>

    <!-- Sample files -->
    <div x-show="samples.length" class="flex-1 min-h-0 overflow-y-auto px-3 py-2">
      <div
        x-show="addFilesGroups.length === 0"
        class="px-4 py-10 text-center text-sm text-slate-500"
      >
        No sample file matches “<span class="text-slate-300" x-text="addFilesQuery.trim()"></span>”
      </div>

      <template x-for="g in addFilesGroups" :key="g.id">
        <div>
          <!-- Single-file sample: the sample *is* the row -->
          <template x-if="!g.multi">
            <button
              type="button"
              role="checkbox"
              :aria-checked="g.files[0].on"
              @click="toggleAddFilesFile(g.files[0])"
              class="w-full flex items-center gap-3 px-2.5 py-2 rounded-lg text-left transition-colors hover:bg-slate-700/40"
            >
              <span
                class="w-[18px] h-[18px] shrink-0 rounded-[5px] border flex items-center justify-center transition-colors"
                :class="g.files[0].on ? 'bg-blue-500 border-blue-500 text-white' : 'border-slate-600'"
              >
                <svg
                  x-show="g.files[0].on"
                  class="w-3 h-3"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="3"
                    d="M5 13l4 4L19 7"
                  />
                </svg>
              </span>
              <span class="w-5 h-5 shrink-0 flex items-center justify-center">
                <img
                  x-show="g.icon"
                  :src="g.icon"
                  alt=""
                  class="w-5 h-5 rounded-xs object-contain"
                />
                <span x-show="!g.icon" class="text-lg leading-none" x-text="g.emoji"></span>
              </span>
              <span class="min-w-0 flex-1">
                <span
                  class="block text-sm text-slate-200 truncate"
                  :class="g.files[0].removed && 'line-through text-slate-500'"
                  x-text="g.name"
                ></span>
                <span
                  class="block font-mono text-[11px] text-slate-500 truncate"
                  x-text="g.files[0].name"
                ></span>
              </span>
              <span
                x-show="g.files[0].removed"
                class="text-[10px] font-medium px-1.5 py-0.5 rounded-full bg-red-500/15 text-red-300 shrink-0"
                >Removing</span
              >
              <span
                x-show="g.files[0].loaded && !g.files[0].removed"
                class="text-[10px] font-medium px-1.5 py-0.5 rounded-full bg-slate-700 text-slate-400 shrink-0"
                >Loaded</span
              >
              <span
                x-show="!g.files[0].loaded && g.sizeLabel"
                class="text-[11px] text-slate-500 shrink-0 tabular-nums"
                x-text="g.sizeLabel"
              ></span>
            </button>
          </template>

          <!-- Multi-file sample: a collapsible group whose checkbox drives every file -->
          <template x-if="g.multi">
            <div>
              <div class="flex items-center gap-3 px-2.5 py-2 rounded-lg transition-colors">
                <button
                  type="button"
                  role="checkbox"
                  :aria-checked="g.allOn ? 'true' : g.someOn ? 'mixed' : 'false'"
                  :aria-label="`Include every file from ${g.name}`"
                  @click="toggleAddFilesGroupAll(g)"
                  class="w-[18px] h-[18px] shrink-0 rounded-[5px] border flex items-center justify-center transition-colors"
                  :class="g.allOn ? 'bg-blue-500 border-blue-500 text-white' : g.someOn ? 'bg-blue-500/20 border-blue-500 text-blue-400' : 'border-slate-600'"
                >
                  <svg
                    x-show="g.allOn"
                    class="w-3 h-3"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="3"
                      d="M5 13l4 4L19 7"
                    />
                  </svg>
                  <svg
                    x-show="!g.allOn && g.someOn"
                    class="w-3 h-3"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path stroke-linecap="round" stroke-width="3" d="M6 12h12" />
                  </svg>
                </button>
                <span class="w-5 h-5 shrink-0 flex items-center justify-center">
                  <img
                    x-show="g.icon"
                    :src="g.icon"
                    alt=""
                    class="w-5 h-5 rounded-xs object-contain"
                  />
                  <span x-show="!g.icon" class="text-lg leading-none" x-text="g.emoji"></span>
                </span>
                <button
                  type="button"
                  @click="toggleAddFilesGroup(g)"
                  :aria-expanded="addFilesGroupOpen(g)"
                  class="min-w-0 flex-1 flex items-center gap-2 text-left"
                >
                  <span class="min-w-0">
                    <span class="block text-sm text-slate-200 truncate" x-text="g.name"></span>
                    <span class="block text-[11px] text-slate-500">
                      <span x-text="`${g.fileCount} files`"></span>
                      <span x-show="g.sizeLabel" x-text="` · ${g.sizeLabel}`"></span>
                      <span
                        x-show="g.loadedCount && g.loadedCount < g.files.length"
                        class="text-slate-600"
                        x-text="` · ${g.loadedCount} loaded`"
                      ></span>
                    </span>
                  </span>
                  <svg
                    class="w-3.5 h-3.5 text-slate-500 shrink-0 transition-transform"
                    :class="addFilesGroupOpen(g) && 'rotate-90'"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M9 5l7 7-7 7"
                    />
                  </svg>
                </button>
                <!-- Only while collapsed: expanded, every row carries its own chip -->
                <span
                  x-show="!addFilesGroupOpen(g) && g.allOn && g.loadedCount === g.files.length"
                  class="text-[10px] font-medium px-1.5 py-0.5 rounded-full bg-slate-700 text-slate-400 shrink-0"
                  >Loaded</span
                >
              </div>

              <div x-show="addFilesGroupOpen(g)" class="ml-[1.9rem] pl-3 border-l border-slate-700">
                <template x-for="f in g.files" :key="f.path">
                  <button
                    type="button"
                    role="checkbox"
                    :aria-checked="f.on"
                    @click="toggleAddFilesFile(f)"
                    class="w-full flex items-center gap-3 px-2.5 py-1.5 rounded-lg text-left transition-colors hover:bg-slate-700/40"
                  >
                    <span
                      class="w-[18px] h-[18px] shrink-0 rounded-[5px] border flex items-center justify-center transition-colors"
                      :class="f.on ? 'bg-blue-500 border-blue-500 text-white' : 'border-slate-600'"
                    >
                      <svg
                        x-show="f.on"
                        class="w-3 h-3"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                      >
                        <path
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="3"
                          d="M5 13l4 4L19 7"
                        />
                      </svg>
                    </span>
                    <span
                      class="min-w-0 flex-1 font-mono text-xs text-slate-400 truncate"
                      :class="f.removed && 'line-through text-slate-600'"
                      x-text="f.name"
                    ></span>
                    <span
                      x-show="f.removed"
                      class="text-[10px] font-medium px-1.5 py-0.5 rounded-full bg-red-500/15 text-red-300 shrink-0"
                      >Removing</span
                    >
                    <span
                      x-show="f.loaded && !f.removed"
                      class="text-[10px] font-medium px-1.5 py-0.5 rounded-full bg-slate-700 text-slate-400 shrink-0"
                      >Loaded</span
                    >
                  </button>
                </template>
              </div>
            </div>
          </template>
        </div>
      </template>
    </div>

    <!-- The user's own files, and the drop zone that stages more -->
    <div class="px-5 pt-3 pb-3 border-t border-slate-700/70">
      <div x-show="addFilesOwn.length" class="mb-2">
        <div class="text-[10px] font-semibold uppercase tracking-widest text-slate-500 mb-1 px-0.5">
          Your files
        </div>
        <div class="max-h-28 overflow-y-auto">
          <template x-for="row in addFilesOwn" :key="row.key">
            <button
              type="button"
              role="checkbox"
              :aria-checked="row.on"
              @click="toggleAddFilesOwn(row)"
              class="w-full flex items-center gap-3 px-1.5 py-1 rounded-lg text-left transition-colors hover:bg-slate-700/40"
            >
              <span
                class="w-[18px] h-[18px] shrink-0 rounded-[5px] border flex items-center justify-center transition-colors"
                :class="row.on ? 'bg-blue-500 border-blue-500 text-white' : 'border-slate-600'"
              >
                <svg
                  x-show="row.on"
                  class="w-3 h-3"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="3"
                    d="M5 13l4 4L19 7"
                  />
                </svg>
              </span>
              <span
                class="min-w-0 flex-1 font-mono text-xs text-slate-300 truncate"
                :class="!row.on && 'line-through text-slate-600'"
                x-text="row.name"
              ></span>
              <span
                x-show="row.sizeLabel"
                class="text-[11px] text-slate-500 shrink-0 tabular-nums"
                x-text="row.sizeLabel"
              ></span>
              <span
                x-show="row.isNew"
                class="text-[10px] font-medium px-1.5 py-0.5 rounded-full bg-blue-500/15 text-blue-300 shrink-0"
                >New</span
              >
              <span
                x-show="!row.isNew"
                class="text-[11px] text-slate-500 shrink-0"
                x-text="`added ${row.age}`"
              ></span>
            </button>
          </template>
        </div>
      </div>

      <label
        class="drop-zone flex items-center gap-3 rounded-xl px-3 py-2.5 cursor-pointer hover:bg-slate-700/20 transition-colors"
        @dragover.prevent="$el.classList.add('drag-over')"
        @dragleave="$el.classList.remove('drag-over')"
        @drop.prevent="addFilesDrop($event)"
      >
        <svg
          class="w-5 h-5 text-slate-500 shrink-0"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.5"
            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"
          />
        </svg>
        <span class="text-xs text-slate-400">
          Drop your own <code class="text-blue-400">.json</code> /
          <code class="text-blue-400">.jsonld</code> files here, or
          <span class="text-blue-400 underline underline-offset-2">browse</span>
        </span>
        <input
          type="file"
          accept=".json,.jsonld"
          class="hidden"
          multiple
          @change="addFilesBrowse($event)"
        />
      </label>
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-3 px-5 py-3 border-t border-slate-700 bg-slate-800/60">
      <!-- A batch that failed to download reopens the dialog on this message,
           with every pick still staged so the user can retry. -->
      <span
        x-show="addFilesError"
        class="text-xs text-red-400 flex-1 min-w-0 truncate"
        :title="addFilesError"
        x-text="addFilesError"
      ></span>
      <span
        x-show="!addFilesError"
        class="text-xs flex-1 min-w-0 truncate"
        :class="addFilesResultCount === 0 ? 'text-amber-400' : 'text-slate-500'"
        x-text="addFilesStatus"
      ></span>
      <button
        type="button"
        @click="closeAddFilesModal()"
        class="shrink-0 px-3 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:bg-slate-700 transition-colors"
      >
        Cancel
      </button>
      <button
        type="button"
        :disabled="!addFilesCanApply"
        @click="confirmAddFiles()"
        class="shrink-0 px-3 py-1.5 rounded-lg text-xs font-medium bg-blue-600 hover:bg-blue-500 text-white transition-colors disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-blue-600"
        x-text="addFilesApplyLabel"
      ></button>
    </div>
  </div>
</div>
