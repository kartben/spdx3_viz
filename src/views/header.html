<header
  class="h-14 border-b border-slate-700/50 bg-slate-800/30 flex items-center justify-between gap-2 px-3 md:px-5 flex-shrink-0"
>
  <div class="flex items-center gap-2 md:gap-3 min-w-0">
    <!-- Hamburger (mobile only) -->
    <button
      @click="sidebarOpen = true"
      class="md:hidden p-1.5 -ml-1 rounded-lg text-slate-300 hover:bg-slate-700 hover:text-white transition-colors flex-shrink-0"
      aria-label="Open navigation menu"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 6h16M4 12h16M4 18h16"
        />
      </svg>
    </button>
    <h2 class="text-sm font-semibold text-white flex-shrink-0" x-text="currentViewLabel"></h2>
    <!-- Loaded file pills (hidden on the smallest screens to save room) -->
    <div class="hidden sm:flex items-center gap-1.5 min-w-0 overflow-x-auto">
      <template x-for="(f, i) in loadedFiles" :key="i">
        <span
          class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-xs bg-slate-700/60 text-slate-300 flex-shrink-0"
        >
          <svg class="w-3 h-3 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
            />
          </svg>
          <span x-text="f.name" class="truncate max-w-[120px]"></span>
          <button
            @click="removeFile(i)"
            class="ml-0.5 text-slate-500 hover:text-red-400 transition-colors"
            title="Remove this file"
          >
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </span>
      </template>
    </div>
  </div>
  <div class="flex items-center gap-2 md:gap-3 flex-shrink-0">
    <!-- Global search + command palette trigger: an input-styled button that
         opens the ⌘K palette. Identical on every view (the palette is the one
         global search), so the header never changes shape as you navigate. -->
    <button
      @click="openPalette()"
      type="button"
      aria-label="Search elements or jump to a view"
      class="group flex items-center gap-2 w-44 sm:w-56 md:w-72 pl-3 pr-2 py-1.5 bg-slate-800 border border-slate-700 rounded-lg text-slate-500 hover:border-slate-600 hover:text-slate-400 transition-colors"
    >
      <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
        />
      </svg>
      <span class="flex-1 text-left text-sm truncate">Search anything…</span>
      <span class="hidden md:inline-flex items-center gap-1 font-mono">
        <kbd
          class="px-1.5 py-0.5 text-[10px] font-medium bg-slate-700/60 border border-slate-600/50 rounded"
          x-text="isMac ? '⌘' : 'Ctrl'"
        ></kbd>
        <span class="text-[10px] text-slate-600 group-hover:text-slate-500 transition-colors"
          >+</span
        >
        <kbd
          class="px-1.5 py-0.5 text-[10px] font-medium bg-slate-700/60 border border-slate-600/50 rounded"
          >K</kbd
        >
      </span>
    </button>
    <!-- Copy share link (sample-loaded sessions only: dropped files can't be re-fetched) -->
    <button
      x-show="loadedSampleId"
      type="button"
      @click="copyShareLink()"
      class="inline-flex items-center gap-1.5 px-2.5 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg transition-colors text-slate-300 hover:text-white text-xs font-medium"
      title="Copy a link to this exact view"
    >
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"
        />
      </svg>
      <span class="hidden sm:inline">Share</span>
    </button>
    <!-- Add more files -->
    <label
      class="inline-flex items-center gap-1.5 px-2.5 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg cursor-pointer transition-colors text-slate-300 hover:text-white text-xs font-medium"
      title="Add more SPDX files"
    >
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
      <span class="hidden sm:inline">Add files</span>
      <input
        type="file"
        accept=".json,.jsonld"
        class="hidden"
        multiple
        @change="handleFileInput($event)"
      />
    </label>
  </div>
</header>
