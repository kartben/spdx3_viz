<header
  class="h-14 border-b border-slate-700/50 bg-slate-800/30 flex items-center justify-between gap-2 px-3 md:px-5 flex-shrink-0"
>
  <div class="flex items-center gap-2 md:gap-3 min-w-0">
    <!-- Hamburger (mobile only) -->
    <button
      @click="sidebarOpen = true"
      class="md:hidden p-1.5 -ml-1 rounded-lg text-slate-300 hover:bg-slate-700 hover:text-white transition-colors flex-shrink-0"
      aria-label="Open navigation menu"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 6h16M4 12h16M4 18h16"
        />
      </svg>
    </button>
    <h2 class="text-sm font-semibold text-white flex-shrink-0" x-text="currentViewLabel"></h2>
    <!-- Loaded file pills (hidden on the smallest screens to save room) -->
    <div class="hidden sm:flex items-center gap-1.5 min-w-0 overflow-x-auto">
      <template x-for="(f, i) in loadedFiles" :key="i">
        <span
          class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-xs bg-slate-700/60 text-slate-300 flex-shrink-0"
        >
          <svg class="w-3 h-3 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
            />
          </svg>
          <span x-text="f.name" class="truncate max-w-[120px]"></span>
          <button
            @click="removeFile(i)"
            class="ml-0.5 text-slate-500 hover:text-red-400 transition-colors"
            title="Remove this file"
          >
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </span>
      </template>
    </div>
  </div>
  <div class="flex items-center gap-2 md:gap-3 flex-shrink-0">
    <!-- Global search: fuzzy jump-to-anything across every element -->
    <div class="relative" x-show="currentView !== 'graph'" @click.outside="closeSearch()">
      <svg
        class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
        />
      </svg>
      <input
        type="text"
        x-model="searchQuery"
        @focus="openSearch()"
        @input="openSearch()"
        @keydown="searchKeydown($event)"
        placeholder="Search anything…"
        role="combobox"
        aria-autocomplete="list"
        aria-label="Search all elements"
        :aria-expanded="searchOpen"
        class="w-40 sm:w-56 md:w-72 pl-9 pr-8 py-1.5 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-colors"
      />
      <!-- Clear -->
      <button
        x-show="searchQuery"
        @click="clearSearch()"
        type="button"
        title="Clear search"
        class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-200 transition-colors"
      >
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>

      <!-- Results dropdown -->
      <div
        x-show="searchOpen && searchQuery.trim().length > 0"
        x-cloak
        class="search-dropdown absolute right-0 mt-2 z-50 w-[20rem] sm:w-[24rem] max-w-[calc(100vw-2rem)] max-h-[70vh] overflow-y-auto bg-slate-800 border border-slate-700 rounded-xl shadow-2xl shadow-black/50 py-1"
      >
        <!-- No matches -->
        <div
          x-show="searchResults.length === 0"
          class="px-4 py-6 text-center text-sm text-slate-500"
        >
          No matches for “<span class="text-slate-300" x-text="searchQuery.trim()"></span>”
        </div>
        <!-- Result rows -->
        <template x-for="(r, i) in searchResults" :key="r.nodeType + ':' + r.id">
          <button
            type="button"
            @click="selectSearchResult(r)"
            @mousemove="searchActiveIndex = i"
            :class="i === searchActiveIndex ? 'bg-slate-700/70' : 'hover:bg-slate-700/40'"
            class="w-full flex items-center gap-3 px-3 py-2 text-left transition-colors"
          >
            <span
              class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0"
              :style="`background:${nodeTypeColor(r.nodeType)}26`"
            >
              <span
                class="flex items-center justify-center"
                :style="`color:${nodeTypeColor(r.nodeType)}`"
                x-html="nodeTypeIconSvg(r.nodeType, 'w-4 h-4')"
              ></span>
            </span>
            <span class="min-w-0 flex-1">
              <span
                class="block text-sm text-slate-200 truncate"
                x-html="searchHighlight(r.name, searchQuery)"
              ></span>
              <span
                x-show="r.sub"
                class="block text-xs text-slate-500 truncate"
                x-text="r.sub"
              ></span>
            </span>
            <span
              class="text-[10px] font-medium px-1.5 py-0.5 rounded-full flex-shrink-0"
              :style="`background:${nodeTypeColor(r.nodeType)}1f;color:${nodeTypeColor(r.nodeType)}`"
              x-text="r.typeLabel"
            ></span>
          </button>
        </template>
        <!-- Footer hint -->
        <div
          x-show="searchResults.length > 0"
          class="px-3 pt-1.5 mt-1 text-[11px] text-slate-500 border-t border-slate-700/60"
        >
          Top <span x-text="searchResults.length"></span> match<span
            x-show="searchResults.length !== 1"
            >es</span
          >
          · <span class="text-slate-400">↵</span> opens the first ·
          <span class="text-slate-400">↑↓</span> to navigate
        </div>
      </div>
    </div>
    <!-- Copy share link (sample-loaded sessions only: dropped files can't be re-fetched) -->
    <button
      x-show="loadedSampleId"
      type="button"
      @click="copyShareLink()"
      class="inline-flex items-center gap-1.5 px-2.5 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg transition-colors text-slate-300 hover:text-white text-xs font-medium"
      title="Copy a link to this exact view"
    >
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"
        />
      </svg>
      <span class="hidden sm:inline">Share</span>
    </button>
    <!-- Add more files -->
    <label
      class="inline-flex items-center gap-1.5 px-2.5 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg cursor-pointer transition-colors text-slate-300 hover:text-white text-xs font-medium"
      title="Add more SPDX files"
    >
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
      <span class="hidden sm:inline">Add files</span>
      <input
        type="file"
        accept=".json,.jsonld"
        class="hidden"
        multiple
        @change="handleFileInput($event)"
      />
    </label>
  </div>
</header>
