<div x-show="currentView === 'security'" class="fade-in space-y-3 max-w-4xl">
  <!-- Controls: count + search + sort -->
  <div class="flex flex-wrap items-center gap-3">
    <span
      class="text-sm text-slate-400"
      x-text="`${formatCount(filteredVulnerabilities.length)} of ${formatCount(vulnerabilities.length)} vulnerabilities`"
    ></span>
    <input
      x-model.debounce.200ms="securitySearch"
      type="text"
      placeholder="Search CVE, package, statement…"
      class="ml-auto bg-slate-800 border border-slate-700 rounded-lg text-xs px-2.5 py-1.5 text-slate-300 placeholder-slate-500 focus:outline-none focus:border-rose-500 w-56"
    />
    <select
      x-model="securitySort"
      @change="restreamView('security')"
      class="bg-slate-800 border border-slate-700 rounded-lg text-xs px-2 py-1.5 text-slate-300 focus:outline-none focus:border-rose-500"
    >
      <option value="severity">Sort by status</option>
      <option value="packages">Sort by affected packages</option>
      <option value="cve">Sort by CVE id</option>
    </select>
  </div>

  <!-- Status filter chips -->
  <div class="flex flex-wrap items-center gap-2">
    <button
      @click="securityStatusFilter = ''; restreamView('security')"
      class="badge transition"
      :class="securityStatusFilter === '' ? 'bg-slate-600/40 text-white ring-1 ring-slate-400/40' : 'bg-slate-800 text-slate-400 hover:text-slate-200'"
    >
      All
      <span class="ml-1.5 font-semibold" x-text="formatCount(securitySummary.total)"></span>
    </button>
    <template x-for="s in securityStatusOrder" :key="s">
      <button
        @click="securityStatusFilter = (securityStatusFilter === s ? '' : s); restreamView('security')"
        class="badge transition"
        :class="securityStatusFilter === s ? vexStatusMeta(s).badgeClass + ' brightness-125' : 'bg-slate-800 text-slate-400 hover:text-slate-200'"
        :title="`Show ${vexStatusMeta(s).label} vulnerabilities`"
      >
        <span class="w-1.5 h-1.5 rounded-full mr-1.5" :class="vexStatusMeta(s).dotClass"></span>
        <span x-text="vexStatusMeta(s).label"></span>
        <span class="ml-1.5 font-semibold" x-text="formatCount(securitySummary.counts[s])"></span>
      </button>
    </template>
  </div>

  <!-- Vulnerability cards -->
  <template
    x-for="vuln in (mountedViews.security ? renderSlice('security', filteredVulnerabilities) : [])"
    :key="vuln.spdxId"
  >
    <div
      class="card"
      data-nav-kind="vuln"
      :data-nav-id="vuln.spdxId"
      :class="isNavTarget('vuln', vuln.spdxId) && 'target-focus'"
    >
      <div class="flex items-center gap-3 cursor-pointer" @click="toggleVuln(vuln.spdxId)">
        <div
          class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0"
          :class="vexStatusMeta(vuln.overallStatus).badgeClass"
        >
          <span
            class="flex items-center justify-center"
            x-html="nodeTypeIconSvg('vulnerability', 'w-4 h-4')"
          ></span>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2">
            <span class="font-semibold text-white text-sm font-mono" x-text="vuln.name"></span>
            <a
              x-show="vulnUrl(vuln.el)"
              :href="vulnUrl(vuln.el)"
              target="_blank"
              rel="noopener noreferrer"
              @click.stop
              class="text-slate-500 hover:text-rose-300 flex-shrink-0"
              title="Open vulnerability record"
            >
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"
                />
              </svg>
            </a>
          </div>
          <div
            class="text-xs text-slate-500"
            x-text="vuln.packageCount === 0 ? 'Not linked to a package' : `${formatCount(vuln.packageCount)} ${vuln.packageCount === 1 ? 'package' : 'packages'}`"
          ></div>
        </div>
        <div class="flex items-center gap-2 flex-shrink-0">
          <span class="badge" :class="vexStatusMeta(vuln.overallStatus).badgeClass">
            <span
              class="w-1.5 h-1.5 rounded-full mr-1.5"
              :class="vexStatusMeta(vuln.overallStatus).dotClass"
            ></span>
            <span x-text="vexStatusMeta(vuln.overallStatus).label"></span>
          </span>
          <svg
            class="w-4 h-4 text-slate-500 transition-transform"
            :class="expandedVuln === vuln.spdxId && 'rotate-180'"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            />
          </svg>
        </div>
      </div>

      <!-- Expanded: per-package VEX assessments -->
      <div
        x-show="expandedVuln === vuln.spdxId"
        x-collapse
        class="mt-4 pt-4 border-t border-slate-700 sm:pl-11 space-y-3"
      >
        <!-- CVE details, fetched on demand from cve.org -->
        <div
          class="rounded-lg bg-slate-900/40 border border-slate-700/50 p-3"
          x-show="cveDetail(vuln.cveId)"
        >
          <div
            x-show="cveDetail(vuln.cveId)?.loading"
            class="flex items-center gap-2 text-xs text-slate-400"
          >
            <svg class="w-3.5 h-3.5 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              />
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
              />
            </svg>
            Loading CVE details…
          </div>
          <div
            x-show="cveDetail(vuln.cveId)?.error"
            class="text-xs text-slate-500 italic"
            x-text="'CVE details unavailable — ' + (cveDetail(vuln.cveId)?.error || '')"
          ></div>
          <div x-show="cveDetail(vuln.cveId)?.data" class="space-y-2.5">
            <div class="flex flex-wrap items-center gap-2">
              <span
                x-show="cveDetail(vuln.cveId)?.data?.cvss"
                class="badge"
                :class="cvssSeverityMeta(cveDetail(vuln.cveId)?.data?.cvss?.severity).badgeClass"
                :title="cveDetail(vuln.cveId)?.data?.cvss?.vector"
              >
                <span
                  x-text="cvssSeverityMeta(cveDetail(vuln.cveId)?.data?.cvss?.severity).label"
                ></span>
                <span
                  class="ml-1.5 font-semibold"
                  x-text="cveDetail(vuln.cveId)?.data?.cvss?.score"
                ></span>
              </span>
              <span
                x-show="cveDetail(vuln.cveId)?.data?.cvss?.version"
                class="text-[10px] text-slate-500"
                x-text="'CVSS v' + cveDetail(vuln.cveId)?.data?.cvss?.version"
              ></span>
              <template x-for="cwe in cveDetail(vuln.cveId)?.data?.cwes || []" :key="cwe">
                <span class="badge bg-slate-700/60 text-slate-300" x-text="cwe"></span>
              </template>
            </div>
            <p
              class="text-sm text-slate-300 leading-relaxed"
              x-text="cveDetail(vuln.cveId)?.data?.description"
            ></p>
            <div class="text-[10px] text-slate-500 flex flex-wrap gap-x-3 gap-y-1">
              <span
                x-show="cveDetail(vuln.cveId)?.data?.published"
                x-text="'Published ' + formatDate(cveDetail(vuln.cveId)?.data?.published)"
              ></span>
              <span
                x-show="cveDetail(vuln.cveId)?.data?.assigner"
                x-text="'Assigner: ' + cveDetail(vuln.cveId)?.data?.assigner"
              ></span>
            </div>
            <details
              x-show="(cveDetail(vuln.cveId)?.data?.references || []).length > 0"
              class="group"
            >
              <summary class="cursor-pointer text-xs text-slate-400 hover:text-slate-200">
                <span
                  x-text="(cveDetail(vuln.cveId)?.data?.references || []).length + ' references'"
                ></span>
              </summary>
              <div class="mt-2 space-y-1">
                <template
                  x-for="ref in cveDetail(vuln.cveId)?.data?.references || []"
                  :key="ref.url"
                >
                  <a
                    :href="ref.url"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="block text-xs text-sky-400 hover:text-sky-300 truncate"
                    :title="ref.url"
                    x-text="ref.name || ref.url.replace(/^https?:\/\//,'')"
                  ></a>
                </template>
              </div>
            </details>
            <div class="text-[10px] text-slate-600">Source: CVE Program · cve.org</div>
          </div>
        </div>

        <!-- Fallback reference links (until the rich record loads) -->
        <div
          x-show="vuln.locators.length > 0 && !cveDetail(vuln.cveId)?.data"
          class="flex flex-wrap gap-2"
        >
          <template x-for="url in vuln.locators" :key="url">
            <a
              :href="url"
              target="_blank"
              rel="noopener noreferrer"
              class="badge bg-slate-700/60 text-sky-300 hover:text-sky-200 font-mono max-w-full truncate"
              :title="url"
              x-text="url.replace(/^https?:\/\//,'')"
            ></a>
          </template>
        </div>

        <!-- Assessments -->
        <div x-show="assessmentsForVuln(vuln.spdxId).length > 0" class="space-y-2">
          <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">
            VEX assessments
          </div>
          <template x-for="a in assessmentsForVuln(vuln.spdxId)" :key="a.spdxId">
            <div class="rounded-lg bg-slate-900/50 border border-slate-700/50 p-3">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="badge" :class="vexStatusMeta(a.status).badgeClass">
                  <span
                    class="w-1.5 h-1.5 rounded-full mr-1.5"
                    :class="vexStatusMeta(a.status).dotClass"
                  ></span>
                  <span x-text="vexStatusMeta(a.status).label"></span>
                </span>
                <button
                  @click="navigateTo(a.packageId)"
                  class="text-sm text-slate-200 hover:text-white hover:underline decoration-slate-500 underline-offset-2 font-medium truncate"
                  x-text="relTargetDisplayName(a.packageId)"
                ></button>
                <span
                  x-show="a.justification"
                  class="badge bg-sky-500/10 text-sky-300 ml-auto"
                  :title="a.justification"
                  x-text="vexJustificationLabel(a.justification)"
                ></span>
              </div>
              <p
                x-show="a.impactStatement"
                class="text-xs text-slate-400 mt-2 leading-relaxed"
                x-text="a.impactStatement"
              ></p>
              <p
                x-show="a.actionStatement"
                class="text-xs text-amber-300/90 mt-2 leading-relaxed"
                x-text="'Action: ' + a.actionStatement"
              ></p>
              <p
                x-show="a.statusNotes"
                class="text-xs text-slate-500 mt-1 leading-relaxed"
                x-text="a.statusNotes"
              ></p>
              <div
                x-show="a.vexVersion"
                class="text-[10px] text-slate-600 mt-2"
                x-text="'VEX ' + a.vexVersion"
              ></div>
            </div>
          </template>
        </div>

        <div
          x-show="assessmentsForVuln(vuln.spdxId).length === 0"
          class="text-xs text-slate-500 italic"
        >
          No VEX status recorded for this vulnerability.
        </div>
      </div>
    </div>
  </template>

  <div
    x-show="mountedViews.security && filteredVulnerabilities.length === 0"
    class="text-sm text-slate-500 italic text-center py-8"
  >
    No vulnerabilities match your filters
  </div>
</div>
