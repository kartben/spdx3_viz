<div x-show="currentView === 'impact'" class="fade-in max-w-6xl">
  <template x-if="mountedViews.impact">
    <div class="space-y-6">
      <div class="flex items-start gap-3 flex-wrap">
        <div class="min-w-0">
          <h2 class="text-lg font-semibold text-white">Impact</h2>
          <p class="text-sm text-slate-400 mt-0.5">
            Pick one element to trace why it is present and what would be affected by a change.
          </p>
        </div>
        <button
          x-show="impactFocus"
          @click="clearImpactFocus()"
          class="ml-auto text-xs text-slate-300 hover:text-white inline-flex items-center gap-1.5 bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 12H5M11 6l-6 6 6 6"
            />
          </svg>
          Choose another element
        </button>
      </div>

      <div
        x-show="!impactFocus"
        class="grid grid-cols-1 xl:grid-cols-[minmax(0,1.35fr)_minmax(22rem,0.65fr)] gap-4"
      >
        <section class="card">
          <div class="flex items-start justify-between gap-3 flex-wrap mb-4">
            <div>
              <h3 class="text-sm font-semibold text-white">Find an element</h3>
              <p class="text-xs text-slate-500 mt-1">
                Search packages, files, and other dependency-graph nodes.
              </p>
            </div>
            <div class="flex flex-wrap gap-2 text-xs">
              <span class="badge bg-slate-700/60 text-slate-300">
                <span x-text="formatCount(impactGraphSummary.elements)"></span>
                <span class="ml-1">elements</span>
              </span>
              <span class="badge bg-slate-700/60 text-slate-300">
                <span x-text="formatCount(impactGraphSummary.edges)"></span>
                <span class="ml-1">edges</span>
              </span>
              <span class="badge bg-slate-700/60 text-slate-300">
                <span x-text="formatCount(impactGraphSummary.roots)"></span>
                <span class="ml-1">roots</span>
              </span>
            </div>
          </div>

          <input
            x-model.debounce.150ms="impactSearch"
            type="text"
            placeholder="Search name, version, SPDX id..."
            class="w-full bg-slate-900/70 border border-slate-700 rounded-lg text-sm px-3 py-2 text-slate-200 placeholder-slate-500 focus:outline-hidden focus:border-indigo-500"
          />

          <div
            x-show="!impactSearch.trim()"
            class="mt-4 rounded-lg border border-slate-700/70 bg-slate-900/40 px-4 py-5 text-sm text-slate-500"
          >
            Search for a specific element, or open one of the highest-reach elements on the right.
          </div>

          <div
            x-show="impactSearch.trim() && impactSearchResults.length === 0"
            class="mt-4 rounded-lg border border-slate-700/70 bg-slate-900/40 px-4 py-5 text-sm text-slate-500"
          >
            No matching dependency-graph elements.
          </div>

          <div x-show="impactSearchResults.length" class="mt-4 space-y-1">
            <template x-for="row in impactSearchResults" :key="row.id">
              <button
                type="button"
                @click="focusImpact(row.id)"
                class="grid grid-cols-[minmax(0,1fr)_auto] items-center gap-3 w-full text-left rounded-lg px-2.5 py-2 -mx-1 hover:bg-slate-700/40 transition"
              >
                <span class="flex items-start gap-2 min-w-0">
                  <span
                    class="flex items-center justify-center shrink-0 mt-0.5"
                    :style="`color:${nodeTypeColor(row.type)}`"
                    x-html="nodeTypeIconSvg(row.type, 'w-3.5 h-3.5')"
                  ></span>
                  <span class="min-w-0">
                    <span class="flex items-baseline gap-1.5 min-w-0">
                      <span
                        class="text-sm text-slate-200 truncate font-mono"
                        x-text="row.name"
                      ></span>
                      <span
                        x-show="row.version"
                        class="text-xs text-slate-500 truncate max-w-48 font-mono"
                        x-text="row.version"
                      ></span>
                    </span>
                    <span
                      class="block text-[11px] text-slate-600 truncate font-mono"
                      x-text="row.id"
                    ></span>
                  </span>
                </span>
                <span class="flex items-center gap-2 shrink-0">
                  <span x-show="row.risk" class="badge" :class="row.risk?.meta.badgeClass">
                    <span x-text="row.risk?.meta.label"></span>
                    <span
                      x-show="row.risk?.score != null"
                      class="ml-1 font-semibold"
                      x-text="row.risk?.score"
                    ></span>
                  </span>
                  <span class="text-right">
                    <span
                      class="block text-sm font-semibold text-white tabular-nums"
                      x-text="formatCount(row.total)"
                    ></span>
                    <span class="block text-[10px] text-slate-500">dependents</span>
                  </span>
                </span>
              </button>
            </template>
          </div>
        </section>

        <div class="space-y-4">
          <section class="card">
            <div class="flex items-center gap-2 mb-4">
              <h3 class="text-sm font-semibold text-white">Highest reach</h3>
              <span class="text-xs text-slate-500 ml-auto">transitive dependents</span>
            </div>
            <div class="space-y-1">
              <template x-for="row in impactRankings.mostDependedUpon" :key="row.id">
                <button
                  type="button"
                  @click="focusImpact(row.id)"
                  class="grid grid-cols-[minmax(0,1fr)_auto] items-center gap-3 w-full text-left rounded-lg px-2 py-1.5 -mx-1 hover:bg-slate-700/40 transition"
                >
                  <span class="flex items-center gap-2 min-w-0">
                    <span
                      class="flex items-center justify-center shrink-0"
                      :style="`color:${nodeTypeColor(row.type)}`"
                      x-html="nodeTypeIconSvg(row.type, 'w-3.5 h-3.5')"
                    ></span>
                    <span class="min-w-0">
                      <span
                        class="block text-sm text-slate-300 truncate font-mono"
                        x-text="row.name"
                      ></span>
                      <span
                        x-show="row.version"
                        class="block text-xs text-slate-500 truncate max-w-48 font-mono"
                        x-text="row.version"
                      ></span>
                    </span>
                  </span>
                  <span class="flex items-center gap-3 shrink-0">
                    <span
                      class="hidden sm:block w-20 h-1.5 rounded-full bg-slate-700 overflow-hidden"
                    >
                      <span
                        class="block h-full rounded-full"
                        :style="`width:${Math.max(6, (row.total / impactRankings.maxTotal) * 100)}%; background:${nodeTypeColor(row.type)}`"
                      ></span>
                    </span>
                    <span
                      class="text-sm font-semibold text-white tabular-nums w-8 text-right"
                      x-text="formatCount(row.total)"
                    ></span>
                  </span>
                </button>
              </template>
              <div
                x-show="impactRankings.mostDependedUpon.length === 0"
                class="text-xs text-slate-500 italic px-2 py-4"
              >
                No dependency relationships to rank.
              </div>
            </div>
          </section>

          <!-- Vulnerable × blast radius (only when the SBOM carries CVSS) -->
          <div class="card" x-show="hasCvssData && impactRankings.vulnerable.length > 0">
            <div class="flex items-center gap-2 mb-4">
              <span
                class="flex items-center justify-center text-rose-400"
                x-html="nodeTypeIconSvg('vulnerability', 'w-4 h-4')"
              ></span>
              <h3 class="text-sm font-semibold text-white">Vulnerable × blast radius</h3>
              <span
                class="text-[10px] uppercase tracking-wider text-rose-300/80 border border-rose-500/30 rounded-sm px-1.5 py-0.5 ml-auto"
                title="Shown because this SBOM carries in-document CVSS assessments"
                >CVSS present</span
              >
            </div>
            <div class="space-y-1">
              <template x-for="row in impactRankings.vulnerable" :key="row.id">
                <button
                  @click="focusImpact(row.id)"
                  class="flex items-center gap-2.5 w-full text-left rounded-lg px-2 py-1.5 -mx-1 hover:bg-slate-700/40 transition"
                >
                  <span
                    class="flex items-center justify-center shrink-0"
                    :style="`color:${nodeTypeColor(impactNodeTypeOf(row.id))}`"
                    x-html="nodeTypeIconSvg(impactNodeTypeOf(row.id), 'w-3.5 h-3.5')"
                  ></span>
                  <span class="flex items-baseline gap-1.5 flex-1 min-w-0">
                    <span
                      class="text-sm text-slate-300 truncate font-mono"
                      x-text="relTargetDisplayName(row.id)"
                    ></span>
                    <span
                      x-show="impactVersionOf(row.id)"
                      class="text-xs text-slate-500 font-mono truncate max-w-48"
                      x-text="impactVersionOf(row.id)"
                    ></span>
                  </span>
                  <span class="badge shrink-0" :class="cvssSeverityMeta(row.severity).badgeClass">
                    <span x-text="cvssSeverityMeta(row.severity).label"></span>
                    <span
                      x-show="row.score != null"
                      class="ml-1 font-semibold tabular-nums"
                      x-text="row.score"
                    ></span>
                  </span>
                  <span
                    class="text-[10px] text-slate-500 shrink-0 w-12 text-right"
                    x-text="`${row.vulnCount} CVE${row.vulnCount === 1 ? '' : 's'}`"
                  ></span>
                  <span
                    class="text-sm font-semibold text-white tabular-nums shrink-0 w-16 text-right"
                  >
                    <span x-text="formatCount(row.total)"></span>
                    <span class="text-[10px] text-slate-500 font-normal">at risk</span>
                  </span>
                </button>
              </template>
            </div>
            <div
              class="mt-3 pt-3 border-t border-slate-700/50 text-xs text-slate-500 leading-relaxed"
            >
              Ranked by <span class="text-slate-300">reach</span>, not severity: a Medium in a
              widely-used library can outrank a Critical in a leaf. Severity is the worst of each
              package's CVEs.
            </div>
          </div>
        </div>
      </div>

      <div x-show="impactFocus" class="space-y-4">
        <div class="flex items-center gap-3 flex-wrap">
          <span
            class="flex items-center justify-center shrink-0"
            :style="`color:${nodeTypeColor(getNodeType(impactFocusElement))}`"
            x-html="impactFocusElement ? nodeTypeIconSvg(getNodeType(impactFocusElement), 'w-5 h-5') : ''"
          ></span>
          <span
            class="text-lg font-semibold text-white font-mono truncate"
            x-text="impactFocus ? relTargetDisplayName(impactFocus) : ''"
          ></span>
          <span
            x-show="impactFocus && impactVersionOf(impactFocus)"
            class="text-sm text-slate-400 font-mono truncate max-w-[16rem]"
            x-text="impactFocus ? impactVersionOf(impactFocus) : ''"
          ></span>
          <template x-if="packageRisk(impactFocus)">
            <span class="badge" :class="packageRisk(impactFocus).meta.badgeClass">
              <span x-text="packageRisk(impactFocus).meta.label"></span>
              <span
                x-show="packageRisk(impactFocus).score != null"
                class="ml-1 font-semibold"
                x-text="packageRisk(impactFocus).score"
              ></span>
              <span
                class="ml-1 opacity-80"
                x-text="`· ${packageRisk(impactFocus).vulnCount} CVE${packageRisk(impactFocus).vulnCount === 1 ? '' : 's'}`"
              ></span>
            </span>
          </template>
        </div>

        <div
          class="grid grid-cols-1 sm:grid-cols-3 gap-3"
          x-data="{ get summary() { return impactSummary(impactFocusElement) }, get dep() { return impactDependents(impactFocus) } }"
        >
          <div class="rounded-lg border border-slate-700 bg-slate-900/40 p-3">
            <div class="text-[11px] uppercase tracking-wide text-slate-500">Reachability</div>
            <div
              class="mt-1 text-sm font-semibold text-white"
              x-text="summary?.isRoot ? 'Document root' : summary?.reachable ? `${summary.hops} hop${summary.hops === 1 ? '' : 's'} from root` : 'Not root-reachable'"
            ></div>
          </div>
          <div class="rounded-lg border border-slate-700 bg-slate-900/40 p-3">
            <div class="text-[11px] uppercase tracking-wide text-slate-500">Direct dependents</div>
            <div
              class="mt-1 text-xl font-bold text-white tabular-nums"
              x-text="formatCount(dep.direct.length)"
            ></div>
          </div>
          <div class="rounded-lg border border-slate-700 bg-slate-900/40 p-3">
            <div class="text-[11px] uppercase tracking-wide text-slate-500">Total dependents</div>
            <div
              class="mt-1 text-xl font-bold text-white tabular-nums"
              x-text="formatCount(dep.total)"
            ></div>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
          <div class="card" x-data="{ get prov() { return impactProvenance(impactFocus) } }">
            <div class="flex items-center gap-2 mb-3">
              <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">
                Why it is here
              </h3>
              <span
                x-show="prov.reachable && !prov.isRoot"
                class="text-xs text-slate-500 ml-auto"
                x-text="`${prov.hops} hop${prov.hops === 1 ? '' : 's'} from root`"
              ></span>
            </div>

            <template x-if="prov.isRoot">
              <p class="text-sm text-slate-400">
                This is a document root. Nothing else pulls it in.
              </p>
            </template>
            <template x-if="!prov.isRoot && !prov.reachable">
              <p class="text-sm text-slate-400">
                No dependency or containment path from a document root reaches this element.
              </p>
            </template>
            <template x-if="!prov.isRoot && prov.reachable">
              <div>
                <div class="flex flex-col gap-0.5">
                  <template x-for="(hop, i) in prov.resolvedPaths[0]" :key="hop.id + ':' + i">
                    <div>
                      <button
                        type="button"
                        @click="focusImpact(hop.id)"
                        class="flex items-center gap-2 w-full text-left rounded-lg border px-2.5 py-1.5 transition"
                        :class="hop.id === impactFocus ? 'border-indigo-500/50 bg-indigo-500/10' : 'border-slate-700 bg-slate-900/40 hover:border-slate-600'"
                      >
                        <span
                          class="shrink-0"
                          :class="hop.isRoot ? 'rounded-full' : 'rounded-xs'"
                          :style="`width:8px;height:8px;background:${nodeTypeColor(hop.type)}`"
                        ></span>
                        <span
                          class="text-sm text-slate-200 font-mono truncate"
                          x-text="hop.name"
                        ></span>
                        <span
                          x-show="hop.version"
                          class="text-xs text-slate-500 font-mono truncate max-w-48"
                          x-text="hop.version"
                        ></span>
                      </button>
                      <div
                        x-show="i < prov.resolvedPaths[0].length - 1"
                        class="flex items-center gap-1.5 pl-4 py-0.5 text-[10px] text-slate-500"
                      >
                        <span class="w-px h-3 bg-slate-700"></span>
                        <span class="font-mono" x-text="prov.resolvedPaths[0][i + 1]?.verb"></span>
                        <span
                          x-show="prov.resolvedPaths[0][i + 1]?.soft"
                          class="text-amber-400/80 border border-amber-500/30 rounded-sm px-1"
                          >optional</span
                        >
                      </div>
                    </div>
                  </template>
                </div>
                <div
                  x-show="prov.resolvedPaths.length > 1"
                  class="text-xs text-slate-500 mt-2"
                  x-text="`· ${prov.resolvedPaths.length - 1} other path${prov.resolvedPaths.length - 1 === 1 ? '' : 's'}`"
                ></div>
              </div>
            </template>
          </div>

          <div class="card" x-data="{ get dep() { return impactDependents(impactFocus) } }">
            <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">
              What depends on it
            </h3>
            <template x-if="dep.total === 0">
              <p class="text-sm text-slate-400">
                Nothing depends on this element in the dependency graph.
              </p>
            </template>
            <template x-if="dep.total > 0">
              <div class="space-y-3">
                <div>
                  <div
                    class="text-[10px] uppercase tracking-wider text-slate-500 mb-1.5"
                    x-text="`Direct · ${dep.direct.length}`"
                  ></div>
                  <div class="flex flex-wrap gap-1.5">
                    <template x-for="d in dep.direct.slice(0, 18)" :key="d.id">
                      <button
                        type="button"
                        @click="focusImpact(d.id)"
                        class="inline-flex items-center gap-1.5 text-xs bg-slate-900/50 border border-slate-700 rounded-md px-2 py-1 hover:border-slate-600 transition font-mono text-slate-300"
                      >
                        <span
                          class="rounded-xs shrink-0"
                          :style="`width:7px;height:7px;background:${nodeTypeColor(d.type)}`"
                        ></span>
                        <span class="truncate max-w-40" x-text="d.name"></span>
                        <span
                          x-show="d.version"
                          class="text-slate-500 truncate max-w-36"
                          x-text="d.version"
                        ></span>
                      </button>
                    </template>
                    <span
                      x-show="dep.direct.length > 18"
                      class="inline-flex items-center text-xs text-slate-500 border border-dashed border-slate-700 rounded-md px-2 py-1"
                      x-text="`+${formatCount(dep.direct.length - 18)} more`"
                    ></span>
                  </div>
                </div>
                <div x-show="dep.transitive.length > 0">
                  <div
                    class="text-[10px] uppercase tracking-wider text-slate-500 mb-1.5"
                    x-text="`Transitive · ${dep.transitive.length}`"
                  ></div>
                  <div class="flex flex-wrap gap-1.5">
                    <template x-for="d in dep.transitive.slice(0, 18)" :key="d.id">
                      <button
                        type="button"
                        @click="focusImpact(d.id)"
                        class="inline-flex items-center gap-1.5 text-xs bg-slate-900/50 border border-slate-700 rounded-md px-2 py-1 hover:border-slate-600 transition font-mono text-slate-300"
                      >
                        <span
                          class="rounded-xs shrink-0"
                          :style="`width:7px;height:7px;background:${nodeTypeColor(d.type)}`"
                        ></span>
                        <span class="truncate max-w-40" x-text="d.name"></span>
                        <span
                          x-show="d.version"
                          class="text-slate-500 truncate max-w-36"
                          x-text="d.version"
                        ></span>
                      </button>
                    </template>
                    <span
                      x-show="dep.transitive.length > 18"
                      class="inline-flex items-center text-xs text-slate-500 border border-dashed border-slate-700 rounded-md px-2 py-1"
                      x-text="`+${formatCount(dep.transitive.length - 18)} more`"
                    ></span>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </div>

        <div class="card" x-show="blastRadiusOf(impactFocus).total > 0">
          <div class="flex items-center gap-2 mb-3">
            <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">
              Downstream graph
            </h3>
            <span class="text-xs text-slate-500 ml-auto">selected + dependents</span>
          </div>
          <div
            class="rounded-lg bg-slate-900/40 overflow-auto"
            x-ref="impactSvg"
            x-effect="impactFocus; renderImpactSubgraph($refs.impactSvg)"
          ></div>
          <div class="flex flex-wrap gap-4 mt-3 text-xs text-slate-400">
            <span class="inline-flex items-center gap-1.5"
              ><span class="w-2.5 h-2.5 rounded-full" style="background: #818cf8"></span>
              selected</span
            >
            <span class="inline-flex items-center gap-1.5"
              ><span class="w-2.5 h-2.5 rounded-full" style="background: #fda4af"></span> depends on
              it</span
            >
          </div>
        </div>
      </div>
    </div>
  </template>
</div>
