<div x-show="currentView === 'hardware'" class="fade-in space-y-3 max-w-5xl">
  <div class="list-sticky flex flex-wrap items-center gap-3">
    <span
      class="text-sm text-slate-400 flex-shrink-0"
      x-text="`${filteredHardware.length} hardware ${filteredHardware.length === 1 ? 'component' : 'components'}`"
    ></span>
    <input
      x-model.debounce.150ms="hardwareSearch"
      @input.debounce.150ms="restreamView('hardware')"
      type="text"
      placeholder="Filter hardware…"
      class="ml-auto bg-slate-800 border border-slate-700 rounded-lg text-xs px-2.5 py-1.5 text-slate-300 placeholder-slate-500 focus:outline-none focus:border-lime-500 w-44 sm:w-56"
    />
  </div>
  <template
    x-for="hw in (mountedViews.hardware ? renderSlice('hardware', filteredHardware) : [])"
    :key="hw.spdxId"
  >
    <div
      class="card cursor-pointer"
      data-nav-kind="hardware"
      :data-nav-id="hw.spdxId"
      :class="isNavTarget('hardware', hw.spdxId) && 'target-focus'"
      @click="toggleHardware(hw.spdxId)"
    >
      <div class="flex items-center gap-3">
        <div
          class="w-8 h-8 rounded-lg bg-lime-500/15 flex items-center justify-center flex-shrink-0"
        >
          <span
            class="flex items-center justify-center text-lime-400"
            x-html="elementIcon(hw, 'w-4 h-4')"
          ></span>
        </div>
        <div class="flex-1 min-w-0">
          <div
            class="font-medium text-white text-sm truncate"
            x-text="hw.name || cleanName(hw.spdxId)"
          ></div>
          <div class="flex items-center gap-2 mt-0.5 flex-wrap">
            <span
              class="badge text-xs bg-lime-500/15 text-lime-400"
              x-text="hw.type.replace('hardware_', '')"
            ></span>
            <span
              x-show="isMeaningful(hw.hardware_partNumber)"
              class="badge text-xs bg-slate-700 text-slate-300 font-mono"
              x-text="hw.hardware_partNumber"
            ></span>
            <span
              x-show="hardwareManufacturer(hw)"
              class="badge text-xs bg-red-500/15 text-red-400"
              x-text="hardwareManufacturer(hw)?.name"
            ></span>
          </div>
        </div>
        <svg
          class="w-4 h-4 text-slate-500 transition-transform flex-shrink-0"
          :class="expandedHardware === hw.spdxId && 'rotate-180'"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 9l-7 7-7-7"
          />
        </svg>
      </div>
      <!-- Expanded detail (built lazily via x-if for only the open card) -->
      <template x-if="expandedHardware === hw.spdxId">
        <div class="mt-4 pt-4 border-t border-slate-700 space-y-3 sm:pl-11 fade-in" @click.stop>
          <!-- Summary -->
          <div x-show="isMeaningful(hw.summary)">
            <div class="text-xs text-slate-500 mb-1">Summary</div>
            <div
              class="text-xs text-slate-300 whitespace-pre-wrap break-words"
              x-text="hw.summary"
            ></div>
          </div>

          <!-- Description -->
          <div x-show="isMeaningful(hw.description) && hw.description !== hw.summary">
            <div class="text-xs text-slate-500 mb-1">Description</div>
            <div
              class="text-xs text-slate-300 whitespace-pre-wrap break-words max-h-32 overflow-y-auto"
              x-text="hw.description"
            ></div>
          </div>

          <!-- Spec sheet -->
          <div class="grid grid-cols-2 gap-x-4 gap-y-2">
            <div x-show="isMeaningful(hw.hardware_partNumber)">
              <div class="text-[10px] text-slate-500 uppercase tracking-wider mb-0.5">
                Part number
              </div>
              <code class="text-xs text-slate-300 break-all" x-text="hw.hardware_partNumber"></code>
            </div>
            <div x-show="isMeaningful(hw.hardware_category)">
              <div class="text-[10px] text-slate-500 uppercase tracking-wider mb-0.5">Category</div>
              <span class="text-xs text-slate-300" x-text="hw.hardware_category"></span>
            </div>
            <div x-show="hardwareManufacturer(hw)">
              <div class="text-[10px] text-slate-500 uppercase tracking-wider mb-0.5">
                Manufacturer
              </div>
              <span class="text-xs text-red-400" x-text="hardwareManufacturer(hw)?.name"></span>
            </div>
            <template x-for="spec in hardwareSpecs(hw)" :key="spec.label">
              <div>
                <div
                  class="text-[10px] text-slate-500 uppercase tracking-wider mb-0.5"
                  x-text="spec.label"
                ></div>
                <span
                  class="text-xs text-slate-300 break-words"
                  :class="spec.mono && 'font-mono break-all'"
                  x-text="spec.value"
                ></span>
              </div>
            </template>
          </div>

          <!-- External identifiers -->
          <div x-show="externalIdentifiers(hw).length > 0">
            <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">
              Identifiers
            </div>
            <div class="space-y-1.5">
              <template x-for="eid in externalIdentifiers(hw)" :key="eid.type + eid.identifier">
                <div class="flex items-start gap-2 group">
                  <span
                    class="text-[10px] text-slate-500 uppercase tracking-wider w-20 pt-0.5 flex-shrink-0 text-right"
                    x-text="eid.label"
                  ></span>
                  <code
                    class="hash-text text-slate-300 break-all flex-1 leading-relaxed"
                    x-text="eid.identifier"
                  ></code>
                  <button
                    @click.stop="copyHash(eid.identifier)"
                    class="opacity-0 group-hover:opacity-100 text-slate-500 hover:text-white transition-opacity flex-shrink-0 pt-0.5"
                    title="Copy"
                  >
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"
                      />
                    </svg>
                  </button>
                </div>
              </template>
            </div>
          </div>

          <!-- Relationships — grouped semantically (contains, runsOn, …) -->
          <template x-for="group in detailRelGroupsFor(hw)" :key="group.key">
            <div class="detail-rel-section">
              <div class="flex items-center gap-2 mb-2">
                <span class="detail-rel-line" :style="`background: ${group.color}`"></span>
                <span
                  class="text-xs font-semibold uppercase tracking-wider"
                  :style="`color: ${group.color}`"
                  x-text="group.label"
                ></span>
                <span class="text-[10px] text-slate-500" x-text="'(' + group.total + ')'"></span>
              </div>
              <div class="space-y-1 ml-3">
                <template x-for="item in group.items" :key="item.id">
                  <div
                    class="detail-rel-item group"
                    @click.stop="item.multiRange ? openSnippetRanges(item.snippetIds) : navigateTo(item.id)"
                  >
                    <span
                      class="detail-rel-arrow"
                      :style="`color: ${group.color}`"
                      x-text="item.direction === 'out' ? '→' : '←'"
                    ></span>
                    <span
                      class="flex items-center flex-shrink-0"
                      :style="`color: ${nodeTypeColor(getNodeType(elementMap.get(item.id) || {}))}`"
                      x-html="elementIcon(elementMap.get(item.id) || { spdxId: item.id }, 'w-3.5 h-3.5')"
                    ></span>
                    <span class="flex-1 truncate" x-text="item.displayName"></span>
                    <span
                      x-show="item.scope"
                      class="text-[10px] px-1.5 py-0.5 rounded bg-slate-700/60 text-slate-400 flex-shrink-0"
                      :title="'Lifecycle scope: ' + item.scope"
                      x-text="item.scope"
                    ></span>
                    <svg
                      class="w-3 h-3 text-slate-600 group-hover:text-slate-400 transition-colors flex-shrink-0"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M9 5l7 7-7 7"
                      />
                    </svg>
                  </div>
                </template>
                <div
                  x-show="group.hiddenCount > 0"
                  class="text-[10px] text-slate-500 italic pl-1"
                  x-text="'+' + formatCount(group.hiddenCount) + ' more'"
                ></div>
              </div>
            </div>
          </template>
        </div>
      </template>
    </div>
  </template>
</div>
