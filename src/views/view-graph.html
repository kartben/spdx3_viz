<div x-show="currentView === 'graph'" class="fade-in absolute inset-0 flex flex-col">
  <!-- Graph controls -->
  <div
    class="flex items-center gap-3 px-5 py-3 bg-slate-800/50 border-b border-slate-700/50 flex-shrink-0 flex-wrap"
  >
    <!-- Search -->
    <div class="flex items-center gap-2">
      <div class="relative">
        <svg
          class="w-3.5 h-3.5 absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-500"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
          />
        </svg>
        <input
          type="text"
          x-model="graphSearchQuery"
          @input.debounce.150ms="graphSearch()"
          placeholder="Search nodes…"
          class="w-40 sm:w-52 pl-8 pr-7 py-1 bg-slate-800 border border-slate-700 rounded-md text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-colors"
        />
        <button
          x-show="graphSearchQuery"
          @click="clearGraphSearch()"
          class="absolute right-1.5 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-200 text-base leading-none"
          title="Clear search"
        >
          &times;
        </button>
      </div>
      <label
        class="flex items-center gap-1.5 cursor-pointer"
        title="Search across the whole element (all fields), not just its name"
      >
        <input
          type="checkbox"
          x-model="graphSearchFullText"
          @change="graphSearch()"
          class="rounded border-slate-600 bg-slate-700 text-blue-500 focus:ring-0 focus:ring-offset-0 w-3.5 h-3.5"
        />
        <span class="text-xs text-slate-300">Full-text</span>
      </label>
      <select
        x-show="graphSearchQuery"
        x-model="graphSearchMode"
        @change="graphSearch()"
        title="How to treat non-matching nodes"
        class="text-xs bg-slate-800 border border-slate-700 rounded-md text-slate-300 px-1.5 py-1 focus:outline-none focus:border-blue-500"
      >
        <option value="dim">Dim others</option>
        <option value="focus">Focus matches</option>
      </select>
      <span
        x-show="graphSearchQuery"
        class="text-xs whitespace-nowrap"
        :class="graphMatchCount ? 'text-amber-400' : 'text-slate-500'"
        x-text="`${formatCount(graphMatchCount)} ${graphMatchCount === 1 ? 'match' : 'matches'}`"
      ></span>
    </div>
    <div class="ml-auto flex items-center gap-3">
      <span
        x-show="graphNodeCount"
        class="text-xs text-slate-400 whitespace-nowrap"
        x-text="`${formatCount(graphNodeCount)} nodes · ${formatCount(graphEdgeCount)} edges`"
      ></span>
      <div class="flex items-center gap-0.5 bg-slate-800 border border-slate-700 rounded-md p-0.5">
        <button
          type="button"
          @click="graphUseIcons = !graphUseIcons; toggleGraphIcons()"
          :class="graphUseIcons ? 'bg-blue-500/20 text-blue-400' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-700'"
          class="g-tip p-1.5 rounded transition-colors"
          aria-label="Use type icons"
          data-tip="Represent each node with its type's icon (folder, package, chip, …) instead of a plain coloured dot."
          x-html="uiIconSvg('toggle_icons')"
        ></button>
        <!-- Tooltip lives on the wrapper span: the button can be :disabled (when the
             graph is auto-aggregated) and a CSS :hover tooltip would not fire on a
             disabled control. Hovering the span still works in that state. -->
        <span
          class="g-tip flex items-center"
          :data-tip="graphTruncated ? 'Too many nodes or edges to show flat, so aggregation is on automatically. Double-click a cluster to drill in.' : 'Aggregate: group files into their package/directory and build steps into their root build. Double-click a cluster to drill in.'"
        >
          <button
            type="button"
            :disabled="graphTruncated"
            @click="graphAggregate = !graphAggregate; updateGraph()"
            :class="(graphAggregate || graphTruncated) ? 'bg-blue-500/20 text-blue-400' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-700'"
            class="p-1.5 rounded transition-colors disabled:cursor-not-allowed disabled:opacity-50"
            aria-label="Aggregate nodes"
            x-html="uiIconSvg('toggle_aggregate')"
          ></button>
        </span>
        <button
          type="button"
          @click="graphHideOrphans = !graphHideOrphans; updateGraph()"
          :class="graphHideOrphans ? 'bg-blue-500/20 text-blue-400' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-700'"
          class="g-tip p-1.5 rounded transition-colors"
          aria-label="Hide orphans"
          data-tip="Hide nodes left with no edges once every other filter is applied."
          x-html="uiIconSvg('toggle_hide_orphans')"
        ></button>
        <!-- Main-artifact focus: gray out everything that didn't contribute to
             the selected main build output. Only shown once one is set. -->
        <button
          type="button"
          x-show="hasMainArtifact"
          @click="toggleMainArtifactFocus()"
          :class="graphFocusMainArtifact ? 'bg-amber-500/20 text-amber-400' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-700'"
          class="g-tip p-1.5 rounded transition-colors"
          aria-label="Focus on main artifact"
          :data-tip="`${graphFocusMainArtifact ? 'Showing' : 'Dim nodes outside'} everything that builds ${mainArtifactName}. Click to ${graphFocusMainArtifact ? 'show the whole graph' : 'focus it'}.`"
        >
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"
            />
          </svg>
        </button>
        <div class="w-px self-stretch bg-slate-700 mx-0.5"></div>
        <button
          type="button"
          x-show="graphExpandedCount"
          @click="collapseAllClusters()"
          class="g-tip p-1.5 rounded transition-colors text-slate-400 hover:text-slate-200 hover:bg-slate-700"
          aria-label="Collapse all clusters"
          data-tip="Collapse every drilled-in cluster back to its aggregated bubble."
          x-html="uiIconSvg('collapse_clusters')"
        ></button>
        <button
          type="button"
          @click="resetGraphZoom()"
          :class="graphAutoFit ? 'bg-blue-500/20 text-blue-400' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-700'"
          class="g-tip p-1.5 rounded transition-colors"
          aria-label="Reset zoom"
          :data-tip="graphAutoFit ? 'Auto-fit is on: the graph reframes to fit on every change. Pan or zoom to take manual control.' : 'Reset the pan and zoom to fit the whole graph, and re-enable auto-fit.'"
          x-html="uiIconSvg('reset_zoom')"
        ></button>
      </div>
      <!-- Focus lens mode: gray out vs. hide non-contributing nodes. Only
           meaningful while a main artifact is set and the lens is on. -->
      <select
        x-show="hasMainArtifact && graphFocusMainArtifact"
        x-model="graphFocusMode"
        @change="setGraphFocusMode(graphFocusMode)"
        title="How to treat nodes that didn't contribute to the main artifact"
        class="text-xs bg-slate-800 border border-slate-700 rounded-md text-slate-300 px-1.5 py-1 focus:outline-none focus:border-amber-500"
      >
        <option value="dim">Gray out others</option>
        <option value="hide">Hide others</option>
      </select>
      <!-- Layout picker: switch how the force sim arranges nodes (organic,
           hierarchy, radial, spotlight artifacts, type lanes). Each entry
           carries a Material icon and a one-line "when to use it" hint. -->
      <div class="relative" @click.outside="closeLayoutMenu()">
        <button
          type="button"
          @click="toggleLayoutMenu()"
          aria-haspopup="menu"
          :aria-expanded="graphLayoutMenuOpen"
          :class="graphLayout !== 'organic'
                    ? 'bg-blue-500/15 text-blue-300 ring-1 ring-blue-500/40'
                    : 'bg-slate-800 border border-slate-700 text-slate-400 hover:text-slate-200 hover:bg-slate-700'"
          class="h-8 flex items-center gap-1.5 pl-1.5 pr-2 py-1 rounded-md transition-colors"
          :title="`Graph layout: ${currentGraphLayout.label}`"
        >
          <span class="flex items-center" x-html="uiIconSvg(currentGraphLayout.icon)"></span>
          <span
            class="text-xs font-medium whitespace-nowrap"
            x-text="currentGraphLayout.short"
          ></span>
          <svg
            class="w-3 h-3 opacity-60 transition-transform"
            :class="graphLayoutMenuOpen ? 'rotate-180' : ''"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.5"
              d="M19 9l-7 7-7-7"
            />
          </svg>
        </button>
        <!-- Layout picker menu -->
        <div
          x-show="graphLayoutMenuOpen"
          x-transition.origin.top.right
          x-cloak
          role="menu"
          aria-label="Graph layout"
          class="absolute right-0 top-full mt-1.5 z-30 w-80 bg-slate-800 border border-slate-700 rounded-lg shadow-xl shadow-black/40 p-1.5"
        >
          <div class="px-2 py-1 text-[11px] font-medium uppercase tracking-wide text-slate-500">
            Graph layout
          </div>
          <template x-for="l in graphLayoutList" :key="l.key">
            <button
              type="button"
              @click="setGraphLayout(l.key)"
              role="menuitemradio"
              :aria-checked="graphLayout === l.key"
              class="w-full flex items-start gap-2.5 px-2 py-2 rounded-md text-left transition-colors"
              :class="graphLayout === l.key ? 'bg-slate-700/70' : 'hover:bg-slate-700/40'"
            >
              <span
                class="mt-0.5 flex items-center justify-center flex-shrink-0"
                :class="graphLayout === l.key ? 'text-blue-300' : 'text-slate-400'"
                x-html="uiIconSvg(l.icon, 'w-4 h-4')"
              ></span>
              <span class="flex-1 min-w-0">
                <span class="text-xs font-medium text-slate-200" x-text="l.label"></span>
                <span
                  class="block text-[11px] text-slate-500 mt-0.5 leading-snug"
                  x-text="l.hint"
                ></span>
              </span>
              <template x-if="graphLayout === l.key">
                <span class="mt-0.5 flex-shrink-0 text-blue-300" title="Active">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2.5"
                      d="M5 13l4 4L19 7"
                    />
                  </svg>
                </span>
              </template>
            </button>
          </template>
        </div>
      </div>
      <!-- Heatmap overlay: bloom a risk signal (open vulnerabilities, failing
           verifications, unverified requirements) over the relevant graph
           regions. Only shown when the SBOM carries data any lens can use. -->
      <div class="relative" x-show="graphHeatAvailable" @click.outside="closeHeatMenu()">
        <button
          type="button"
          @click="toggleHeatMenu()"
          aria-haspopup="menu"
          :aria-expanded="graphHeatMenuOpen"
          :class="graphHeatActive
                    ? (graphHeatMode === 'unverified'
                        ? 'bg-amber-500/15 text-amber-300 ring-1 ring-amber-500/40'
                        : 'bg-rose-500/15 text-rose-300 ring-1 ring-rose-500/40')
                    : 'bg-slate-800 border border-slate-700 text-slate-400 hover:text-slate-200 hover:bg-slate-700'"
          class="h-8 flex items-center gap-1.5 pl-1.5 pr-2 py-1 rounded-md transition-colors"
          :title="graphHeatActive ? `Heatmap: ${heatModeMeta(graphHeatMode).label}` : 'Overlay a heatmap of risk on the graph'"
        >
          <span class="flex items-center" x-html="uiIconSvg('toggle_heatmap')"></span>
          <span
            class="text-xs font-medium whitespace-nowrap"
            x-text="graphHeatActive
                      ? `${heatModeMeta(graphHeatMode).short} · ${formatCount(graphHeatCount)}`
                      : 'Heatmap'"
          ></span>
          <svg
            class="w-3 h-3 opacity-60 transition-transform"
            :class="graphHeatMenuOpen ? 'rotate-180' : ''"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.5"
              d="M19 9l-7 7-7-7"
            />
          </svg>
        </button>
        <!-- Mode picker -->
        <div
          x-show="graphHeatMenuOpen"
          x-transition.origin.top.right
          x-cloak
          role="menu"
          aria-label="Heatmap overlay"
          class="absolute right-0 top-full mt-1.5 z-30 w-72 bg-slate-800 border border-slate-700 rounded-lg shadow-xl shadow-black/40 p-1.5"
        >
          <div class="px-2 py-1 text-[11px] font-medium uppercase tracking-wide text-slate-500">
            Risk heatmap
          </div>
          <template x-for="m in graphHeatModeList" :key="m.key">
            <button
              type="button"
              @click="setGraphHeatMode(m.key)"
              :disabled="!m.count"
              role="menuitemradio"
              :aria-checked="graphHeatMode === m.key"
              class="w-full flex items-start gap-2.5 px-2 py-2 rounded-md text-left transition-colors"
              :class="!m.count
                        ? 'cursor-not-allowed opacity-55'
                        : graphHeatMode === m.key
                          ? 'bg-slate-700/70'
                          : 'hover:bg-slate-700/40'"
            >
              <span
                class="mt-0.5 flex items-center justify-center flex-shrink-0"
                :style="`color:${m.color}`"
                x-html="uiIconSvg(m.icon, 'w-4 h-4')"
              ></span>
              <span class="flex-1 min-w-0">
                <span class="flex items-center gap-2">
                  <span class="text-xs font-medium text-slate-200" x-text="m.label"></span>
                  <span
                    class="ml-auto text-[10px] px-1.5 py-0.5 rounded-full font-medium"
                    :class="m.count ? 'bg-slate-900 text-slate-300' : 'bg-slate-900/60 text-slate-600'"
                    x-text="formatCount(m.count)"
                  ></span>
                </span>
                <span
                  class="block text-[11px] text-slate-500 mt-0.5 leading-snug"
                  x-text="m.count ? m.hint : m.emptyHint"
                ></span>
              </span>
              <template x-if="graphHeatMode === m.key">
                <span class="mt-0.5 flex-shrink-0" :style="`color:${m.color}`" title="Active">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2.5"
                      d="M5 13l4 4L19 7"
                    />
                  </svg>
                </span>
              </template>
            </button>
          </template>
          <div class="border-t border-slate-700/60 mt-1 pt-1">
            <button
              type="button"
              @click="clearGraphHeat()"
              :disabled="!graphHeatActive"
              class="w-full text-left px-2 py-1.5 text-xs rounded-md transition-colors"
              :class="graphHeatActive ? 'text-slate-300 hover:bg-slate-700/40' : 'text-slate-600 cursor-default'"
            >
              Turn off
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Graph canvas -->
  <div class="flex-1 relative graph-container" id="graphContainer">
    <div id="graphTooltip" class="tooltip hidden"></div>
    <!-- Auto-detect confirm banner: surfaced once when the app picks a main
         artifact on load, so the focus lens never feels like it happened by
         magic. Dismissible; also drops away the moment the user overrides. -->
    <div
      x-show="showMainArtifactBanner"
      x-transition
      class="absolute top-3 left-1/2 -translate-x-1/2 z-20 max-w-[calc(100%-1.5rem)] flex items-center gap-2.5 pl-3 pr-2 py-2 rounded-lg bg-slate-800/95 backdrop-blur-sm border border-amber-500/40 shadow-lg text-xs"
    >
      <svg
        class="w-4 h-4 text-amber-400 flex-shrink-0"
        viewBox="0 0 24 24"
        fill="currentColor"
        aria-hidden="true"
      >
        <path
          d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"
        />
      </svg>
      <span class="text-slate-200 min-w-0">
        Focused on
        <button
          @click="if (mainArtifactElement) selectGraphNode(mainArtifactId)"
          class="font-semibold text-amber-300 hover:underline"
          x-text="mainArtifactName"
        ></button>
        <span class="text-slate-400">as the main output.</span>
      </span>
      <button
        @click="clearMainArtifact()"
        class="flex-shrink-0 text-slate-400 hover:text-slate-200 px-1.5 py-0.5 rounded hover:bg-slate-700 transition-colors"
        title="Clear the main artifact"
      >
        Clear
      </button>
      <button
        @click="dismissMainArtifactBanner()"
        class="flex-shrink-0 p-1 text-slate-400 hover:text-slate-200 rounded hover:bg-slate-700 transition-colors"
        aria-label="Dismiss"
      >
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>
  </div>
  <!-- Graph legend (click an entry to toggle that type on/off) -->
  <div
    class="relative z-10 flex items-center gap-x-4 gap-y-1.5 px-5 py-2.5 bg-slate-900/90 backdrop-blur-sm border-t border-slate-700/50 flex-shrink-0 flex-wrap"
  >
    <!-- Heatmap scale: only while an overlay is active, so the glow on the canvas
         is legible (which signal, and which end is hotter). -->
    <template x-if="graphHeatActive">
      <div class="basis-full flex items-center gap-2 flex-wrap">
        <span
          class="flex items-center gap-1.5 text-xs text-slate-300"
          :title="heatModeMeta(graphHeatMode).hint"
        >
          <span
            class="flex items-center"
            :style="`color:${heatModeMeta(graphHeatMode).color}`"
            x-html="uiIconSvg(heatModeMeta(graphHeatMode).icon, 'w-3.5 h-3.5')"
          ></span>
          <span x-text="`Heatmap · ${heatModeMeta(graphHeatMode).label}`"></span>
        </span>
        <span
          class="h-2 w-24 rounded-full ring-1 ring-slate-700/60"
          style="
            background: linear-gradient(
              90deg,
              rgba(245, 158, 11, 0) 0%,
              rgba(245, 158, 11, 0.85) 45%,
              #f43f5e 100%
            );
          "
        ></span>
        <span class="text-[11px] text-slate-500">low &rarr; high</span>
        <button
          type="button"
          @click="clearGraphHeat()"
          class="text-[11px] text-slate-500 hover:text-slate-300 underline decoration-dotted"
        >
          clear
        </button>
      </div>
    </template>
    <span
      class="flex items-center gap-1 text-[11px] text-slate-500 italic mr-1 select-none"
      title="Click any entry below to show or hide that type"
    >
      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"
        />
      </svg>
      <span>click to show/hide</span>
    </span>
    <div class="basis-full h-0"></div>
    <span class="text-xs text-slate-500" title="Click an entry to toggle it">Nodes:</span>
    <template x-for="f in visibleGraphFilters.filter((x) => !x.isRel)" :key="f.key">
      <button
        type="button"
        @click="f.active = !f.active; updateGraph()"
        :title="f.active ? `Hide ${f.label}` : `Show ${f.label}`"
        class="flex items-center gap-1.5 text-xs cursor-pointer transition-colors hover:text-white"
        :class="f.active ? 'text-slate-300' : 'text-slate-500 line-through'"
      >
        <span
          x-show="graphUseIcons"
          class="flex items-center justify-center transition-opacity"
          :style="`color:${f.color}`"
          :class="f.active ? 'opacity-100' : 'opacity-40'"
          x-html="nodeTypeIconSvg(f.key)"
        ></span>
        <span
          x-show="!graphUseIcons"
          class="w-2.5 h-2.5 rounded-full border transition-colors"
          :style="f.active
                      ? `background:${f.color}; border-color:${f.color}`
                      : `background:transparent; border-color:${f.color}`"
        ></span>
        <span x-text="f.label"></span>
      </button>
    </template>
    <div class="basis-full h-0"></div>
    <span class="text-xs text-slate-500" title="Click an entry to toggle it">Edges:</span>
    <template x-for="f in visibleGraphFilters.filter((x) => x.isRel)" :key="f.key">
      <button
        type="button"
        @click="f.active = !f.active; updateGraph()"
        :title="f.active ? `Hide ${f.label}` : `Show ${f.label}`"
        class="flex items-center gap-1.5 text-xs cursor-pointer transition-colors hover:text-white"
        :class="f.active ? 'text-slate-300' : 'text-slate-500 line-through'"
      >
        <span
          class="w-4 h-0.5 rounded transition-opacity"
          :style="relEdgeSwatchStyle(f)"
          :class="f.active ? 'opacity-100' : 'opacity-30'"
        ></span>
        <span x-text="f.label"></span>
      </button>
    </template>
    <!-- Lifecycle-scope filters: only shown when the SBOM scopes some relationship.
         Toggling a scope off hides its edges (and any node left with none), so you
         can isolate, e.g., the runtime dependency graph from build-time edges. -->
    <template x-if="visibleScopeFilters.length">
      <div class="basis-full h-0"></div>
    </template>
    <template x-if="visibleScopeFilters.length">
      <span
        class="text-xs text-slate-500"
        title="Lifecycle scope of each relationship. Toggle a scope off to hide its edges — turn off Build and Unscoped to see just the runtime graph."
        >Scope:</span
      >
    </template>
    <template x-for="f in visibleScopeFilters" :key="f.key">
      <button
        type="button"
        @click="f.active = !f.active; updateGraph()"
        :title="f.active ? `Hide ${f.label} edges` : `Show ${f.label} edges`"
        class="flex items-center gap-1.5 text-xs cursor-pointer transition-colors hover:text-white"
        :class="f.active ? 'text-slate-300' : 'text-slate-500 line-through'"
      >
        <span
          class="w-2.5 h-2.5 rounded-sm border transition-colors"
          :style="f.active
                      ? `background:${f.color}; border-color:${f.color}`
                      : `background:transparent; border-color:${f.color}`"
        ></span>
        <span x-text="f.label"></span>
      </button>
    </template>
  </div>
</div>
