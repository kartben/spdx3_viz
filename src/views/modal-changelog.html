<div
  x-show="changelogModalOpen"
  x-transition.opacity
  @keydown.escape.window="closeChangelogModal()"
  class="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm"
  @click.self="closeChangelogModal()"
>
  <div
    class="w-full max-w-xl max-h-[85vh] flex flex-col bg-slate-800 border border-slate-700 rounded-xl shadow-2xl"
    @click.stop
  >
    <div class="flex items-start gap-3 px-5 py-4 border-b border-slate-700">
      <div class="flex-1 min-w-0">
        <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">
          What's new
        </div>
        <div class="font-semibold text-white text-sm">
          SPDX 3 SBOM Visualizer <span class="text-slate-500" x-text="'v' + appVersion"></span>
        </div>
      </div>
      <button
        type="button"
        class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-700 transition-colors"
        @click="closeChangelogModal()"
        title="Close"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>
    <div class="flex-1 min-h-0 overflow-auto px-5 py-4 space-y-5">
      <template x-for="release in changelog" :key="release.version">
        <div>
          <div class="flex items-baseline gap-2 mb-2">
            <span
              class="font-mono text-sm font-semibold"
              :class="release.version === 'Unreleased' ? 'text-amber-300' : 'text-blue-300'"
              x-text="release.version === 'Unreleased' ? 'Unreleased' : 'v' + release.version"
            ></span>
            <span x-show="release.date" class="text-xs text-slate-500" x-text="release.date"></span>
          </div>
          <ul class="space-y-1.5 list-disc list-inside marker:text-slate-600">
            <template x-for="(item, i) in release.items" :key="i">
              <li class="text-sm text-slate-300 leading-snug" x-text="item"></li>
            </template>
          </ul>
        </div>
      </template>
    </div>
    <div class="flex items-center justify-end gap-2 px-5 py-3 border-t border-slate-700">
      <a
        href="https://github.com/kartben/spdx3_viz/blob/main/CHANGELOG.md"
        target="_blank"
        rel="noopener noreferrer"
        class="text-xs text-slate-400 hover:text-slate-200 transition-colors"
      >
        Full changelog on GitHub
      </a>
    </div>
  </div>
</div>
