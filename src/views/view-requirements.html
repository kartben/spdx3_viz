<div x-show="currentView === 'requirements'" class="fade-in space-y-3 max-w-6xl">
  <div class="list-sticky space-y-3">
    <div class="flex flex-wrap items-center gap-3">
      <!-- Breakdown summary of the folded-in FunctionalSafety elements -->
      <span class="text-sm text-slate-400 flex-shrink-0">
        <span x-text="safetyCounts.requirements"></span> requirements<template
          x-if="safetyCounts.verifications"
          ><span
            ><span class="text-slate-600"> · </span
            ><span x-text="safetyCounts.verifications"></span> verifications</span
          ></template
        ><template x-if="safetyCounts.evaluations"
          ><span
            ><span class="text-slate-600"> · </span
            ><span x-text="safetyCounts.evaluations"></span> evaluations</span
          ></template
        ><template x-if="safetyCounts.assumptions"
          ><span
            ><span class="text-slate-600"> · </span
            ><span x-text="safetyCounts.assumptions"></span> assumptions</span
          ></template
        >
      </span>
      <!-- Layout toggle: list, tracedToDetail tree, and safety-case rollup views -->
      <div
        x-show="safetyCounts.requirements > 0"
        class="ml-auto inline-flex rounded-lg border border-slate-700 overflow-hidden text-xs"
      >
        <template x-for="layout in safetyRequirementLayouts" :key="layout.key">
          <button
            type="button"
            @click="setRequirementLayout(layout.key)"
            class="px-3 py-1.5 transition-colors"
            :class="requirementLayout === layout.key ? 'bg-slate-700 text-white' : 'bg-slate-800 text-slate-400 hover:text-slate-200'"
          >
            <span x-text="layout.label"></span>
          </button>
        </template>
      </div>
      <input
        x-show="requirementLayout !== 'tree'"
        x-model="requirementSearch"
        @input.debounce.150ms="requirementLayout === 'list' && restreamView('requirements')"
        type="text"
        placeholder="Filter..."
        :class="safetyCounts.requirements === 0 && 'ml-auto'"
        class="bg-slate-800 border border-slate-700 rounded-lg text-xs px-2.5 py-1.5 text-slate-300 placeholder-slate-500 focus:outline-none focus:border-yellow-500 w-44 sm:w-56"
      />
    </div>

    <!-- Safety-case verification rollup: at-a-glance status bar + status filters -->
    <template x-if="safetyCounts.requirements > 0 && safetyStatusOrder.length">
      <div class="space-y-2">
        <div class="flex items-baseline gap-2">
          <span
            class="text-sm font-semibold text-white"
            x-text="`${safetyStatusSummary.verifiedPct}% verified`"
          ></span>
          <span
            class="text-xs text-slate-500"
            x-text="`${formatCount(safetyStatusSummary.counts.passed)} of ${formatCount(safetyStatusSummary.total)} requirements pass verification`"
          ></span>
        </div>
        <!-- Stacked status bar -->
        <div class="flex h-2.5 w-full rounded-full overflow-hidden bg-slate-700">
          <template x-for="s in safetyStatusOrder" :key="s">
            <div
              class="h-full first:rounded-l-full last:rounded-r-full"
              :style="`width:${(safetyStatusSummary.counts[s] / safetyStatusSummary.total) * 100}%; background:${safetyStatusMeta(s).color}`"
              :title="`${safetyStatusMeta(s).label}: ${safetyStatusSummary.counts[s]}`"
            ></div>
          </template>
        </div>
        <!-- Status filter chips (click to filter the list; click again to clear) -->
        <div class="flex flex-wrap items-center gap-2">
          <span class="text-xs text-slate-500 mr-0.5">Verification</span>
          <template x-for="s in safetyStatusOrder" :key="s">
            <button
              type="button"
              @click="requirementStatusFilter = (requirementStatusFilter === s ? '' : s); requirementKindFilter = 'Requirement'; if (requirementLayout === 'tree') requirementLayout = 'list'; if (requirementLayout === 'list') restreamView('requirements')"
              class="badge transition"
              :class="requirementStatusFilter === s ? safetyStatusMeta(s).badgeClass + ' brightness-125' : 'bg-slate-800 text-slate-400 hover:text-slate-200'"
              :title="`Show ${safetyStatusMeta(s).label} requirements`"
            >
              <span
                class="mr-1.5 flex items-center"
                x-html="uiIconSvg(safetyStatusMeta(s).iconKey, 'w-3.5 h-3.5')"
              ></span>
              <span x-text="safetyStatusMeta(s).label"></span>
              <span
                class="ml-1.5 font-semibold"
                x-text="formatCount(safetyStatusSummary.counts[s])"
              ></span>
            </button>
          </template>
          <!-- Traceability gap: requirements carrying no implementedBy link -->
          <template x-if="safetyStatusSummary.noImpl > 0">
            <button
              type="button"
              @click="requirementStatusFilter = (requirementStatusFilter === 'noimpl' ? '' : 'noimpl'); requirementKindFilter = 'Requirement'; if (requirementLayout === 'tree') requirementLayout = 'list'; if (requirementLayout === 'list') restreamView('requirements')"
              class="badge transition"
              :class="requirementStatusFilter === 'noimpl' ? safetyStatusMeta('noimpl').badgeClass + ' brightness-125' : 'bg-slate-800 text-slate-400 hover:text-slate-200'"
              title="Requirements with no implementedBy link"
            >
              <span
                class="w-1.5 h-1.5 rounded-full mr-1.5"
                :class="safetyStatusMeta('noimpl').dotClass"
              ></span>
              <span x-text="safetyStatusMeta('noimpl').label"></span>
              <span
                class="ml-1.5 font-semibold"
                x-text="formatCount(safetyStatusSummary.noImpl)"
              ></span>
            </button>
          </template>
          <!-- Traceability gap: requirements whose verification chain has no hasEvidence target -->
          <template x-if="safetyStatusSummary.noEvidence > 0">
            <button
              type="button"
              @click="requirementStatusFilter = (requirementStatusFilter === 'noevidence' ? '' : 'noevidence'); requirementKindFilter = 'Requirement'; if (requirementLayout === 'tree') requirementLayout = 'list'; if (requirementLayout === 'list') restreamView('requirements')"
              class="badge transition"
              :class="requirementStatusFilter === 'noevidence' ? safetyStatusMeta('noevidence').badgeClass + ' brightness-125' : 'bg-slate-800 text-slate-400 hover:text-slate-200'"
              title="Requirements whose verification chain has no evidence artifact"
            >
              <span
                class="w-1.5 h-1.5 rounded-full mr-1.5"
                :class="safetyStatusMeta('noevidence').dotClass"
              ></span>
              <span x-text="safetyStatusMeta('noevidence').label"></span>
              <span
                class="ml-1.5 font-semibold"
                x-text="formatCount(safetyStatusSummary.noEvidence)"
              ></span>
            </button>
          </template>
        </div>
      </div>
    </template>
    <!-- Kind filter (only kinds actually present are offered) -->
    <div x-show="requirementLayout === 'list'" class="flex flex-wrap items-center gap-1.5 !mt-6">
      <template
        x-for="chip in [
                  { key: '', label: 'All' },
                  { key: 'Requirement', label: 'Requirements', n: safetyCounts.requirements },
                  { key: 'functionalsafety_RequirementVerification', label: 'Verifications', n: safetyCounts.verifications },
                  { key: 'functionalsafety_EvaluationResult', label: 'Evaluations', n: safetyCounts.evaluations },
                  { key: 'functionalsafety_Assumption', label: 'Assumptions', n: safetyCounts.assumptions }
                ].filter(c => c.key === '' || c.n > 0)"
        :key="chip.key"
      >
        <button
          type="button"
          @click="requirementKindFilter = chip.key; requirementStatusFilter = ''; restreamView('requirements')"
          class="px-2.5 py-1 rounded-full text-xs border transition-colors"
          :class="requirementKindFilter === chip.key
                    ? 'bg-yellow-500/15 text-yellow-300 border-yellow-500/40'
                    : 'bg-slate-800 text-slate-400 border-slate-700 hover:text-slate-200'"
        >
          <span x-text="chip.label"></span>
          <span x-show="chip.n !== undefined" class="text-slate-500" x-text="`(${chip.n})`"></span>
        </button>
      </template>
    </div>
    <div
      x-show="safetyCounts.requirements > 0"
      class="flex flex-col sm:flex-row sm:items-baseline gap-1 sm:gap-2 text-xs border-t border-slate-800/80 pt-2"
    >
      <span class="font-semibold text-slate-200" x-text="safetyRequirementLayoutIntro.title"></span>
      <span class="text-slate-500" x-text="safetyRequirementLayoutIntro.description"></span>
    </div>
  </div>
  <!-- Requirement decomposition tree (tracedToDetail: goal → detailed requirement) -->
  <template x-if="requirementLayout === 'tree'">
    <div class="space-y-2">
      <div class="flex items-center gap-3 text-xs">
        <button type="button" @click="expandAllReqs()" class="text-slate-400 hover:text-slate-200">
          Expand all
        </button>
        <span class="text-slate-600">·</span>
        <button
          type="button"
          @click="collapseAllReqs()"
          class="text-slate-400 hover:text-slate-200"
        >
          Collapse all
        </button>
        <span
          class="text-slate-500 ml-auto"
          x-text="`${safetyDecomposition.roots.length} top-level · ${safetyStatusSummary.total} requirements`"
        ></span>
      </div>
      <div class="rounded-xl border border-slate-700/60 bg-slate-800/40 p-2">
        <template x-for="row in safetyTreeRows" :key="row.id">
          <div
            x-data="{ status: null }"
            x-effect="status = requirementSafetyStatus(row.el)"
            class="flex items-center gap-2 py-1.5 pr-2 rounded-lg hover:bg-slate-800/70"
            :style="`padding-left:${row.depth * 22 + 4}px`"
          >
            <!-- Collapse/expand caret (parents only) -->
            <button
              type="button"
              x-show="row.hasChildren"
              @click="toggleReqCollapse(row.id)"
              class="text-slate-500 hover:text-slate-300 flex-shrink-0"
              :title="row.collapsed ? 'Expand' : 'Collapse'"
            >
              <svg
                class="w-3.5 h-3.5 transition-transform"
                :class="!row.collapsed && 'rotate-90'"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M9 5l7 7-7 7"
                />
              </svg>
            </button>
            <span x-show="!row.hasChildren" class="w-3.5 flex-shrink-0" aria-hidden="true"></span>
            <span
              class="w-6 h-6 rounded bg-yellow-500/15 flex items-center justify-center flex-shrink-0"
            >
              <span
                class="flex items-center justify-center text-yellow-400"
                x-html="elementIcon(row.el, 'w-3.5 h-3.5')"
              ></span>
            </span>
            <button
              type="button"
              @click="navigateTo(row.id)"
              class="text-sm text-slate-200 hover:text-white text-left truncate min-w-0"
              x-text="row.el?.name || cleanName(row.id)"
            ></button>
            <!-- Compact verification status, kept at the row's right edge. -->
            <span
              x-show="status"
              class="w-6 h-6 rounded-full inline-flex items-center justify-center flex-shrink-0"
              :class="status?.badgeClass"
              :title="status?.label"
              :aria-label="status?.label"
              x-html="uiIconSvg(status?.iconKey, 'w-4 h-4')"
            ></span>
            <span
              x-show="row.hasChildren"
              class="text-[10px] text-slate-500 flex-shrink-0 tabular-nums"
              :title="`${row.childCount} direct child requirement(s)`"
              x-text="row.childCount"
            ></span>
          </div>
        </template>
      </div>
    </div>
  </template>

  <!-- Coverage matrix: requirement -> implementation -> verification -> evidence -->
  <template x-if="requirementLayout === 'coverage'">
    <div class="space-y-3">
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-2">
        <div class="rounded-lg border border-slate-700/60 bg-slate-800/40 p-3">
          <div class="text-[10px] uppercase tracking-wider text-slate-500">Complete</div>
          <div
            class="text-lg font-semibold text-white tabular-nums"
            x-text="formatCount(safetyCoverageSummary.complete)"
          ></div>
        </div>
        <div class="rounded-lg border border-slate-700/60 bg-slate-800/40 p-3">
          <div class="text-[10px] uppercase tracking-wider text-slate-500">Implemented</div>
          <div
            class="text-lg font-semibold text-white tabular-nums"
            x-text="`${formatCount(safetyCoverageSummary.withImplementation)} / ${formatCount(safetyCoverageSummary.total)}`"
          ></div>
        </div>
        <div class="rounded-lg border border-slate-700/60 bg-slate-800/40 p-3">
          <div class="text-[10px] uppercase tracking-wider text-slate-500">Verified</div>
          <div
            class="text-lg font-semibold text-white tabular-nums"
            x-text="`${formatCount(safetyCoverageSummary.withVerification)} / ${formatCount(safetyCoverageSummary.total)}`"
          ></div>
        </div>
        <div class="rounded-lg border border-slate-700/60 bg-slate-800/40 p-3">
          <div class="text-[10px] uppercase tracking-wider text-slate-500">Evidenced</div>
          <div
            class="text-lg font-semibold text-white tabular-nums"
            x-text="`${formatCount(safetyCoverageSummary.withEvidence)} / ${formatCount(safetyCoverageSummary.total)}`"
          ></div>
        </div>
      </div>
      <div class="rounded-xl border border-slate-700/60 bg-slate-800/40 overflow-hidden">
        <div
          class="hidden xl:grid grid-cols-[minmax(0,1.35fr)_minmax(0,1fr)_minmax(0,1fr)_minmax(0,1fr)] gap-3 px-3 py-2 border-b border-slate-700/60 text-[10px] uppercase tracking-wider text-slate-500"
        >
          <span>Requirement</span>
          <span>Implementation</span>
          <span>Verification</span>
          <span>Evidence</span>
        </div>
        <template
          x-for="row in safetyCoverageRows.slice(0, revealLimit('safetyCoverageRows'))"
          :key="row.id"
        >
          <div
            class="grid grid-cols-1 xl:grid-cols-[minmax(0,1.35fr)_minmax(0,1fr)_minmax(0,1fr)_minmax(0,1fr)] gap-3 px-3 py-3 border-b border-slate-700/50 last:border-b-0 hover:bg-slate-800/70"
          >
            <div class="min-w-0">
              <div class="flex items-start gap-2">
                <span
                  class="mt-0.5 w-7 h-7 rounded-full inline-flex items-center justify-center flex-shrink-0"
                  :class="row.status?.badgeClass"
                  :title="row.status?.label"
                  x-html="uiIconSvg(row.status?.iconKey, 'w-4 h-4')"
                ></span>
                <div class="min-w-0">
                  <button
                    type="button"
                    @click="navigateTo(row.id)"
                    class="text-sm font-medium text-white hover:text-yellow-200 text-left break-words"
                    x-text="row.name"
                  ></button>
                  <div
                    class="mt-1 text-xs text-slate-400 line-clamp-2"
                    x-text="row.statement"
                  ></div>
                  <div class="mt-2 flex flex-wrap gap-1.5">
                    <span
                      class="badge text-xs bg-slate-700 text-slate-300 font-mono"
                      x-text="row.uid"
                    ></span>
                    <template x-for="gap in row.gapKeys" :key="row.id + gap">
                      <span
                        class="badge text-xs"
                        :class="safetyStatusMeta(gap).badgeClass"
                        x-text="safetyStatusMeta(gap).label"
                      ></span>
                    </template>
                  </div>
                </div>
              </div>
            </div>
            <div class="min-w-0">
              <div class="xl:hidden text-[10px] uppercase tracking-wider text-slate-500 mb-1">
                Implementation
              </div>
              <template x-if="row.implementations.length">
                <div class="space-y-1.5">
                  <template x-for="target in row.implementations.slice(0, 3)" :key="target.id">
                    <button
                      type="button"
                      @click="navigateTo(target.id)"
                      class="flex items-center gap-2 text-xs text-slate-300 hover:text-white min-w-0 w-full text-left"
                    >
                      <span
                        class="flex-shrink-0"
                        :style="`color: ${nodeTypeColor(target.nodeType)}`"
                        x-html="elementIcon(target.el || { spdxId: target.id }, 'w-3.5 h-3.5')"
                      ></span>
                      <span class="truncate" x-text="target.name"></span>
                    </button>
                  </template>
                  <div
                    x-show="row.implementations.length > 3"
                    class="text-[10px] text-slate-500"
                    x-text="`+${formatCount(row.implementations.length - 3)} more`"
                  ></div>
                </div>
              </template>
              <div x-show="!row.implementations.length" class="text-xs text-slate-500">
                Not allocated
              </div>
            </div>
            <div class="min-w-0">
              <div class="xl:hidden text-[10px] uppercase tracking-wider text-slate-500 mb-1">
                Verification
              </div>
              <template x-if="row.verifications.length">
                <div class="space-y-1.5">
                  <div class="flex flex-wrap gap-1.5">
                    <template x-for="method in row.methods.slice(0, 4)" :key="method">
                      <span
                        class="badge text-xs bg-slate-700 text-slate-300"
                        x-text="method"
                      ></span>
                    </template>
                  </div>
                  <template
                    x-for="verification in row.verifications.slice(0, 2)"
                    :key="verification.id"
                  >
                    <button
                      type="button"
                      @click="navigateTo(verification.id)"
                      class="flex items-center gap-2 text-xs text-slate-300 hover:text-white min-w-0 w-full text-left"
                    >
                      <span
                        x-show="verification.evaluationMeta"
                        class="w-5 h-5 rounded-full inline-flex items-center justify-center flex-shrink-0"
                        :class="verification.evaluationMeta?.badgeClass"
                        :title="verification.evaluationMeta?.label"
                        x-html="uiIconSvg(verification.evaluationMeta?.iconKey, 'w-3.5 h-3.5')"
                      ></span>
                      <span
                        x-show="!verification.evaluationMeta"
                        class="w-5 h-5 rounded-full inline-flex items-center justify-center flex-shrink-0 bg-slate-600/20 text-slate-400 ring-1 ring-slate-500/30"
                        x-html="uiIconSvg('status_verified', 'w-3.5 h-3.5')"
                      ></span>
                      <span class="truncate" x-text="verification.name"></span>
                    </button>
                  </template>
                  <div
                    x-show="row.verifications.length > 2"
                    class="text-[10px] text-slate-500"
                    x-text="`+${formatCount(row.verifications.length - 2)} more`"
                  ></div>
                </div>
              </template>
              <div x-show="!row.verifications.length" class="text-xs text-slate-500">
                No verification
              </div>
            </div>
            <div class="min-w-0">
              <div class="xl:hidden text-[10px] uppercase tracking-wider text-slate-500 mb-1">
                Evidence
              </div>
              <template x-if="row.evidence.length">
                <div class="space-y-1.5">
                  <div class="flex flex-wrap gap-1.5">
                    <template
                      x-for="category in row.evidenceCategories.slice(0, 4)"
                      :key="category"
                    >
                      <span
                        class="badge text-xs bg-slate-700 text-slate-300"
                        x-text="category"
                      ></span>
                    </template>
                  </div>
                  <template x-for="target in row.evidence.slice(0, 3)" :key="target.id">
                    <button
                      type="button"
                      @click="target.nodeType === 'snippet' ? openSnippetRanges([target.id]) : navigateTo(target.id)"
                      class="flex items-center gap-2 text-xs text-slate-300 hover:text-white min-w-0 w-full text-left"
                    >
                      <span
                        class="flex-shrink-0"
                        :style="`color: ${nodeTypeColor(target.nodeType)}`"
                        x-html="elementIcon(target.el || { spdxId: target.id }, 'w-3.5 h-3.5')"
                      ></span>
                      <span class="truncate" x-text="target.name"></span>
                    </button>
                  </template>
                  <div
                    x-show="row.evidence.length > 3"
                    class="text-[10px] text-slate-500"
                    x-text="`+${formatCount(row.evidence.length - 3)} more`"
                  ></div>
                </div>
              </template>
              <div x-show="!row.evidence.length" class="text-xs text-slate-500">No evidence</div>
            </div>
          </div>
        </template>
        <div
          x-show="safetyCoverageRows.length === 0"
          class="px-3 py-8 text-sm text-slate-500 text-center"
        >
          No requirements match the current filters.
        </div>
        <button
          type="button"
          x-show="safetyCoverageRows.length > revealLimit('safetyCoverageRows')"
          @click="revealMore('safetyCoverageRows')"
          class="w-full px-3 py-2 text-xs text-slate-400 hover:text-slate-200 border-t border-slate-700/50"
          x-text="`Show ${formatCount(Math.min(200, safetyCoverageRows.length - revealLimit('safetyCoverageRows')))} more requirements`"
        ></button>
      </div>
    </div>
  </template>

  <!-- Allocation view: requirements grouped by implementing component/file/code range -->
  <template x-if="requirementLayout === 'allocation'">
    <div class="space-y-3">
      <div class="flex items-center gap-3 text-xs">
        <span
          class="text-slate-500"
          x-text="`${formatCount(safetyAllocationGroups.length)} allocation groups`"
        ></span>
        <button
          type="button"
          @click="expandAllSafetyAllocationGroups()"
          class="text-slate-400 hover:text-slate-200"
        >
          Expand all
        </button>
        <span class="text-slate-600">·</span>
        <button
          type="button"
          @click="collapseAllSafetyAllocationGroups()"
          class="text-slate-400 hover:text-slate-200"
        >
          Collapse all
        </button>
      </div>
      <template x-for="group in safetyAllocationGroups" :key="group.key">
        <div class="rounded-xl border border-slate-700/60 bg-slate-800/40 overflow-hidden">
          <div class="px-3 py-3 border-b border-slate-700/60">
            <div class="flex items-start gap-3">
              <span
                class="w-8 h-8 rounded-lg bg-slate-900/60 flex items-center justify-center flex-shrink-0"
                :style="group.nodeType ? `color: ${nodeTypeColor(group.nodeType)}` : ''"
                x-html="group.id ? elementIcon(elementMap.get(group.id) || { spdxId: group.id }, 'w-4 h-4') : uiIconSvg('status_unverified', 'w-4 h-4')"
              ></span>
              <div class="min-w-0 flex-1">
                <button
                  type="button"
                  x-show="group.id"
                  @click="navigateTo(group.id)"
                  class="text-sm font-semibold text-white hover:text-yellow-200 text-left break-words"
                  x-text="group.name"
                ></button>
                <div
                  x-show="!group.id"
                  class="text-sm font-semibold text-white"
                  x-text="group.name"
                ></div>
                <div class="mt-1 flex flex-wrap items-center gap-1.5">
                  <span
                    class="badge text-xs bg-yellow-500/15 text-yellow-300"
                    x-text="`${formatCount(group.requirementCount)} requirements`"
                  ></span>
                  <span
                    x-show="group.snippetCount"
                    class="badge text-xs bg-slate-700 text-slate-300"
                    x-text="`${formatCount(group.snippetCount)} ranges`"
                  ></span>
                  <template x-for="method in group.methods.slice(0, 3)" :key="group.key + method">
                    <span class="badge text-xs bg-slate-700 text-slate-300" x-text="method"></span>
                  </template>
                  <span
                    x-show="group.noImpl"
                    class="badge text-xs"
                    :class="safetyStatusMeta('noimpl').badgeClass"
                    x-text="`${safetyStatusMeta('noimpl').label}: ${formatCount(group.noImpl)}`"
                  ></span>
                  <span
                    x-show="group.noEvidence"
                    class="badge text-xs"
                    :class="safetyStatusMeta('noevidence').badgeClass"
                    x-text="`${safetyStatusMeta('noevidence').label}: ${formatCount(group.noEvidence)}`"
                  ></span>
                </div>
              </div>
              <div class="hidden sm:flex items-center gap-1.5 flex-shrink-0">

  <template

      @click="toggleRequirement(req.spdxId)"
    >
      <div class="flex items-center gap-3">
        <div
          class="w-8 h-8 rounded-lg bg-yellow-500/15 flex items-center justify-center flex-shrink-0"

        <div class="flex-1 min-w-0">
          <div
            class="font-medium text-white text-sm break-words"
            x-text="req.name || cleanName(req.spdxId)"

          <!-- "shall" / assumption statement, one-line preview -->
          <div
            x-show="isMeaningful(req.requirementStatement || req.functionalsafety_assumptionStatement)"
            class="text-xs text-slate-400 mt-0.5 line-clamp-1"
            x-text="req.requirementStatement || req.functionalsafety_assumptionStatement"
          ></div>
          <div class="flex items-center gap-2 mt-1 flex-wrap">
            <span
              class="badge text-xs bg-yellow-500/15 text-yellow-400"

            ></span>
            <template x-for="eid in externalIdentifiers(req).slice(0, 1)" :key="eid.identifier">

                class="badge text-xs bg-slate-700 text-slate-300 font-mono"

              ></span>

              x-text="`implemented by ${implementedByCount(req.spdxId)}`"

        <span

          />

      <!-- Expanded detail (built lazily via x-if for only the open card) -->

            <div class="text-xs text-slate-500 mb-1">Summary</div>

          </div>

            <div class="text-xs text-slate-500 mb-1">Description</div>

                    </div>

                        <span
                          class="detail-rel-arrow"
                          :style="`color: ${section.group.color}`"
                          x-text="item.direction === 'out' ? '→' : '←'"
                        ></span>
                        <span
                          class="flex items-center flex-shrink-0"
                          :style="`color: ${nodeTypeColor(getNodeType(elementMap.get(item.id) || {}))}`"
                          x-html="elementIcon(elementMap.get(item.id) || { spdxId: item.id }, 'w-3.5 h-3.5')"
                        ></span>
                        <span class="flex-1 truncate" x-text="item.displayName"></span>
                        <span
                          x-show="statusMeta"
                          class="w-6 h-6 rounded-full inline-flex items-center justify-center flex-shrink-0"
                          :class="statusMeta?.badgeClass"
                          :title="statusMeta ? `Safety status: ${statusMeta.label}` : null"
                          :aria-label="statusMeta ? `Safety status: ${statusMeta.label}` : null"
                          x-html="uiIconSvg(statusMeta?.iconKey, 'w-4 h-4')"
                        ></span>
                        <svg
                          class="w-3 h-3 text-slate-600 group-hover:text-slate-400 transition-colors flex-shrink-0"
                          fill="none"
                          stroke="currentColor"
                          viewBox="0 0 24 24"
                        >
                          <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M9 5l7 7-7 7"
                          />
                        </svg>
                      </div>
                    </template>
                    <div
                      x-show="section.group.hiddenCount > 0"
                      class="text-[10px] text-slate-500 italic pl-1"
                      x-text="'+' + formatCount(section.group.hiddenCount) + ' more'"
                    ></div>
                  </div>
                </div>
              </template>
            </div>
          </template>
        </div>
      </template>
    </div>
  </template>
</div>
