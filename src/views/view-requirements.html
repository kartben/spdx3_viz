<div
  x-show="currentView === 'requirements'"
  class="fade-in space-y-3"
  :class="hasSafetySpecFacets ? 'max-w-6xl' : 'max-w-4xl'"
>
  <div class="list-sticky space-y-3">
    <div class="flex flex-col gap-2 sm:flex-row sm:flex-wrap sm:items-center sm:gap-3">
      <div class="flex items-center gap-2 min-w-0">
        <!-- Layout toggle: flat list vs. tracedToDetail decomposition tree -->
        <div
          x-show="hasSafetyDecomposition"
          class="inline-flex rounded-lg border border-slate-700 overflow-hidden text-xs flex-shrink-0"
        >
          <button
            type="button"
            @click="requirementLayout = 'list'; restreamView('requirements')"
            class="px-2.5 sm:px-3 py-1.5 transition-colors"
            :class="requirementLayout === 'list' ? 'bg-slate-700 text-white' : 'bg-slate-800 text-slate-400 hover:text-slate-200'"
          >
            List
          </button>
          <button
            type="button"
            @click="requirementLayout = 'tree'"
            class="px-2.5 sm:px-3 py-1.5 transition-colors"
            :class="requirementLayout === 'tree' ? 'bg-slate-700 text-white' : 'bg-slate-800 text-slate-400 hover:text-slate-200'"
          >
            <span class="sm:hidden">Tree</span>
            <span class="hidden sm:inline">Decomposition</span>
          </button>
        </div>
      </div>
      <div class="flex items-center gap-2 sm:ml-auto">
        <button
          x-show="requirementLayout === 'list'"
          type="button"
          @click="requirementSort = requirementSort === 'attention' ? 'name' : 'attention'; restreamView('requirements')"
          class="text-xs text-slate-400 hover:text-slate-200 transition-colors flex-shrink-0"
          :title="requirementSort === 'attention' ? 'Sorted worst first. Switch to A-Z.' : 'Sorted A-Z. Switch to worst first.'"
          x-text="requirementSort === 'attention' ? 'Most urgent first' : 'A–Z'"
        ></button>
        <input
          x-model.debounce.150ms="requirementSearch"
          @input.debounce.150ms="restreamView('requirements')"
          type="text"
          placeholder="Filter…"
          class="bg-slate-800 border border-slate-700 rounded-lg text-xs px-2.5 py-1.5 text-slate-300 placeholder-slate-500 focus:outline-none focus:border-yellow-500 w-full sm:w-44 md:w-56"
        />
      </div>
    </div>

    <!-- Two rollups, one line each. The meter runs healthy-first so its leading
         edge lands on the headline percentage; the chips stay gaps-first
         because they are what you click, and that matches the worst-first list
         below. Each chip is filled to its share, so nobody has to read a
         sub-pixel segment in a 120px meter to size a bucket. -->
    <template x-if="safetyCounts.requirements > 0 && safetyStatusOrder.length">
      <div class="flex items-center gap-3 min-w-0">
        <span
          class="text-sm font-semibold text-white flex-shrink-0"
          x-text="`${safetyStatusSummary.passPct}% pass`"
        ></span>
        <div
          class="flex h-1.5 w-[120px] rounded-full overflow-hidden bg-slate-700 flex-shrink-0"
          role="img"
          :aria-label="`${formatCount(safetyStatusSummary.counts.passed)} of ${formatCount(safetyStatusSummary.total)} requirements pass, ${safetyStatusSummary.verifiedPct}% have verification`"
          :title="`${formatCount(safetyStatusSummary.counts.passed)} of ${formatCount(safetyStatusSummary.total)} · ${safetyStatusSummary.verifiedPct}% have verification`"
        >
          <template x-for="s in safetyStatusMeterOrder" :key="s">
            <div
              :style="`width:${(safetyStatusSummary.counts[s] / safetyStatusSummary.total) * 100}%; background:${safetyStatusMeta(s).color}`"
            ></div>
          </template>
        </div>
        <div class="flex flex-wrap items-center gap-1.5 min-w-0">
          <template x-for="s in safetyStatusOrder" :key="s">
            <button
              type="button"
              @click="requirementStatusFilter = (requirementStatusFilter === s ? '' : s); restreamView('requirements')"
              class="badge relative overflow-hidden !py-1 transition"
              :class="requirementStatusFilter === s ? safetyStatusMeta(s).badgeClass + ' brightness-125' : 'bg-slate-800 text-slate-400 hover:text-slate-200'"
              :title="`Show ${safetyStatusMeta(s).label} requirements`"
            >
              <span
                class="absolute inset-y-0 left-0 opacity-30"
                :style="`width:${safetyShare(safetyStatusSummary.counts[s], safetyStatusSummary.total)}; background:${safetyStatusMeta(s).color}`"
              ></span>
              <span
                class="relative w-1.5 h-1.5 rounded-full mr-1.5"
                :class="safetyStatusMeta(s).dotClass"
              ></span>
              <span class="relative" x-text="safetyStatusMeta(s).label"></span>
              <span
                class="relative ml-1.5 font-semibold"
                x-text="formatCount(safetyStatusSummary.counts[s])"
              ></span>
            </button>
          </template>
        </div>
      </div>
    </template>

    <template x-if="safetyAdequacySummary.total > 0">
      <div class="flex items-center gap-3 min-w-0">
        <span
          class="text-sm font-semibold text-white flex-shrink-0"
          x-text="`${safetyAdequacySummary.exercisedPct}% traced`"
        ></span>
        <div
          class="flex h-1.5 w-[120px] rounded-full overflow-hidden bg-slate-700 flex-shrink-0"
          role="img"
          :aria-label="`${formatCount(safetyAdequacySummary.exercised)} of ${formatCount(safetyAdequacySummary.total)} requirements have their implementation exercised by their own tests`"
          :title="`${formatCount(safetyAdequacySummary.exercised)} of ${formatCount(safetyAdequacySummary.total)} have their implementation exercised by their own tests`"
        >
          <template x-for="a in safetyAdequacyMeterOrder" :key="a">
            <div
              :style="`width:${(safetyAdequacySummary.counts[a] / safetyAdequacySummary.total) * 100}%; background:${safetyAdequacyMeta(a).color}`"
            ></div>
          </template>
        </div>
        <div class="flex flex-wrap items-center gap-1.5 min-w-0">
          <template x-for="a in safetyAdequacyOrder" :key="a">
            <button
              type="button"
              @click="requirementAdequacyFilter = (requirementAdequacyFilter === a ? '' : a); restreamView('requirements')"
              class="badge relative overflow-hidden !py-1 transition"
              :class="requirementAdequacyFilter === a ? safetyAdequacyMeta(a).badgeClass + ' brightness-125' : 'bg-slate-800 text-slate-400 hover:text-slate-200'"
              :title="safetyAdequacyMeta(a).hint"
            >
              <span
                class="absolute inset-y-0 left-0 opacity-30"
                :style="`width:${safetyShare(safetyAdequacySummary.counts[a], safetyAdequacySummary.total)}; background:${safetyAdequacyMeta(a).color}`"
              ></span>
              <span
                class="relative w-1.5 h-1.5 rounded-full mr-1.5"
                :class="safetyAdequacyMeta(a).dotClass"
              ></span>
              <span class="relative" x-text="safetyAdequacyMeta(a).label"></span>
              <span
                class="relative ml-1.5 font-semibold"
                x-text="formatCount(safetyAdequacySummary.counts[a])"
              ></span>
            </button>
          </template>
        </div>
      </div>
    </template>
    <!-- Kind filter (list mode; only kinds actually present are offered) -->
    <div x-show="requirementLayout === 'list'" class="flex flex-wrap items-center gap-1.5 !mt-6">
      <template
        x-for="chip in [
                  { key: '', label: 'All' },
                  { key: 'Requirement', label: 'Requirements', n: safetyCounts.requirements },
                  { key: 'functionalsafety_RequirementVerification', label: 'Verifications', n: safetyCounts.verifications },
                  { key: 'functionalsafety_EvaluationResult', label: 'Evaluations', n: safetyCounts.evaluations },
                  { key: 'functionalsafety_Assumption', label: 'Assumptions', n: safetyCounts.assumptions }
                ].filter(c => c.key === '' || c.n > 0)"
        :key="chip.key"
      >
        <button
          type="button"
          @click="requirementKindFilter = chip.key; restreamView('requirements')"
          class="px-2.5 py-1 rounded-full text-xs border transition-colors"
          :class="requirementKindFilter === chip.key
                    ? 'bg-yellow-500/15 text-yellow-300 border-yellow-500/40'
                    : 'bg-slate-800 text-slate-400 border-slate-700 hover:text-slate-200'"
        >
          <span x-text="chip.label"></span>
          <span x-show="chip.n !== undefined" class="text-slate-500" x-text="`(${chip.n})`"></span>
        </button>
      </template>
    </div>
  </div>

  <div class="flex gap-4 items-start" :class="hasSafetySpecFacets && 'md:gap-5'">
    <!-- Specification filter from Specification + hasRequirement -->
    <aside
      x-show="hasSafetySpecFacets"
      class="hidden md:block w-44 flex-shrink-0 sticky top-[var(--list-sticky-offset,7rem)] max-h-[calc(100vh-9rem)] overflow-y-auto"
    >
      <div class="text-[10px] text-slate-500 uppercase tracking-wider px-2 mb-1.5">
        Specifications
      </div>
      <button
        type="button"
        @click="requirementSpecFilter = ''; restreamView('requirements')"
        class="w-full flex items-center justify-between gap-2 text-left text-xs px-2 py-1.5 rounded-lg transition-colors"
        :class="!requirementSpecFilter ? 'bg-slate-800 text-white' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/60'"
      >
        <span>All</span>
        <span
          class="text-slate-500 tabular-nums"
          x-text="formatCount(safetyCounts.requirements)"
        ></span>
      </button>
      <template x-for="facet in safetySpecFacets" :key="facet.id">
        <button
          type="button"
          @click="requirementSpecFilter = (requirementSpecFilter === facet.id ? '' : facet.id); restreamView('requirements')"
          class="w-full flex items-center justify-between gap-2 text-left text-xs px-2 py-1.5 rounded-lg transition-colors"
          :class="requirementSpecFilter === facet.id ? 'bg-slate-800 text-white ring-1 ring-yellow-500/30' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/60'"
          :title="facet.name"
        >
          <span class="truncate" x-text="facet.label"></span>
          <span
            class="text-slate-500 tabular-nums flex-shrink-0"
            x-text="formatCount(facet.count)"
          ></span>
        </button>
      </template>
    </aside>

    <div class="flex-1 min-w-0 space-y-3">
      <!-- Mobile specification select (rail is md+) -->
      <div x-show="hasSafetySpecFacets" class="md:hidden">
        <select
          class="w-full bg-slate-800 border border-slate-700 rounded-lg text-xs px-2.5 py-2 text-slate-300 focus:outline-none focus:border-yellow-500"
          :value="requirementSpecFilter"
          @change="requirementSpecFilter = $event.target.value; restreamView('requirements')"
        >
          <option value="">All specifications</option>
          <template x-for="facet in safetySpecFacets" :key="facet.id">
            <option
              :value="facet.id"
              x-text="`${facet.label} (${facet.count})`"
              :selected="requirementSpecFilter === facet.id"
            ></option>
          </template>
        </select>
      </div>

      <!-- Requirement decomposition tree (tracedToDetail hierarchy) -->
      <template x-if="requirementLayout === 'tree'">
        <div class="space-y-2">
          <div class="flex items-center gap-3 text-xs">
            <button
              type="button"
              @click="expandAllReqs()"
              class="text-slate-400 hover:text-slate-200"
            >
              Expand all
            </button>
            <span class="text-slate-600">·</span>
            <button
              type="button"
              @click="collapseAllReqs()"
              class="text-slate-400 hover:text-slate-200"
            >
              Collapse all
            </button>
            <span
              class="text-slate-500 ml-auto tabular-nums"
              x-text="`${safetyTreeRows.filter(r => r.depth === 0).length} top-level`"
            ></span>
          </div>
          <div x-show="safetyTreeRows.length === 0" class="card text-center py-10">
            <div class="text-sm font-medium text-slate-300">
              No requirements match these filters
            </div>
            <button
              type="button"
              @click="requirementSearch = ''; requirementStatusFilter = ''; requirementSpecFilter = ''"
              class="mt-3 rounded-md bg-slate-800 px-3 py-1.5 text-xs text-slate-300 hover:bg-slate-700 hover:text-white transition-colors"
            >
              Clear filters
            </button>
          </div>
          <div
            x-show="safetyTreeRows.length > 0"
            class="rounded-xl border border-slate-700/60 bg-slate-800/40 p-2 overflow-x-auto"
          >
            <template x-for="row in safetyTreeRows" :key="row.id">
              <div
                x-data="{ status: null }"
                x-effect="status = requirementRowStatus(row.el)"
                class="flex items-center gap-2 py-1.5 pr-2 rounded-lg hover:bg-slate-800/70 min-w-0"
                :style="`padding-left:${Math.min(row.depth, 6) * 14 + 4}px`"
              >
                <button
                  type="button"
                  x-show="row.hasChildren"
                  @click="toggleReqCollapse(row.id)"
                  class="text-slate-500 hover:text-slate-300 flex-shrink-0"
                  :title="row.collapsed ? 'Expand' : 'Collapse'"
                >
                  <svg
                    class="w-3.5 h-3.5 transition-transform"
                    :class="!row.collapsed && 'rotate-90'"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M9 5l7 7-7 7"
                    />
                  </svg>
                </button>
                <span
                  x-show="!row.hasChildren"
                  class="w-3.5 flex-shrink-0"
                  aria-hidden="true"
                ></span>
                <button
                  type="button"
                  @click="navigateTo(row.id)"
                  class="text-sm text-slate-200 hover:text-white text-left truncate min-w-0 flex-1"
                  x-text="requirementDisplayName(row.el)"
                ></button>
                <span
                  x-show="row.cue && !row.hasChildren"
                  class="text-[10px] text-slate-500 flex-shrink-0 hidden sm:inline"
                  :class="row.cue === 'no implementation' && 'text-orange-400/90'"
                  x-text="row.cue"
                ></span>
                <span
                  x-show="status"
                  class="w-6 h-6 rounded-full inline-flex items-center justify-center flex-shrink-0"
                  :class="status?.badgeClass"
                  :title="status?.title || status?.label"
                  :aria-label="status?.title || status?.label"
                  x-html="uiIconSvg(status?.iconKey, 'w-4 h-4')"
                ></span>
                <span
                  x-show="row.hasChildren"
                  class="text-[10px] text-slate-500 flex-shrink-0 tabular-nums"
                  :title="`${row.childCount} direct child requirement(s)`"
                  x-text="row.childCount"
                ></span>
              </div>
            </template>
          </div>
        </div>
      </template>

      <template x-if="requirementLayout === 'list'">
        <div class="space-y-3">
          <div
            x-show="mountedViews.requirements && filteredRequirements.length === 0"
            class="card text-center py-10"
          >
            <div class="text-sm font-medium text-slate-300">
              No requirements match these filters
            </div>
            <button
              type="button"
              @click="requirementSearch = ''; requirementKindFilter = 'Requirement'; requirementStatusFilter = ''; requirementAdequacyFilter = ''; requirementSpecFilter = ''; restreamView('requirements')"
              class="mt-3 rounded-md bg-slate-800 px-3 py-1.5 text-xs text-slate-300 hover:bg-slate-700 hover:text-white transition-colors"
            >
              Clear filters
            </button>
          </div>

          <template
            x-for="req in (mountedViews.requirements ? renderSlice('requirements', filteredRequirements) : [])"
            :key="req.spdxId"
          >
            <div
              x-data="{ statusMeta: null, cue: '' }"
              x-effect="statusMeta = safetyArtifactStatus(req); cue = requirementQuietCue(req)"
              class="card cursor-pointer"
              data-nav-kind="requirement"
              :data-nav-id="req.spdxId"
              :class="isNavTarget('requirement', req.spdxId) && 'target-focus'"
              @click="toggleRequirement(req.spdxId)"
            >
              <div class="flex items-center gap-3">
                <div
                  class="w-8 h-8 rounded-lg bg-yellow-500/15 flex items-center justify-center flex-shrink-0"
                >
                  <span
                    class="flex items-center justify-center text-yellow-400"
                    x-html="elementIcon(req, 'w-4 h-4')"
                  ></span>
                </div>
                <div class="flex-1 min-w-0">
                  <div
                    class="font-medium text-white text-sm break-words"
                    x-text="requirementDisplayName(req)"
                  ></div>
                  <div
                    x-show="isMeaningful(req.requirementStatement || req.functionalsafety_assumptionStatement)"
                    class="text-xs text-slate-400 mt-0.5 line-clamp-1"
                    x-text="req.requirementStatement || req.functionalsafety_assumptionStatement"
                  ></div>
                  <div class="flex items-center gap-2 mt-1 flex-wrap">
                    <span
                      class="badge text-xs bg-yellow-500/15 text-yellow-400"
                      x-text="safetyArtifactKind(req)"
                    ></span>
                    <span
                      x-show="cue"
                      class="text-[10px] text-slate-500"
                      :class="cue === 'no implementation' && 'text-orange-400/90'"
                      x-text="cue"
                    ></span>
                  </div>
                </div>
                <span
                  x-show="statusMeta"
                  class="w-8 h-8 rounded-full inline-flex items-center justify-center flex-shrink-0"
                  :class="statusMeta?.badgeClass"
                  :title="statusMeta?.title || statusMeta?.label"
                  :aria-label="statusMeta?.title || statusMeta?.label"
                  x-html="uiIconSvg(statusMeta?.iconKey, 'w-5 h-5')"
                ></span>
                <svg
                  class="w-4 h-4 text-slate-500 transition-transform flex-shrink-0"
                  :class="expandedRequirement === req.spdxId && 'rotate-180'"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M19 9l-7 7-7-7"
                  />
                </svg>
              </div>
              <template x-if="expandedRequirement === req.spdxId">
                <div
                  class="mt-4 pt-4 border-t border-slate-700 space-y-3 sm:pl-11 fade-in"
                  @click.stop
                >
                  <div
                    x-show="isMeaningful(req.requirementStatement || req.functionalsafety_assumptionStatement)"
                  >
                    <div class="text-[10px] text-slate-500 uppercase tracking-wider mb-1">
                      <span
                        x-text="req.type === 'Requirement' ? 'Requirement' : 'Statement'"
                      ></span>
                    </div>
                    <div
                      class="text-sm text-slate-200 whitespace-pre-wrap break-words leading-relaxed"
                      x-text="req.requirementStatement || req.functionalsafety_assumptionStatement"
                    ></div>
                  </div>

                  <div
                    x-show="requirementSummaryLine(req)"
                    class="text-xs text-slate-400"
                    x-text="requirementSummaryLine(req)"
                  ></div>

                  <div
                    x-show="isMeaningful(req.summary) && req.summary !== req.name && req.summary !== requirementDisplayName(req)"
                  >
                    <div class="text-xs text-slate-500 mb-1">Summary</div>
                    <div
                      class="text-xs text-slate-300 whitespace-pre-wrap break-words"
                      x-text="req.summary"
                    ></div>
                  </div>

                  <div x-show="isMeaningful(req.description) && req.description !== req.summary">
                    <div class="text-xs text-slate-500 mb-1">Description</div>
                    <div
                      class="text-xs text-slate-300 whitespace-pre-wrap break-words max-h-32 overflow-y-auto"
                      x-text="req.description"
                    ></div>
                  </div>

                  <div x-show="isMeaningful(req.comment)">
                    <div class="text-xs text-slate-500 mb-1">Note</div>
                    <div
                      class="text-xs text-slate-300 whitespace-pre-wrap break-words bg-slate-900/50 rounded px-2 py-1.5"
                      x-text="req.comment"
                    ></div>
                  </div>

                  <div
                    x-show="safetyFields(req).length > 0"
                    class="grid grid-cols-2 gap-x-4 gap-y-2"
                  >
                    <template x-for="field in safetyFields(req)" :key="field.label">
                      <div>
                        <div
                          class="text-[10px] text-slate-500 uppercase tracking-wider mb-0.5"
                          x-text="field.label"
                        ></div>
                        <span
                          class="text-xs text-slate-300 break-words"
                          :class="field.mono && 'font-mono break-all'"
                          x-text="field.value"
                        ></span>
                      </div>
                    </template>
                  </div>

                  <!-- Linked evidence (hasEvidence via evaluations) -->
                  <template x-if="requirementEvidence(req).total > 0">
                    <div>
                      <div
                        class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2"
                      >
                        Linked evidence
                      </div>
                      <div class="space-y-1">
                        <template x-for="item in requirementEvidence(req).items" :key="item.id">
                          <button
                            type="button"
                            @click.stop="navigateTo(item.id)"
                            class="block w-full text-left text-xs font-mono text-slate-300 hover:text-white truncate"
                            x-text="item.name"
                          ></button>
                        </template>
                        <div
                          x-show="requirementEvidence(req).hiddenCount > 0"
                          class="text-[10px] text-slate-500 italic"
                          x-text="'+' + formatCount(requirementEvidence(req).hiddenCount) + ' more'"
                        ></div>
                      </div>
                    </div>
                  </template>

                  <div x-show="externalIdentifiers(req).length > 0">
                    <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">
                      Identifiers
                    </div>
                    <div class="space-y-1.5">
                      <template
                        x-for="eid in externalIdentifiers(req)"
                        :key="eid.type + eid.identifier"
                      >
                        <div class="flex items-start gap-2 group">
                          <span
                            class="text-[10px] text-slate-500 uppercase tracking-wider w-20 pt-0.5 flex-shrink-0 text-right"
                            x-text="eid.label"
                          ></span>
                          <code
                            class="hash-text text-slate-300 break-all flex-1 leading-relaxed"
                            x-text="eid.identifier"
                          ></code>
                          <button
                            @click.stop="copyHash(eid.identifier)"
                            class="opacity-0 group-hover:opacity-100 text-slate-500 hover:text-white transition-opacity flex-shrink-0 pt-0.5"
                            title="Copy"
                          >
                            <svg
                              class="w-3 h-3"
                              fill="none"
                              stroke="currentColor"
                              viewBox="0 0 24 24"
                            >
                              <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"
                              />
                            </svg>
                          </button>
                        </div>
                      </template>
                    </div>
                  </div>

                  <template x-for="section in requirementDetailSequence(req)" :key="section.key">
                    <div>
                      <template x-if="section.kind === 'verification'">
                        <div class="space-y-2">
                          <div
                            class="text-xs font-semibold text-slate-400 uppercase tracking-wider"
                          >
                            Verification &amp; evaluation
                          </div>
                          <template x-for="v in requirementVerifications(req)" :key="v.id">
                            <div
                              x-data="{ evaluationMeta: null }"
                              x-effect="evaluationMeta = evaluationResultMeta(v.evaluation)"
                              class="rounded-lg bg-slate-900/40 border border-slate-700/50 p-3 space-y-2"
                            >
                              <div class="flex items-center gap-2 flex-wrap">
                                <button
                                  @click.stop="navigateTo(v.id)"
                                  class="text-xs font-medium text-yellow-300 hover:underline text-left break-words"
                                  x-text="v.verification.name || cleanName(v.id)"
                                ></button>
                                <template
                                  x-for="m in (v.verification.functionalsafety_verificationMethod || [])"
                                  :key="m"
                                >
                                  <span
                                    class="badge text-xs bg-slate-700 text-slate-300"
                                    x-text="enumLabel(m)"
                                  ></span>
                                </template>
                                <span
                                  x-show="evaluationMeta"
                                  class="ml-auto w-7 h-7 rounded-full inline-flex items-center justify-center flex-shrink-0"
                                  :class="evaluationMeta?.badgeClass"
                                  :title="evaluationMeta?.label"
                                  :aria-label="evaluationMeta?.label"
                                  x-html="uiIconSvg(evaluationMeta?.iconKey, 'w-4 h-4')"
                                ></span>
                              </div>
                              <div
                                x-show="isMeaningful(v.verification.functionalsafety_verificationPrecondition)"
                              >
                                <span class="text-[10px] text-slate-500 uppercase tracking-wider"
                                  >Precondition</span
                                >
                                <div
                                  class="text-xs text-slate-300 break-words"
                                  x-text="[].concat(v.verification.functionalsafety_verificationPrecondition || []).join('; ')"
                                ></div>
                              </div>
                              <div
                                x-show="isMeaningful(v.verification.functionalsafety_verificationPostcondition)"
                              >
                                <span class="text-[10px] text-slate-500 uppercase tracking-wider"
                                  >Postcondition</span
                                >
                                <div
                                  class="text-xs text-slate-300 break-words"
                                  x-text="[].concat(v.verification.functionalsafety_verificationPostcondition || []).join('; ')"
                                ></div>
                              </div>
                              <div
                                x-show="v.evaluation && isMeaningful(v.evaluation.rationale || v.evaluation.functionalsafety_rationale || v.evaluation.functionalsafety_evaluationRationale)"
                              >
                                <span class="text-[10px] text-slate-500 uppercase tracking-wider"
                                  >Evaluation rationale</span
                                >
                                <div
                                  class="text-xs text-slate-300 break-words"
                                  x-text="v.evaluation.rationale || v.evaluation.functionalsafety_rationale || v.evaluation.functionalsafety_evaluationRationale"
                                ></div>
                              </div>
                            </div>
                          </template>
                        </div>
                      </template>
                      <template x-if="section.kind === 'rel'">
                        <div class="detail-rel-section">
                          <div class="flex items-center gap-2 mb-2">
                            <span
                              class="detail-rel-line"
                              :style="`background: ${section.group.color}`"
                            ></span>
                            <span
                              class="text-xs font-semibold uppercase tracking-wider"
                              :style="`color: ${section.group.color}`"
                              x-text="section.group.label"
                            ></span>
                            <span
                              class="text-[10px] text-slate-500"
                              x-text="'(' + section.group.total + ')'"
                            ></span>
                          </div>
                          <div class="space-y-1 ml-3">
                            <template x-for="item in section.group.items" :key="item.id">
                              <div
                                x-data="{ statusMeta: null }"
                                x-effect="statusMeta = safetyArtifactStatus(elementMap.get(item.id))"
                                class="detail-rel-item group"
                                @click.stop="item.multiRange ? openSnippetRanges(item.snippetIds) : navigateTo(item.id)"
                              >
                                <span
                                  class="detail-rel-arrow flex items-center flex-shrink-0"
                                  :style="`color: ${section.group.color}`"
                                  :aria-label="item.direction === 'out' ? 'Outgoing' : 'Incoming'"
                                >
                                  <svg
                                    class="w-3 h-3"
                                    :class="item.direction === 'in' && 'rotate-180'"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                    aria-hidden="true"
                                  >
                                    <path
                                      stroke-linecap="round"
                                      stroke-linejoin="round"
                                      stroke-width="2"
                                      d="M14 5l7 7-7 7"
                                    />
                                  </svg>
                                </span>
                                <span
                                  class="flex items-center flex-shrink-0"
                                  :style="`color: ${nodeTypeColor(getNodeType(elementMap.get(item.id) || {}))}`"
                                  x-html="elementIcon(elementMap.get(item.id) || { spdxId: item.id }, 'w-3.5 h-3.5')"
                                ></span>
                                <span class="flex-1 truncate" x-text="item.displayName"></span>
                                <span
                                  x-show="statusMeta"
                                  class="w-6 h-6 rounded-full inline-flex items-center justify-center flex-shrink-0"
                                  :class="statusMeta?.badgeClass"
                                  :title="statusMeta ? `Safety status: ${statusMeta.label}` : null"
                                  :aria-label="statusMeta ? `Safety status: ${statusMeta.label}` : null"
                                  x-html="uiIconSvg(statusMeta?.iconKey, 'w-4 h-4')"
                                ></span>
                                <svg
                                  class="w-3 h-3 text-slate-600 group-hover:text-slate-400 transition-colors flex-shrink-0"
                                  fill="none"
                                  stroke="currentColor"
                                  viewBox="0 0 24 24"
                                >
                                  <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M9 5l7 7-7 7"
                                  />
                                </svg>
                              </div>
                            </template>
                            <div
                              x-show="section.group.hiddenCount > 0"
                              class="text-[10px] text-slate-500 italic pl-1"
                              x-text="'+' + formatCount(section.group.hiddenCount) + ' more'"
                            ></div>
                          </div>
                        </div>
                      </template>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </template>
        </div>
      </template>
    </div>
  </div>
</div>
