<aside
  class="fixed inset-y-0 left-0 z-50 w-60 bg-slate-800/50 border-r border-slate-700/50 flex flex-col shrink-0 transition-transform duration-200 md:static md:z-auto md:translate-x-0"
  :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'"
>
  <div class="p-4 border-b border-slate-700/50 shrink-0">
    <div
      class="flex items-center gap-2.5 cursor-pointer"
      role="button"
      tabindex="0"
      title="Go to home"
      @click="goHome()"
      @keydown.enter="goHome()"
      @keydown.space.prevent="goHome()"
    >
      <div
        class="w-8 h-8 rounded-lg bg-linear-to-br from-blue-500 to-purple-600 flex items-center justify-center shrink-0"
      >
        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
          />
        </svg>
      </div>
      <div class="min-w-0">
        <div class="text-sm font-semibold text-white truncate">SPDX 3 Visualizer</div>
        <div class="text-xs text-slate-400">SPDX 3.0 &amp; 3.1</div>
      </div>
    </div>
  </div>

  <nav class="flex-1 min-h-0 flex flex-col">
    <div class="flex-1 min-h-0 overflow-y-auto px-2 pt-2 pb-2 space-y-0.5">
      <span class="nav-section-label">Explore</span>
      <template x-for="v in exploreNavViews" :key="'explore-' + v.id">
        <div class="nav-item" :class="{ 'active': currentView === v.id }" @click="switchView(v.id)">
          <span x-html="v.icon" class="nav-icon"></span>
          <span x-text="v.label" class="flex-1"></span>
        </div>
      </template>

      <div x-show="visibleNavProfiles.length">
        <span class="nav-section-label">Profiles</span>
        <template x-for="p in visibleNavProfiles" :key="'profile-' + p.id">
          <div>
            <!-- Multi-view profile: collapsible header + nested leaves -->
            <div x-show="isNavProfileCollapsible(p)">
              <button
                type="button"
                class="nav-profile-head"
                :aria-expanded="isNavProfileExpanded(p.id)"
                @click="toggleNavProfile(p.id)"
              >
                <span x-html="p.icon" class="nav-icon"></span>
                <span x-text="p.label" class="flex-1 text-left"></span>
                <span
                  x-show="navProfileCount(p)"
                  x-text="navProfileCount(p)"
                  class="nav-profile-count"
                ></span>
                <span
                  x-html="navChevronIcon"
                  class="nav-chevron"
                  :class="{ 'collapsed': !isNavProfileExpanded(p.id) }"
                ></span>
              </button>
              <div x-show="isNavProfileExpanded(p.id)" x-collapse>
                <template
                  x-for="vid in availableNavProfileViews(p)"
                  :key="'leaf-' + p.id + '-' + vid"
                >
                  <div
                    class="nav-item nav-child"
                    :class="{ 'active': currentView === vid }"
                    @click="switchView(vid)"
                  >
                    <span x-html="viewById(vid)?.icon" class="nav-icon"></span>
                    <span x-text="viewById(vid)?.label" class="flex-1"></span>
                    <span
                      x-show="viewById(vid)?.count"
                      x-text="viewById(vid)?.count"
                      class="text-[10px] bg-slate-700/60 px-1.5 py-0.5 rounded-sm text-slate-400"
                    ></span>
                  </div>
                </template>
              </div>
            </div>
            <!-- Single available leaf (dedicated profile, or only one sibling present) -->
            <div
              class="nav-item"
              x-show="!isNavProfileCollapsible(p) && availableNavProfileViews(p).length === 1"
              :class="{ 'active': currentView === availableNavProfileViews(p)[0] }"
              @click="switchView(availableNavProfileViews(p)[0])"
            >
              <span x-html="p.icon" class="nav-icon"></span>
              <span
                class="flex-1"
                x-text="
                  p.viewIds.length === 1
                    ? p.label
                    : viewById(availableNavProfileViews(p)[0])?.label || p.label
                "
              ></span>
              <span
                x-show="viewById(availableNavProfileViews(p)[0])?.count"
                x-text="viewById(availableNavProfileViews(p)[0])?.count"
                class="text-[10px] bg-slate-700/60 px-1.5 py-0.5 rounded-sm text-slate-400"
                :class="availableNavProfileViews(p)[0] === 'security' && 'bg-rose-500/15 text-rose-300'"
              ></span>
            </div>
          </div>
        </template>
      </div>
    </div>

    <div class="nav-insights shrink-0 px-2 pb-2">
      <span class="nav-section-label">Insights</span>
      <template x-for="v in insightsNavViews" :key="'insights-' + v.id">
        <div
          class="nav-item"
          x-show="isViewAvailable(v.id)"
          :class="{ 'active': currentView === v.id }"
          @click="switchView(v.id)"
        >
          <span x-html="v.icon" class="nav-icon"></span>
          <span x-text="v.label" class="flex-1"></span>
          <span
            x-show="v.count"
            x-text="v.count"
            class="text-[10px] bg-slate-700/60 px-1.5 py-0.5 rounded-sm text-slate-400"
          ></span>
        </div>
      </template>
    </div>
  </nav>

  <div class="px-4 py-3 border-t border-slate-700/50 shrink-0">
    <a
      href="https://github.com/kartben"
      target="_blank"
      rel="author noopener noreferrer"
      class="block text-[11px] text-slate-500 hover:text-slate-300 transition-colors truncate focus-visible:outline-hidden focus-visible:ring-2 focus-visible:ring-blue-500 rounded-sm"
      title="Created by Benjamin Cabé"
    >
      By Benjamin Cabé
    </a>
    <div class="mt-1.5 flex items-center justify-between gap-2">
      <span class="text-[11px] text-slate-500" x-text="'v' + appVersion"></span>
      <button
        type="button"
        @click="openChangelogModal()"
        class="text-[11px] text-slate-500 hover:text-slate-300 underline decoration-slate-700 hover:decoration-slate-500 transition-colors"
      >
        What's new
      </button>
    </div>
  </div>
</aside>
