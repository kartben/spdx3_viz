<div
  x-show="parsing"
  x-transition.opacity
  class="fixed inset-0 z-[60] flex items-center justify-center bg-slate-900/70 backdrop-blur-sm"
>
  <div
    class="w-80 max-w-[90vw] bg-slate-800 border border-slate-700 rounded-xl px-5 py-4 shadow-2xl"
  >
    <div class="flex items-center gap-2.5 mb-3">
      <svg class="w-5 h-5 text-blue-400 animate-spin flex-shrink-0" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
        <path
          class="opacity-75"
          fill="currentColor"
          d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
        />
      </svg>
      <span class="text-sm text-slate-200" x-text="progressPhase || 'Parsing SBOM…'"></span>
      <span
        class="ml-auto text-xs font-medium text-slate-400 tabular-nums"
        x-text="Math.round(progress * 100) + '%'"
      ></span>
    </div>
    <div class="h-2 w-full bg-slate-700 rounded-full overflow-hidden">
      <!-- Fill uses transform: scaleX (not width) so its transition runs on the
           compositor and keeps advancing even while the main thread is blocked
           in a synchronous parse phase; progressAnimateMs widens the transition
           to roughly the phase duration so the bar sweeps rather than jumps. -->
      <div
        class="h-full w-full bg-blue-500 rounded-full origin-left relative overflow-hidden"
        :style="`transform: scaleX(${Math.max(0.02, progress)}); transition: transform ${progressAnimateMs}ms linear`"
      >
        <div
          class="progress-sheen absolute inset-y-0 w-1/3 bg-gradient-to-r from-transparent via-white/40 to-transparent"
        ></div>
      </div>
    </div>
    <div class="mt-2 text-xs text-slate-400 h-4">
      <span
        x-show="progressEta != null"
        x-text="progressEta >= 1 ? `about ${Math.ceil(progressEta)}s remaining` : 'almost done…'"
      ></span>
    </div>
  </div>
</div>
