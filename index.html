<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPDX 3 SBOM Visualizer</title>
    <meta
      name="description"
      content="Explore SPDX 3 SBOMs as an interactive graph: packages, source files, hardware, requirements, builds, tools and licenses, and every link between them. Runs entirely in your browser."
    />

    <!-- Open Graph / Facebook / LinkedIn / Slack -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SPDX 3 SBOM Visualizer" />
    <meta property="og:url" content="https://kartben.github.io/spdx3_viz/" />
    <meta property="og:title" content="SPDX 3 SBOM Visualizer" />
    <meta
      property="og:description"
      content="Explore SPDX 3 SBOMs as an interactive graph. Packages, source files, builds, tools, licenses... and every link between them."
    />
    <meta property="og:image" content="https://kartben.github.io/spdx3_viz/social.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta
      property="og:image:alt"
      content="SPDX3 Visualization Tool: an interactive force-directed graph of an SPDX 3 SBOM"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SPDX 3 SBOM Visualizer" />
    <meta
      name="twitter:description"
      content="Explore SPDX 3 SBOMs as an interactive graph. Packages, source files, builds, tools, licenses... and every link between them."
    />
    <meta name="twitter:image" content="https://kartben.github.io/spdx3_viz/social.png" />
    <meta
      name="twitter:image:alt"
      content="SPDX3 Visualization Tool: an interactive force-directed graph of an SPDX 3 SBOM"
    />

    <!-- Bundled by Vite: styles, d3, Alpine, and the app -->
    <script type="module" src="/src/main.js"></script>
  </head>

  <body class="bg-slate-900 text-slate-200 h-screen-dvh overflow-hidden" x-data="spdxApp()" x-cloak>
    <!-- FILE DROP ZONE (shown before data loaded) -->
    <include src="src/views/landing.html"></include>

    <!-- MAIN APP (shown after data loaded) -->
    <div x-show="dataLoaded" class="flex h-screen-dvh">
      <!-- SIDEBAR BACKDROP (mobile only, when drawer is open) -->
      <div
        x-show="sidebarOpen"
        @click="sidebarOpen = false"
        x-transition:enter="transition-opacity ease-out duration-200"
        x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100"
        x-transition:leave="transition-opacity ease-in duration-150"
        x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0"
        class="fixed inset-0 z-40 bg-slate-900/60 backdrop-blur-sm md:hidden"
      ></div>
      <!-- SIDEBAR -->
      <include src="src/views/sidebar.html"></include>

      <!-- MAIN CONTENT -->
      <div class="flex-1 flex flex-col min-w-0">
        <!-- HEADER -->
        <include src="src/views/header.html"></include>

        <!-- VIEW CONTENT -->
        <main class="flex-1 overflow-y-auto p-4 sm:p-6 relative" id="mainContent">
          <!-- Chunked-render progress strip for streamed lists -->
          <div
            x-show="viewRender.active && viewRender.view === currentView"
            class="sticky top-0 z-30 -mx-4 sm:-mx-6 -mt-4 sm:-mt-6 mb-4 px-4 sm:px-6 py-2.5 bg-slate-900/90 backdrop-blur border-b border-slate-700/50"
          >
            <div class="flex items-center gap-3 max-w-4xl">
              <svg
                class="w-4 h-4 text-blue-400 animate-spin flex-shrink-0"
                fill="none"
                viewBox="0 0 24 24"
              >
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"
                />
                <path
                  class="opacity-75"
                  fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
                />
              </svg>
              <span class="text-xs text-slate-300 flex-shrink-0 tabular-nums">
                Rendering
                <span
                  x-text="`${formatCount(viewRender.done)} of ${formatCount(viewRender.total)}`"
                ></span
                >…
              </span>
              <div class="flex-1 h-1.5 bg-slate-700 rounded-full overflow-hidden max-w-xs">
                <div
                  class="h-full bg-blue-500 rounded-full transition-[width] duration-150 ease-out"
                  :style="`width:${viewRender.total ? Math.max(2, Math.round((viewRender.done / viewRender.total) * 100)) : 0}%`"
                ></div>
              </div>
            </div>
          </div>
          <!-- DASHBOARD -->
          <include src="src/views/view-dashboard.html"></include>

          <!-- GRAPH VIEW -->
          <!-- absolute inset-0 (not a % height) so the canvas reliably fills <main> across browsers -->
          <include src="src/views/view-graph.html"></include>

          <!-- PACKAGES / AI MODELS / DATASETS (shared list template) -->
          <include src="src/views/view-packages.html"></include>

          <!-- FILES -->
          <include src="src/views/view-files.html"></include>

          <!-- HARDWARE -->
          <include src="src/views/view-hardware.html"></include>

          <!-- FUNCTIONAL SAFETY -->
          <include src="src/views/view-requirements.html"></include>

          <!-- LICENSES -->
          <include src="src/views/view-licenses.html"></include>

          <!-- SECURITY / VEX -->
          <include src="src/views/view-security.html"></include>

          <!-- BUILD CONFIGS -->
          <include src="src/views/view-configs.html"></include>

          <!-- BUILD INFO -->
          <include src="src/views/view-build.html"></include>

          <!-- RAW JSON-LD -->
          <!-- absolute inset-0 so the code block fills the whole main area -->
          <include src="src/views/view-raw.html"></include>
        </main>
      </div>

      <!-- DETAIL PANEL (slide-in from right, for graph clicks) -->
      <include src="src/views/detail-panel.html"></include>
    </div>

    <!-- PARSING OVERLAY -->
    <include src="src/views/modal-progress.html"></include>

    <!-- LICENSE TEXT MODAL -->
    <include src="src/views/modal-license.html"></include>

    <!-- TOAST -->
    <div
      x-show="toastMsg"
      x-transition
      class="fixed bottom-5 right-5 bg-slate-700 text-white text-sm px-4 py-2 rounded-lg shadow-lg z-50"
      x-text="toastMsg"
    ></div>
  </body>
</html>
